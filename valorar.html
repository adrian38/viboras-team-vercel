<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Valorar partido</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/theme.css">
<link rel="icon" href="/image.png" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest" crossorigin="use-credentials">
<script src="/splash.js"></script>
<script src="/pwa.js" defer></script>
<script src="/auth-client.js" defer></script>
<script src="/vt-cargando.js"></script>
<meta name="apple-mobile-web-app-title" content="Viboras">
<meta name="theme-color" content="#121316">

<style>
.valorar-page{max-width:430px;padding-top:6px;gap:22px}
.valorar-cabecera{text-align:center;margin-bottom:0}
.valorar-cabecera img{width:96px;height:96px;border:2px solid rgba(245,158,11,.55);box-shadow:0 0 24px rgba(245,158,11,.2)}
.valorar-cabecera h3{margin:12px 0 1px;font-size:29px;line-height:34px;font-weight:800;letter-spacing:.055em}
.valorar-cabecera .vt-label{font-size:15px;letter-spacing:.12em;color:#a9adba}
.detalle{display:flex;flex-direction:column;gap:16px}
.resumen,.pregunta{background:#18191d;border:1px solid #30323a;border-radius:20px;padding:20px;box-shadow:0 8px 24px -4px rgba(0,0,0,.55)}
.resumen{position:relative;overflow:hidden}
.resumen::before{content:"";position:absolute;inset:0 0 auto;height:4px;background:linear-gradient(90deg,#f59e0b,#fbbf24)}
.partido{display:flex;flex-direction:column;gap:10px;padding-top:4px}
.partido+.partido{border-top:1px solid #292b32;margin-top:14px;padding-top:18px}
.partido__meta{display:flex;align-items:center;justify-content:space-between;gap:10px}
.partido__fecha{display:flex;align-items:center;gap:8px;color:#ffb000;font-family:var(--vt-font-head);font-size:13px;font-weight:800;letter-spacing:.05em;text-transform:uppercase}
.partido__fecha::before{content:"";width:10px;height:10px;border-radius:50%;background:#13a36f;flex:0 0 auto}
.partido__evento{max-width:52%;padding:3px 10px;border:1px solid #3a3d46;border-radius:999px;color:#aab0bf;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.equipo{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px;font-size:17px;font-weight:700;line-height:24px;color:#f6f7fa}
.equipo--ganador{color:#ffc000}
.equipo__sets{font-family:var(--vt-font-head);font-size:20px;font-weight:800;letter-spacing:.08em;color:#aeb3c2}
.equipo--ganador .equipo__sets{color:#ffc000}
.privacidad{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 0;padding-top:12px;border-top:1px solid #292b32;font-size:13px;color:#aab0bf}
.privacidad__texto{display:flex;align-items:center;gap:8px;min-width:0}
.privacidad__candado{width:14px;height:14px;flex:none;color:#fbbf24;fill:currentColor}
.privacidad__total{color:#ffc000;white-space:nowrap}
.pregunta{padding:20px}
.pregunta__titulo{display:flex;align-items:center;gap:10px}
.pregunta__marca{width:12px;height:12px;border-radius:2px;background:#f59e0b;flex:0 0 auto}
.pregunta h4{margin:0;color:#ffb000;font-size:23px;line-height:27px;font-weight:800;letter-spacing:.025em}
.pregunta>p{margin:1px 0 16px;color:#aab0bf;font-size:14px}
.voto{display:flex;flex-direction:column;gap:9px;padding:17px 0;border-top:1px solid #25272e}
.voto:first-of-type{border-top:0;padding-top:0}
.voto:last-child{padding-bottom:0}
.voto__cabecera{display:flex;align-items:center;justify-content:space-between;gap:8px}
.voto__nombre{font-weight:700;font-size:16px;color:#f4f5f8}
.voto__nivel{padding:3px 9px;border:1px solid rgba(245,158,11,.55);border-radius:7px;background:rgba(245,158,11,.08);color:#ffb000;font-family:var(--vt-font-head);font-size:11px;font-weight:800;letter-spacing:.035em;text-transform:uppercase}
.opciones{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
.opcion{
  min-width:0;height:48px;padding:4px 3px;background:#23252b;color:#f2f3f6;
  border:1px solid #30323a;border-radius:13px;font-family:var(--vt-font-body);
  font-size:11px;font-weight:600;line-height:1.1;cursor:pointer;white-space:normal;
}
.pregunta--nivel .opcion{height:44px;font-size:12px}
.opcion__icono{display:block;margin-bottom:2px;font-size:14px}
.opcion[aria-pressed="true"]{background:linear-gradient(135deg,#f59e0b,#ea8d00);border-color:#ffab00;color:#090a0c;font-weight:700;box-shadow:0 7px 17px rgba(245,158,11,.36)}
.enviar-valoracion{width:100%;min-height:48px;margin-top:8px;border-radius:12px;font-family:var(--vt-font-head);font-size:16px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;box-shadow:0 7px 20px rgba(245,158,11,.38)}
.boton__flecha{width:16px;height:16px;flex:none;fill:none;stroke:currentColor}
.acciones-volver{margin-top:-12px}
.volver-valoracion{width:100%;min-height:44px;border-radius:12px;font-family:var(--vt-font-head);font-size:14px;font-weight:800;letter-spacing:.045em;text-transform:uppercase;text-decoration:none}
.volver-valoracion .boton__flecha{color:#848996}
.valorar-pie{margin:-2px 0 0;color:#6f7482;font-size:11px;line-height:20px;text-align:center}
.estado{margin-top:var(--vt-sm);font-size:14px;color:var(--vt-muted)}
.estado:empty{display:none}
.lista a{display:block;padding:12px 0;border-bottom:1px solid var(--vt-border);color:var(--vt-text);overflow-wrap:anywhere}
.lista a span{color:var(--vt-muted);font-size:13px}
@media(max-width:359px){.resumen,.pregunta{padding:16px}.opciones{gap:5px}.opcion{padding-inline:2px;font-size:11px}.equipo{font-size:15px}}
</style>
</head>

<body>

<div class="vt-page valorar-page">

  <div class="valorar-cabecera">
    <img src="/image.png" alt="Víboras Team" width="80" height="80" style="border-radius:var(--vt-r-lg)">
    <h3 class="vt-gold">Víboras Team</h3>
    <span class="vt-label">Valorar partido</span>
  </div>

  <div class="vt-card vt-card--accent" id="contenido">
    <p class="estado">Cargando…</p>
  </div>

  <div class="acciones-volver">
    <a class="vt-btn vt-btn--ghost volver-valoracion" href="/" id="volverInicio">Volver al inicio</a>
  </div>
  <p class="valorar-pie">Víboras Padel System © 2024 • Valoraciones seguras y confidenciales</p>
</div>

<script src="/vt-glicko.js"></script>
<script src="/vt-categorias.js"></script>
<script src="/nivel-votos.js"></script>
<script src="/rating-inicial.js"></script>
<script>
// Las valoraciones son anonimas: nadie ve quien voto que. «Nivel» cuenta en
// la fiabilidad del rating (nivel-votos.js); «ambiente» se guarda y no cuenta.
// Detalle: ai_context/valoraciones_y_avisos.md
const PREGUNTAS = [
  {
    campo: 'actitud', titulo: '¿Qué tal el ambiente?',
    texto: 'Cómo te sentiste jugando con cada uno.',
    opciones: [['buen_rollo', '👍', 'Buen rollo'], ['neutro', '😐', 'Neutro'], ['mejorable', '👎', 'No tan bien']]
  },
  {
    campo: 'nivel', titulo: '¿Estaban en su nivel?',
    texto: 'Comparado con su rating: ¿jugó como cabía esperar?',
    opciones: [['por_debajo', '', 'Por debajo'], ['en_su_nivel', '', 'En su nivel'], ['por_encima', '', 'Por encima']]
  }
];

function el(tag, clase, texto) {
  const n = document.createElement(tag);
  if (clase) n.className = clase;
  if (texto !== undefined) n.textContent = texto;
  return n;
}

function iconoCandado() {
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('class', 'privacidad__candado');
  svg.setAttribute('viewBox', '0 0 20 20');
  svg.setAttribute('aria-hidden', 'true');
  const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  path.setAttribute('fill-rule', 'evenodd');
  path.setAttribute('clip-rule', 'evenodd');
  path.setAttribute('d', 'M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z');
  svg.appendChild(path);
  return svg;
}

function iconoFlecha(d, ancho) {
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('class', 'boton__flecha');
  svg.setAttribute('viewBox', '0 0 24 24');
  svg.setAttribute('aria-hidden', 'true');
  const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  path.setAttribute('d', d);
  path.setAttribute('stroke-width', ancho);
  path.setAttribute('stroke-linecap', 'round');
  path.setAttribute('stroke-linejoin', 'round');
  svg.appendChild(path);
  return svg;
}

function diaYMes(fecha) {
  const iso = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(fecha || ''));
  return iso ? `${iso[3]}/${iso[2]}` : String(fecha || '').slice(0, 5);
}

async function pedir(url, opciones) {
  const res = await fetch(url, opciones);
  const json = await res.json().catch(() => ({}));
  if (!res.ok || !json.ok) throw new Error(json.message || 'No se pudo cargar.');
  return json;
}

function pintarLista(caja, partidos) {
  caja.textContent = '';
  caja.appendChild(el('h4', '', 'Tus partidos de los últimos 14 días'));
  if (!partidos.length) {
    caja.appendChild(el('p', 'estado', 'No tienes partidos recientes para valorar.'));
    return;
  }
  const lista = el('div', 'lista');
  partidos.forEach((p) => {
    // Con las parejas: dos partidos el mismo dia se distinguen.
    const j = p.jugadores || [];
    const a = el('a', '', `Partido del ${diaYMes(p.fecha)} · ${j[0]} / ${j[1]} vs ${j[2]} / ${j[3]} `);
    a.href = `/valorar?partido=${p.id}`;
    const falta = p.faltanActitud + p.faltanNivel;
    a.appendChild(el('span', '', falta ? `· te faltan ${falta} respuestas` : '· valorado'));
    lista.appendChild(a);
  });
  caja.appendChild(lista);
}

// Una fila por compañero con un boton por opcion; pulsar marca y desmarca.
function pintarVoto(pregunta, jugador, elegidos) {
  const fila = el('div', 'voto');
  const cabecera = el('div', 'voto__cabecera');
  cabecera.appendChild(el('div', 'voto__nombre', jugador.name));
  if (jugador.categoria) cabecera.appendChild(el('span', 'voto__nivel', jugador.categoria));
  fila.appendChild(cabecera);
  const opciones = el('div', 'opciones');
  pregunta.opciones.forEach(([valor, icono, etiqueta]) => {
    const b = el('button', 'opcion');
    b.type = 'button';
    if (icono) b.appendChild(el('span', 'opcion__icono', icono));
    b.appendChild(el('span', '', etiqueta));
    b.setAttribute('aria-pressed', String(jugador[pregunta.campo] === valor));
    b.addEventListener('click', () => {
      const ya = elegidos.get(jugador.id) === valor;
      elegidos.set(jugador.id, ya ? null : valor);
      opciones.querySelectorAll('.opcion').forEach((o) => o.setAttribute('aria-pressed', 'false'));
      b.setAttribute('aria-pressed', String(!ya));
    });
    opciones.appendChild(b);
  });
  fila.appendChild(opciones);
  return fila;
}

async function enviar(ids, pregunta, elegidos) {
  const votos = [...elegidos].filter(([, v]) => v).map(([playerId, v]) => ({ playerId, [pregunta.campo]: v }));
  if (!votos.length) return 0;
  await pedir('/api/avisos?action=valorar', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ partido: ids.join(','), votos })
  });
  return votos.length;
}

function pintarPregunta(ids, pregunta, otros) {
  const caja = el('div', `pregunta pregunta--${pregunta.campo}`);
  const titulo = el('div', 'pregunta__titulo');
  titulo.appendChild(el('span', 'pregunta__marca'));
  titulo.appendChild(el('h4', '', pregunta.titulo));
  caja.appendChild(titulo);
  caja.appendChild(el('p', '', pregunta.texto));
  const elegidos = new Map(otros.map((j) => [j.id, j[pregunta.campo]]));
  otros.forEach((j) => caja.appendChild(pintarVoto(pregunta, j, elegidos)));
  return { caja, pregunta, elegidos };
}

async function enviarTodo(ids, controles, boton, estado) {
  boton.disabled = true;
  estado.textContent = 'Enviando…';
  try {
    const cantidades = await Promise.all(controles.map((c) => enviar(ids, c.pregunta, c.elegidos)));
    const total = cantidades.reduce((suma, n) => suma + n, 0);
    if (!total) estado.textContent = 'Elige al menos una respuesta.';
    else estado.textContent = total < 6 ? 'Guardado. Te quedan respuestas por completar.' : 'Guardado. ¡Gracias!';
  } catch (e) {
    estado.textContent = e.message;
  } finally {
    boton.disabled = false;
  }
}

async function ponerCategorias(datos) {
  const nombres = datos.otros.map((j) => j.name);
  const [, , partidos] = await Promise.all([
    window.vtNivel.listo, window.vtInicial.listo, window.vtGlicko.leerPartidos()
  ]);
  const ratings = new Map(window.vtGlicko.calcularRatings(nombres, partidos).map((r) => [r.name, r.rating]));
  datos.otros.forEach((j) => { j.categoria = window.categoriaDeRating(ratings.get(j.name)); });
  return datos;
}

function marcadorDelPartido(p) {
  const tanteos = p.sets.map((s) => s.split('-').map(Number));
  const juegos1 = tanteos.map((s) => s[0]).join(' · ');
  const juegos2 = tanteos.map((s) => s[1]).join(' · ');
  const sets1 = tanteos.filter((s) => s[0] > s[1]).length;
  const sets2 = tanteos.filter((s) => s[1] > s[0]).length;
  return { juegos1, juegos2, ganador: sets1 === sets2 ? 0 : (sets1 > sets2 ? 1 : 2) };
}

function pintarResumen(partidos, total) {
  const resumen = el('div', 'resumen');
  partidos.forEach((p) => {
    const cabecera = el('div', 'partido');
    const meta = el('div', 'partido__meta');
    meta.appendChild(el('span', 'partido__fecha', `Partido del ${diaYMes(p.fecha)}`));
    if (p.evento) meta.appendChild(el('span', 'partido__evento', p.evento));
    cabecera.appendChild(meta);
    const marcador = marcadorDelPartido(p);
    const equipo1 = el('div', `equipo${marcador.ganador === 1 ? ' equipo--ganador' : ''}`);
    equipo1.appendChild(el('span', '', p.equipo1.join(' / ')));
    equipo1.appendChild(el('span', 'equipo__sets', marcador.juegos1));
    const equipo2 = el('div', `equipo${marcador.ganador === 2 ? ' equipo--ganador' : ''}`);
    equipo2.appendChild(el('span', '', p.equipo2.join(' / ')));
    equipo2.appendChild(el('span', 'equipo__sets', marcador.juegos2));
    cabecera.appendChild(equipo1);
    cabecera.appendChild(equipo2);
    resumen.appendChild(cabecera);
  });
  const privacidad = el('div', 'privacidad');
  const texto = el('span', 'privacidad__texto');
  texto.appendChild(iconoCandado());
  texto.appendChild(el('span', '', 'Las respuestas son 100% anónimas'));
  privacidad.appendChild(texto);
  privacidad.appendChild(el('span', 'privacidad__total', `${total} evaluados`));
  resumen.appendChild(privacidad);
  return resumen;
}

// Uno o varios partidos (mismo dia, mismos cuatro): una cabecera por partido
// y las preguntas una sola vez, para todos a la vez.
function pintarPartido(caja, datos) {
  caja.textContent = '';
  caja.className = 'detalle';
  caja.appendChild(pintarResumen(datos.partidos, datos.otros.length));
  const ids = datos.partidos.map((p) => p.id);
  const controles = PREGUNTAS.map((q) => pintarPregunta(ids, q, datos.otros));
  controles.forEach((c) => caja.appendChild(c.caja));
  const boton = el('button', 'vt-btn enviar-valoracion');
  boton.type = 'button';
  boton.appendChild(el('span', '', 'Enviar valoración'));
  boton.appendChild(iconoFlecha('M14 5l7 7m0 0l-7 7m7-7H3', '2.5'));
  const estado = el('div', 'estado');
  boton.addEventListener('click', () => enviarTodo(ids, controles, boton, estado));
  caja.appendChild(boton);
  caja.appendChild(estado);
}

async function iniciar() {
  const caja = document.getElementById('contenido');
  const id = new URLSearchParams(location.search).get('partido');
  try {
    const datos = await window.vtCargando.arranque(
      async () => {
        const cargados = await pedir(id ? `/api/avisos?action=partido&id=${encodeURIComponent(id)}` : '/api/avisos?action=pendientes');
        return id ? ponerCategorias(cargados) : cargados;
      },
      'Buscando tus partidos'
    );
    if (id) pintarPartido(caja, datos);
    else pintarLista(caja, datos.partidos);
  } catch (e) {
    caja.textContent = '';
    caja.appendChild(el('p', 'estado', e.message));
  }
}

// En DOMContentLoaded y no al vuelo: pintarLista toca el DOM de la pagina,
// que este <script> todavia esta parseando cuando corre.
document.getElementById('volverInicio').prepend(iconoFlecha('M10 19l-7-7m0 0l7-7m-7 7h18', '2'));
document.addEventListener('DOMContentLoaded', iniciar);
</script>

</body>
</html>
