<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Disponibilidad</title>
<link rel="icon" href="/image.png" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<script src="/pwa.js" defer></script>
<meta name="apple-mobile-web-app-title" content="Viboras">
<meta name="theme-color" content="#121316">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/theme.css">

<style>
/* Rejilla de horas. Los nombres .slot y .selected los usa el script para
   leer la seleccion, asi que se conservan. */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(84px, 1fr));
  gap:var(--vt-sm);
  margin:var(--vt-lg) 0;
}

.slot{
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:56px;
  padding:10px 6px;
  background:var(--vt-surface-2);
  border:1px solid var(--vt-border);
  border-radius:var(--vt-r);
  color:var(--vt-text);
  font-family:var(--vt-font-head);
  font-size:17px;
  font-weight:600;
  letter-spacing:0.02em;
  cursor:pointer;
  user-select:none;
  transition:background .12s ease,border-color .12s ease,color .12s ease;
}
.slot:hover{background:var(--vt-surface-3);border-color:var(--vt-gold-dark)}

/* Marcado: oro solido, que es la senal mas fuerte del sistema. */
.selected{
  background:var(--vt-gold);
  border-color:var(--vt-gold);
  color:#121316;
  font-weight:800;
}
.selected:hover{background:var(--vt-yellow);border-color:var(--vt-yellow)}

#warning{color:var(--vt-error)}

.acciones{display:flex;flex-wrap:wrap;gap:var(--vt-sm);justify-content:center;margin-top:var(--vt-lg)}

@media(max-width:600px){
  .grid{grid-template-columns:repeat(auto-fit, minmax(72px, 1fr))}
  .slot{font-size:15px;min-height:52px}
  .acciones .vt-btn{flex:1;min-width:96px}
}
</style>
</head>
<body>

<div class="vt-page vt-page--narrow">

  <div style="text-align:center">
    <img src="/image.png" alt="Víboras Team" width="88" height="88" style="border-radius:var(--vt-r-lg);filter:drop-shadow(0 4px 16px rgba(245,158,11,0.25))">
  </div>

  <div class="vt-card vt-card--accent" style="text-align:center">

    <h1 id="title"></h1>

    <div id="warning" style="margin:10px 0; font-size:0.95rem; display:none;">
      Atención: si queda menos de 48 horas es posible que no haya pistas disponibles
    </div>

    <select id="name" class="vt-select" style="max-width:380px;margin:var(--vt-md) auto 0;text-align:center"></select>

    <div id="info" class="vt-small" style="margin:var(--vt-sm) 0 0">
      Marca todas las horas en las que puedes jugar
    </div>

    <div class="grid" id="slots"></div>

    <div class="acciones">
      <button class="vt-btn send" onclick="submitVote()">Enviar</button>
      <button class="vt-btn vt-btn--ghost view" onclick="viewResults()">Ver votos</button>
      <button class="vt-btn vt-btn--ghost back" onclick="goBack()"><span class="ms ms--sm" aria-hidden="true">arrow_back</span>Atrás</button>
    </div>

  </div>
</div>

<script>
const params = new URLSearchParams(window.location.search)
const date = params.get("date")

const selectedDate = new Date(date)
const today = new Date()

const diffTime = selectedDate - today
const diffDays = diffTime / (1000 * 60 * 60 * 24)

if(diffDays < 2){
  document.getElementById("warning").style.display = "block"
}

const readonly = params.get("readonly") === "1"

const parts = date.split("-")
const formatted = `${parts[2]}/${parts[1]}/${parts[0]}`
document.getElementById("title").innerText = formatted

const slotsDiv = document.getElementById("slots")
const slots = []

for(let h=9; h<=21; h++){
  const time = `${h}:00`
  slots.push(time)
  const div = document.createElement("div")
  div.className = "slot"
  div.dataset.time = time
  div.innerText = time
  if(!readonly){
    div.onclick = ()=> div.classList.toggle("selected")
  }
  slotsDiv.appendChild(div)
}

async function loadSlots(){
  const res = await fetch(`/api/read?action=getSlots&date=${date}`)
  const data = await res.json()
  document.querySelectorAll(".slot").forEach(el=>{
    const t = el.dataset.time
    const count = data[t]?.length || 0
    if(count===0 && readonly){
      el.style.display="none"
    } else {
      el.innerText = `${t} (${count})`
    }
  })
}

async function submitVote(){

  const name = document.getElementById("name").value

  const selected = [...document.querySelectorAll(".selected")]
      .map(e=>e.dataset.time)

  await fetch("/api/write?action=submitVote",{
    method:"POST",
    body:JSON.stringify({
      date,
      name,
      slots:selected
    })
  })

  document.querySelectorAll(".slot").forEach(el=>{
    el.classList.remove("selected")
  })

  await loadSlots()
  window.location.reload()

}

function viewResults(){
  window.location = `/results?date=${date}`
}

function goBack(){
  window.location = "/"
}

loadSlots()

// populate name select from registered names
async function loadNames(){
  const isLocal = location.hostname==="localhost" || location.hostname==="127.0.0.1"
  try{
    const res = await fetch("/api/read?action=getNames")
    const db = await res.json()
    const names = (db && db.names)
      ? db.names.slice().sort((a, b) => a.toLowerCase().localeCompare(b.toLowerCase()))
      : []
    const sel = document.getElementById('name')
    sel.innerHTML = ''
    const empty = document.createElement('option')
    empty.value = ''
    empty.innerText = '-- Selecciona tu nombre --'
    sel.appendChild(empty)
    for(const n of names){
      const o = document.createElement('option')
      o.value = n
      o.innerText = n
      sel.appendChild(o)
    }
  }catch(e){
    console.error('Could not load names',e)
  }
}

loadNames()
</script>

</body>
</html>
