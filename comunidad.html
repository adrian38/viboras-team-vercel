<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comunidad</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/theme.css">
<link rel="icon" href="/image.png" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest" crossorigin="use-credentials">
<script src="/splash.js"></script>
<script src="/pwa.js" defer></script>
<script src="/auth-client.js" defer></script>
<script src="/vt-cargando.js"></script>
<script src="/vt-glicko.js"></script>
<script src="/vt-categorias.js"></script>
<meta name="apple-mobile-web-app-title" content="Viboras">
<meta name="theme-color" content="#121316">

<style>
body{padding:64px 0 var(--vt-lg);background:#121316}
.barra{
  position:fixed;inset:0 0 auto;z-index:var(--vt-z-flotante);height:64px;
  padding:env(safe-area-inset-top) max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left));
  display:flex;align-items:center;gap:var(--vt-sm);
  background:rgba(18,19,22,.92);backdrop-filter:blur(14px);box-shadow:0 4px 20px rgba(0,0,0,.6);
}
.barra__volver{width:40px;height:40px;display:grid;place-items:center;color:var(--vt-text);text-decoration:none}
.barra__logo{width:32px;height:32px;border-radius:var(--vt-r-full);box-shadow:var(--vt-glow)}
.barra__texto{display:flex;flex-direction:column;min-width:0}
.barra__marca{font-family:var(--vt-font-head);font-size:12px;line-height:14px;font-weight:700;letter-spacing:.1em;color:var(--vt-gold-soft)}
.barra__titulo{font-family:var(--vt-font-head);font-size:18px;line-height:20px;font-weight:700;text-transform:uppercase;color:#e3e2e6}
.comunidad{max-width:760px;gap:0;padding:var(--vt-sm) 16px 0}
.presentacion{position:relative;margin-bottom:var(--vt-sm)}
.presentacion::before{content:'';position:absolute;inset:-30px 20% auto;height:80px;background:rgba(245,158,11,.08);filter:blur(32px);pointer-events:none}
.cabeza{position:relative;display:flex;align-items:center;justify-content:space-between;gap:var(--vt-sm)}
.cabeza__texto{display:flex;flex-direction:column}
.cabeza h1{margin:0;font-size:22px;line-height:26px;color:#e3e2e6;text-transform:uppercase}
.cabeza .vt-label{color:var(--vt-gold-soft)}
.contador{border:0;border-radius:var(--vt-r-full);background:#292a2d;color:#ffc174;white-space:nowrap;font-family:var(--vt-font-head)}
.contador::before{content:'';display:inline-block;width:7px;height:7px;margin-right:6px;border-radius:50%;background:var(--vt-gold)}
.buscador{position:relative;margin-top:var(--vt-md)}
.buscador .vt-input{padding:12px 40px;background:#1b1b1f;border:0;border-radius:var(--vt-r-md)}
.buscador .ms{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#d8c3ad;pointer-events:none}
.buscador .vt-input{color:#e3e2e6}
.buscador .vt-input::placeholder{color:#534434}

.filtros{display:flex;gap:var(--vt-sm);margin:0 -16px;padding:var(--vt-md) 16px;overflow-x:auto;scrollbar-width:none}
.filtros::-webkit-scrollbar{display:none}
.filtro{
  flex:0 0 auto;padding:7px 14px;
  background:#292a2d;color:#d8c3ad;
  border:0;border-radius:var(--vt-r-full);
  font-family:var(--vt-font-head);font-size:14px;line-height:18px;font-weight:700;cursor:pointer;
  text-transform:uppercase;letter-spacing:0.05em;
}
.filtro[aria-pressed="true"]{background:#f59e0b;color:#613b00;font-weight:700}

.lista{display:flex;flex-direction:column;gap:12px;margin-top:0}
.jugador{
  background:#1b1b1f;
  border:0;
  border-radius:var(--vt-r-md);
  padding:16px;
  display:flex;flex-direction:column;gap:14px;box-shadow:var(--vt-shadow-card);
}
.jugador[hidden]{display:none}
.jugador__cabeza{display:flex;align-items:center;gap:var(--vt-sm);min-width:0}
/* La columna del medio: nombre arriba y, debajo, la categoria actual,
   igual que la maqueta. `min-width:0` para que el nombre largo se parta en
   vez de empujar al numero de la derecha fuera de la tarjeta. */
.jugador__id{display:flex;flex:1 1 auto;flex-direction:column;gap:2px;min-width:0}
.jugador__linea{display:flex;align-items:center;gap:8px;min-width:0}
.jugador__nivel{font-size:12px;line-height:16px;color:#d8c3ad;overflow-wrap:anywhere}
/* No hay fotos de jugador en el proyecto: el circulo lleva las iniciales del
   nombre, que es lo que hay. */
.jugador__iniciales{
  flex:0 0 auto;width:48px;height:48px;border-radius:var(--vt-r-full);
  background:#292a2d;color:#ffc174;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--vt-font-head);font-size:18px;font-weight:700;letter-spacing:0.02em;
}
.jugador__nombre{
  margin:0;min-width:0;
  font-family:var(--vt-font-head);
  font-size:18px;line-height:22px;font-weight:700;letter-spacing:0.02em;
  text-transform:uppercase;color:#e3e2e6;
  overflow-wrap:anywhere;
}
.jugador__cuentas{margin-left:auto;flex:0 0 auto;text-align:right}
.jugador__numero{font-family:var(--vt-font-head);font-size:18px;line-height:22px;font-weight:700;color:#ffc174;display:block}
.jugador__nota{font-family:var(--vt-font-head);font-size:12px;line-height:14px;letter-spacing:0.06em;text-transform:uppercase;color:#a08e7a}

/* La tira de tres casillas de la maqueta: lado, ganados y horarios. Tres en
   fila incluso a 375 px, como alli; `minmax(0,1fr)` y no `auto-fit` para que
   no se baje ninguna. Solo se pinta la que tiene dato: un hueco maquetado
   seria un dato inventado, asi que quien no rellenó horarios enseña dos. */
.datos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--vt-sm);padding:10px;background:rgba(13,14,17,.7);border-radius:var(--vt-r)}
.datos--1{grid-template-columns:minmax(0,1fr)}
.datos--2{grid-template-columns:repeat(2,minmax(0,1fr))}
.dato{
  background:rgba(41,42,45,.6);
  border:0;
  border-radius:var(--vt-r-sm);
  padding:4px;text-align:center;
  display:flex;flex-direction:column;justify-content:center;gap:2px;
}
.dato__clave{display:block;font-family:var(--vt-font-head);font-size:12px;line-height:14px;letter-spacing:0.06em;text-transform:uppercase;color:#534434}
.dato__valor{display:flex;align-items:center;justify-content:center;gap:2px;font-family:var(--vt-font-head);font-size:14px;line-height:18px;font-weight:700;color:#e3e2e6;overflow-wrap:anywhere}
.dato--gold .dato__valor{color:#ffc174;text-transform:uppercase}
.dato--calificacion .dato__valor{color:#ffc640}
.dato:last-child .dato__valor{font-family:var(--vt-font-body);font-size:12px;line-height:16px;font-weight:500}
.estrella{display:block;width:14px;height:14px;fill:#ffc640}
.jugador__pie{display:flex;align-items:center;justify-content:space-between;gap:var(--vt-sm);min-height:36px}
.jugador__resumen{font-size:12px;line-height:16px;color:#ffc640}
.jugador__resumen::before{content:'';display:inline-block;width:8px;height:8px;margin-right:7px;border-radius:50%;background:var(--vt-gold);vertical-align:1px}
.jugador__accion{min-height:36px;padding:7px 16px;border-radius:var(--vt-r-full);background:#f59e0b;color:#613b00;font-family:var(--vt-font-head);font-size:14px;line-height:18px;letter-spacing:.05em;text-transform:uppercase}
.jugador__accion:hover,.jugador__accion:focus-visible{color:#613b00}
.estado{font-size:14px;color:var(--vt-muted);min-height:20px}
.aviso{font-size:14px;color:var(--vt-muted);margin:0}
.acciones{margin-top:var(--vt-xl);display:flex;flex-wrap:wrap;gap:var(--vt-sm);justify-content:center}
</style>
</head>

<body>
<header class="barra">
  <a class="barra__volver" href="/" aria-label="Volver al inicio"><span class="ms notranslate" translate="no" aria-hidden="true">arrow_back</span></a>
  <img class="barra__logo" src="/image.png" alt="">
  <div class="barra__texto">
    <span class="barra__marca">VÍBORAS TEAM</span>
    <span class="barra__titulo">Comunidad</span>
  </div>
</header>

<main class="vt-page comunidad">
  <section class="presentacion" aria-labelledby="titulo-comunidad">
    <div class="cabeza">
      <div class="cabeza__texto">
        <span class="vt-label">Directorio oficial</span>
        <h1 id="titulo-comunidad">Comunidad Víboras</h1>
      </div>
      <span class="vt-chip vt-chip--gold contador" id="cuantos">—</span>
    </div>
    <div class="buscador">
      <span class="ms ms--sm notranslate" translate="no" aria-hidden="true">search</span>
      <label class="vt-label" for="buscar" style="position:absolute;left:-9999px">Buscar jugador</label>
      <input class="vt-input" id="buscar" type="search" placeholder="Buscar compañero por nombre o nivel…">
    </div>

    <div class="filtros" id="filtros" role="group" aria-label="Filtrar jugadores"></div>
  </section>

  <div class="lista" id="lista"><p class="estado">Cargando…</p></div>

  <footer class="acciones"><span class="vt-label">Víboras Team · Comunidad de jugadores</span></footer>
</main>

<script src="/nivel-votos.js"></script>
<script src="/rating-inicial.js"></script>
<script>
// El directorio del grupo. Todo lo que se enseña aquí sale de /api/read
// (action=getComunidad): ficha, formulario y opiniones agregadas. Rating y RD
// salen del mismo vt-glicko.js que usa /rating; no hay una copia del motor.
// No hay fotos de jugador ni horas privadas de /day. Detalle:
// ai_context/comunidad_de_jugadores.md
const LADOS = { drive: 'Drive', reves: 'Revés', ambos: 'Ambos' };
let jugadores = [];
let filtro = 'todos';

function el(tag, clase, texto) {
  const n = document.createElement(tag);
  if (clase) n.className = clase;
  if (texto !== undefined) n.textContent = texto;
  return n;
}

// Dos letras como mucho: la primera de cada palabra del nombre.
function iniciales(nombre) {
  return String(nombre).split(/\s+/).filter(Boolean).slice(0, 2)
    .map((p) => p[0].toUpperCase()).join('');
}

function dato(clave, valor) {
  const caja = el('div', 'dato');
  caja.appendChild(el('span', 'dato__clave', clave));
  caja.appendChild(el('span', 'dato__valor', valor));
  return caja;
}

function datoValoracion(nota) {
  const caja = dato('Calificación', nota.toFixed(1));
  caja.classList.add('dato--calificacion');
  const icono = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  icono.setAttribute('class', 'estrella');
  icono.setAttribute('viewBox', '0 0 24 24');
  icono.setAttribute('aria-hidden', 'true');
  const forma = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  forma.setAttribute('d', 'M22 9.24l-7.19-.62L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21 12 17.27 18.18 21l-1.63-7.03L22 9.24zM12 15.4l-3.76 2.27 1-4.28-3.32-2.88 4.38-.38L12 6.1l1.71 4.04 4.38.38-3.32 2.88 1 4.28L12 15.4z');
  icono.appendChild(forma);
  caja.querySelector('.dato__valor').appendChild(icono);
  return caja;
}

function calificacion(j) {
  if (j.buenRollo === null || !Number.isFinite(j.rd)) return null;
  const fiabilidad = Math.min(1, Math.max(0, (window.MAX_RD - j.rd) / (window.MAX_RD - window.MIN_RD)));
  return Math.min(5, Math.max(1, 3 + 2 * fiabilidad * (2 * j.buenRollo - 1)));
}

function cabezaDeJugador(j) {
  const cabeza = el('div', 'jugador__cabeza');
  cabeza.appendChild(el('div', 'jugador__iniciales', iniciales(j.nombre)));
  const identidad = el('div', 'jugador__id');
  const linea = el('div', 'jugador__linea');
  linea.appendChild(el('h2', 'jugador__nombre', j.nombre));
  identidad.appendChild(linea);
  if (j.categoria) identidad.appendChild(el('span', 'jugador__nivel', j.categoria));
  cabeza.appendChild(identidad);
  const cuentas = el('div', 'jugador__cuentas');
  cuentas.appendChild(el('span', 'jugador__numero', Number.isFinite(j.rating) ? Math.round(j.rating).toLocaleString('en-US') : '—'));
  cuentas.appendChild(el('span', 'jugador__nota', 'Fiabilidad'));
  cabeza.appendChild(cuentas);
  return cabeza;
}

// Solo las casillas con dato. Quien no rellenó el formulario de alta (las
// cuentas anteriores al 2026-10-17) no tiene nivel ni horarios, y entonces no
// se pinta la casilla en vez de dejarla vacía.
function pintarJugador(j) {
  const caja = el('article', 'jugador');
  caja.dataset.lado = j.lado;
  caja.dataset.nombre = j.nombre.toLowerCase();
  caja.appendChild(cabezaDeJugador(j));
  const nota = calificacion(j);
  const cantidad = 1 + Number(nota !== null) + Number(Boolean(j.horarios));
  const datos = el('div', `datos datos--${cantidad}`);
  const lado = dato('Lado', LADOS[j.lado] || j.lado);
  lado.classList.add('dato--gold');
  datos.appendChild(lado);
  if (nota !== null) datos.appendChild(datoValoracion(nota));
  if (j.horarios) datos.appendChild(dato('Horarios', j.horarios));
  caja.appendChild(datos);
  const pie = el('div', 'jugador__pie');
  pie.appendChild(el('span', 'jugador__resumen', j.partidos ? `${j.ganados} ganados de ${j.partidos}` : 'Aún sin partidos'));
  const perfil = el('a', 'vt-btn jugador__accion', 'Ver evolución');
  perfil.href = `/players?player=${encodeURIComponent(j.nombre)}`;
  pie.appendChild(perfil);
  caja.appendChild(pie);
  return caja;
}

// Un filtro por lado de pista y uno por cada categoria actual del rating.
function pintarFiltros() {
  const caja = document.getElementById('filtros');
  caja.textContent = '';
  const categorias = [...new Set(jugadores.map((j) => j.categoria).filter(Boolean))].sort();
  const grupos = [['todos', `Todos (${jugadores.length})`]]
    .concat([['drive', 'Drive'], ['reves', 'Revés']].filter(([l]) => jugadores.some((j) => j.lado === l || j.lado === 'ambos')))
    .concat(categorias.map((c) => [`categoria:${c}`, c]));
  for (const [clave, nombre] of grupos) {
    const boton = el('button', 'filtro', nombre);
    boton.type = 'button';
    boton.setAttribute('aria-pressed', String(clave === filtro));
    boton.addEventListener('click', () => { filtro = clave; pintarFiltros(); aplicar(); });
    caja.appendChild(boton);
  }
}

function pasaElFiltro(j) {
  if (filtro === 'todos') return true;
  if (filtro.startsWith('categoria:')) return j.categoria === filtro.slice(10);
  return j.lado === filtro || j.lado === 'ambos';
}

// El filtro y la búsqueda se aplican juntos: elegir «Drive» y escribir un
// nombre tiene que cruzar las dos cosas, no quedarse con la última.
function aplicar() {
  const busca = document.getElementById('buscar').value.trim().toLowerCase();
  const lista = document.getElementById('lista');
  lista.textContent = '';
  const visibles = jugadores.filter((j) => {
    const texto = [j.nombre, j.categoria, LADOS[j.lado]].filter(Boolean).join(' ').toLowerCase();
    return pasaElFiltro(j) && texto.includes(busca);
  });
  if (!visibles.length) {
    lista.appendChild(el('p', 'estado', 'Ningún jugador encaja con eso.'));
    return;
  }
  visibles.forEach((j) => lista.appendChild(pintarJugador(j)));
}

async function cargar() {
  const lista = document.getElementById('lista');
  try {
    const res = await fetch('/api/read?action=getComunidad&ts=' + Date.now());
    const json = await res.json().catch(() => ({}));
    if (!res.ok || !json.ok) throw new Error('No se pudo cargar la comunidad. Inténtalo otra vez.');
    const nombres = json.jugadores.map((j) => j.nombre);
    const [, , partidos] = await Promise.all([window.vtNivel.listo, window.vtInicial.listo, window.vtGlicko.leerPartidos()]);
    const ratings = new Map(window.vtGlicko.calcularRatings(nombres, partidos).map((r) => [r.name, r]));
    jugadores = json.jugadores.map((j) => {
      const r = ratings.get(j.nombre) || {};
      return { ...j, rating: r.rating, rd: r.rd, categoria: window.categoriaDeRating(r.rating) };
    });
    document.getElementById('cuantos').textContent = `${jugadores.length} en activo`;
    pintarFiltros();
    aplicar();
  } catch (e) {
    lista.textContent = '';
    lista.appendChild(el('p', 'estado', e.message));
  }
}

document.getElementById('buscar').addEventListener('input', aplicar);
document.addEventListener('DOMContentLoaded', () => {
  vtCargando.arranque(cargar, 'Cargando la comunidad');
});
</script>

</body>
</html>
