<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rating</title>
<link rel="icon" href="/image.png" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<script src="/pwa.js" defer></script>
<meta name="apple-mobile-web-app-title" content="Viboras">
<meta name="theme-color" content="#121316">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/theme.css">
<style>
/* Las seis categorias y sus clases .tier-<key> estan descritas en
   ai_context/categorias_de_rating.md: cada una necesita su pareja de reglas
   o sale gris sin dar error. Siguen siendo seis. */

.controls{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:var(--vt-md);
  flex-wrap:wrap;
  margin-bottom:var(--vt-md);
  padding:var(--vt-sm) var(--vt-md);
  background:var(--vt-surface-2);
  border:1px solid var(--vt-border);
  border-radius:var(--vt-r-lg);
  font-size:13px;
  color:var(--vt-text);
}
.controls select{
  padding:6px 28px 6px 10px;
  background:var(--vt-surface-deep);
  border:1px solid var(--vt-border-strong);
  border-radius:var(--vt-r);
  color:var(--vt-text);
  font-family:inherit;
  font-size:13px;
  outline:none;cursor:pointer;
  appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--vt-muted) 50%),linear-gradient(135deg,var(--vt-muted) 50%,transparent 50%);
  background-position:calc(100% - 15px) 50%,calc(100% - 10px) 50%;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat;
}
.controls select:focus{border-color:var(--vt-gold)}
.controls select option{background:var(--vt-surface-2)}

/* Banda de categoria: el degradado ambar del mockup, con el punto dorado
   a la izquierda y el rango a la derecha. */
.tier-section{
  margin-bottom:var(--vt-lg);
  border-radius:var(--vt-r-lg);
  border:1px solid var(--vt-border);
  background:var(--vt-surface-2);
  overflow:hidden;
}
.tier-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:var(--vt-sm);
  margin:0;
  padding:9px 14px;
  font-family:var(--vt-font-head);
  font-size:19px;
  font-weight:700;
  letter-spacing:0.06em;
  text-transform:uppercase;
}
.tier-title > span:first-child{display:flex;align-items:center;gap:var(--vt-sm)}
.tier-title > span:first-child::before{
  content:'';
  width:7px;height:7px;border-radius:var(--vt-r-full);
  background:currentColor;
}
.tier-subtitle{
  font-family:var(--vt-font-body);
  font-size:11px;
  font-weight:700;
  letter-spacing:0.05em;
  color:var(--vt-muted);
  text-transform:none;
}

/* Escalera de intensidad: mas oro cuanto mas alta la categoria. El nombre y
   el rango ya dicen cual es; el tono solo ordena. */
.tier-entreno .tier-title{background:linear-gradient(90deg,rgba(245,158,11,0.30),transparent 70%);color:#ffd79a}
.tier-avanzado-alto .tier-title{background:linear-gradient(90deg,rgba(245,158,11,0.24),transparent 70%);color:#ffc97f}
.tier-avanzado-medio .tier-title{background:linear-gradient(90deg,rgba(245,158,11,0.18),transparent 70%);color:#f0b670}
.tier-intermedio-alto .tier-title{background:linear-gradient(90deg,rgba(245,158,11,0.13),transparent 70%);color:#dca564}
.tier-intermedio-medio .tier-title{background:linear-gradient(90deg,rgba(245,158,11,0.09),transparent 70%);color:#c69459}
.tier-iniciacion .tier-title{background:linear-gradient(90deg,rgba(245,158,11,0.06),transparent 70%);color:#b0854f}

table{width:100%;border-collapse:collapse;margin-top:0;table-layout:fixed}
th{
  padding:8px 10px;
  background:var(--vt-surface-3);
  color:var(--vt-muted);
  font-size:10px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;
  text-align:left;
  border-bottom:1px solid var(--vt-border-strong);
}
td{padding:9px 10px;border-bottom:1px solid var(--vt-border);color:var(--vt-text);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:var(--vt-surface-3)}

.rank-col{width:72px;text-align:center}
td.rank-col{color:var(--vt-muted);font-variant-numeric:tabular-nums}
.rating-col{width:96px;text-align:center}
/* El rating es el dato de la pagina: oro y condensada. */
td.rating-col{
  font-family:var(--vt-font-head);
  font-size:19px;font-weight:700;letter-spacing:0.02em;
  color:var(--vt-gold);
  font-variant-numeric:tabular-nums;
}
.fiabilidad-col{width:120px;text-align:center}
.name-col{font-weight:500;color:var(--vt-text);overflow-wrap:anywhere}
.name-col a{color:inherit;text-decoration:none}
.name-col a:hover{color:var(--vt-gold-light)}
.muted{color:var(--vt-muted)}

/* Cinco segmentos de fiabilidad. El color lo pone getFiabilidadConfig(), con
   el mismo rojo -> verde que explican las insignias de rating-info.html,
   aclarado para que se lea sobre el carbono: f87171, fb923c, facc15, a3e635
   y 4ade80. El segmento apagado y la cifra de RD tambien se escriben desde
   el script, en 343538 y d8c3ad. No se comenta ahi porque getFiabilidadConfig
   vive dentro de renderTable, que esta en el baseline de tools/code-size.mjs
   y solo puede encoger. */
.progress-segmented{
  display:inline-flex;
  align-items:center;
  gap:3px;
  padding:3px 4px;
  border:1px solid var(--vt-border-strong);
  border-radius:var(--vt-r-sm);
  background-color:var(--vt-surface-deep);
}
.progress-segment{
  width:7px;height:11px;
  border-radius:2px;
  transition:background-color .2s ease;
}

.info-btn{
  padding:9px 16px;
  background:transparent;
  border:1px solid var(--vt-border-gold);
  border-radius:var(--vt-r);
  color:var(--vt-gold-light);
  font-family:var(--vt-font-body);
  font-size:14px;font-weight:700;
  cursor:pointer;
  transition:background .15s ease,border-color .15s ease;
}
.info-btn:hover{background:rgba(245,158,11,0.12);border-color:var(--vt-gold)}

.back-btn{
  padding:9px 16px;
  background:transparent;
  border:1px solid var(--vt-border-strong);
  border-radius:var(--vt-r);
  color:var(--vt-text);
  font-family:var(--vt-font-body);
  font-size:14px;font-weight:700;
  cursor:pointer;
}
.back-btn:hover{border-color:var(--vt-gold);color:var(--vt-gold-light)}

/* Movil: los anchos fijos de arriba no caben en 375px, se reducen aqui.
   Detalle en ai_context/tabla_de_rating_en_movil.md */
@media(max-width:560px){
  .tier-title{flex-direction:column;align-items:flex-start;gap:2px;font-size:17px;padding:8px 10px}
  th,td{padding:8px 4px;font-size:13px}
  th{font-size:9px}
  td.rating-col{font-size:16px}
  .rank-col{width:30px}
  .rating-col{width:66px}
  .fiabilidad-col{width:74px}
  .progress-segmented{gap:2px;padding:2px 3px}
  .progress-segment{width:5px;height:10px}
  .controls{font-size:12px;gap:var(--vt-sm);padding:var(--vt-sm)}
}
</style>
</head>
<body>

<div class="vt-page">

  <div style="text-align:center">
    <img src="/image.png" alt="Víboras Team" width="88" height="88" style="border-radius:var(--vt-r-lg);filter:drop-shadow(0 4px 16px rgba(245,158,11,0.25))">
    <h1 class="vt-gold" style="margin-top:var(--vt-sm)">Rating</h1>
    <span class="vt-label">Víboras Ranking Circuit</span>
  </div>

  <div class="vt-card vt-card--accent">

    <div class="controls">
      <label style="display: flex; align-items: center; gap: 8px;">
        <span>Fecha:</span>
        <select id="ratingDate" onchange="handleFilterChange()">
          <option value="latest">Última disponible</option>
        </select>
      </label>

      <label style="cursor: pointer; display: flex; align-items: center; gap: 8px;">
        <input type="checkbox" id="toggleInactive" onchange="handleFilterChange()">
        <span>Incluir jugadores no activos</span>
      </label>

      <label style="display: flex; align-items: center; gap: 8px;">
        <span>Fiabilidad mínima:</span>
        <select id="minReliability" onchange="handleFilterChange()">
          <option value="any">Cualquiera</option>
          <option value="very_low" selected>Muy baja</option>
          <option value="low">Baja</option>
          <option value="medium">Media</option>
          <option value="high">Alta</option>
        </select>
      </label>

      <label style="display: flex; align-items: center; gap: 8px;">
        <input type="checkbox" id="toggleShowRD" onchange="handleFilterChange()">
        <span>Ver RD</span>
      </label>
    </div>

    <div id="ratingContainer">
      <div class="muted">Cargando ratings…</div>
    </div>

    <div style="margin-top:14px;display:flex;justify-content:space-between;align-items:center">
      <button class="info-btn" onclick="window.location.href='/rating-info.html'">
        💡 ¿Cómo funciona el rating?
      </button>
      <div style="text-align:right">
        <button class="back-btn" onclick="window.location='/'">Atrás</button>
      </div>
    </div>

  </div>
</div>

<script>
// ============================================================================
// GLICKO ENGINE
// ============================================================================

const Q = Math.LN10 / 400.0;
const C_DAILY = 15.0; // Daily decay constant
const INITIAL_RATING = 1500.0;
const INITIAL_RD = 350.0;
const MIN_RD = 80.0;
const MAX_RD = 350.0;

class GlickoPlayer {
  constructor(rating = INITIAL_RATING, rd = INITIAL_RD) {
    this.rating = rating;
    this.rd = rd;
  }
}

function g(rd) {
  return 1.0 / Math.sqrt(1.0 + (3.0 * Q * Q * rd * rd) / (Math.PI * Math.PI));
}

function expected(r, oppR, oppRd) {
  const gRd = g(oppRd);
  return 1.0 / (1.0 + Math.pow(10, (-gRd * (r - oppR)) / 400.0));
}

function decayAllPlayersOneDay(playerMap, activePlayersToday = new Set()) {
  playerMap.forEach((player, key) => {
    if (activePlayersToday.has(key)) return;
    const newRd = Math.min(Math.sqrt(player.rd * player.rd + C_DAILY * C_DAILY), MAX_RD);
    playerMap.set(key, new GlickoPlayer(player.rating, newRd));
  });
}

function getPlayerOrCreate(playerMap, name) {
  const trimmed = (name || '').trim();
  if (!trimmed) return new GlickoPlayer();
  if (!playerMap.has(trimmed)) {
    playerMap.set(trimmed, new GlickoPlayer());
  }
  return playerMap.get(trimmed);
}

function getTeamState(p1Key, p2Key, playerMap) {
  const p1 = getPlayerOrCreate(playerMap, p1Key);
  const p2 = getPlayerOrCreate(playerMap, p2Key);

  const teamR = (p1.rating + p2.rating) / 2.0;
  const teamRd = Math.sqrt(p1.rd * p1.rd + p2.rd * p2.rd) / 2.0;
  return { rating: teamR, rd: teamRd };
}

function getEffectiveObservationR(playerR, teamR, opponentTeamR) {
  return opponentTeamR + (playerR - teamR);
}

function getEffectiveObservationRd(opponentTeamRd, teammateRd) {
  const safeOpp = Number.isFinite(opponentTeamRd) ? opponentTeamRd : 0;
  const safeTeammate = Number.isFinite(teammateRd) ? teammateRd : 0;
  return Math.hypot(safeOpp, safeTeammate / 2);
}

function clamp(value, min, max) {
  return Math.max(min, Math.min(max, value));
}

function getReliabilityWeight(rdObs) {
  const RD_DISCOUNT_START = 110.56;
  const RD_ALL_FRESH = Math.sqrt(3.0) * MAX_RD / 2.0;
  const MIN_RELIABILITY_WEIGHT = 0.50;
  const CURVE = 1.0;

  const t = clamp(
    (rdObs - RD_DISCOUNT_START) / (RD_ALL_FRESH - RD_DISCOUNT_START),
    0.0,
    1.0
  );

  return 1.0 - (1.0 - MIN_RELIABILITY_WEIGHT) * Math.pow(t, CURVE);
}

function updatePeriod(playerMap, periodMatches) {
  const starting = new Map();
  playerMap.forEach((p, name) => {
    starting.set(name, new GlickoPlayer(p.rating, p.rd));
  });

  const observations = new Map();

  for (const m of periodMatches) {
    const t1State = getTeamState(m.team1[0], m.team1[1], starting);
    const t2State = getTeamState(m.team2[0], m.team2[1], starting);

    const scoreT1 = m.score;
    const scoreT2 = 1.0 - m.score;

    m.team1.forEach((p, idx) => {
      const teammate = m.team1[1 - idx] || p;
      const teammateRd = getPlayerOrCreate(starting, teammate).rd;
      const teammateR = getPlayerOrCreate(starting, teammate).rating;
      const playerR = getPlayerOrCreate(starting, p).rating;
      const effectiveObservationR = getEffectiveObservationR(playerR, (playerR + teammateR) / 2.0, t2State.rating);
      if (!observations.has(p)) observations.set(p, []);
      observations.get(p).push({ oppR: effectiveObservationR, oppRd: t2State.rd, teammateRd, score: scoreT1, weight: m.weight });
    });

    m.team2.forEach((p, idx) => {
      const teammate = m.team2[1 - idx] || p;
      const teammateRd = getPlayerOrCreate(starting, teammate).rd;
      const teammateR = getPlayerOrCreate(starting, teammate).rating;
      const playerR = getPlayerOrCreate(starting, p).rating;
      const effectiveObservationR = getEffectiveObservationR(playerR, (playerR + teammateR) / 2.0, t1State.rating);
      if (!observations.has(p)) observations.set(p, []);
      observations.get(p).push({ oppR: effectiveObservationR, oppRd: t1State.rd, teammateRd, score: scoreT2, weight: m.weight });
    });
  }

  observations.forEach((obsList, pName) => {
    const player = getPlayerOrCreate(starting, pName);
    const r = player.rating;
    const rd = player.rd;

    let d2Inv = 0.0;
    let sumDelta = 0.0;

    for (const obs of obsList) {
      const effectiveObservationRd = getEffectiveObservationRd(obs.oppRd, obs.teammateRd);
      const gRd = g(effectiveObservationRd);
      const eVal = expected(r, obs.oppR, effectiveObservationRd);

      const w3 = getReliabilityWeight(effectiveObservationRd);
      const effectiveWeight = obs.weight * w3;

      d2Inv += effectiveWeight * Q * Q * gRd * gRd * eVal * (1.0 - eVal);
      sumDelta += effectiveWeight * gRd * (obs.score - eVal);
    }

    if (d2Inv <= 0) return;

    let newRd = 1.0 / Math.sqrt((1.0 / (rd * rd)) + d2Inv);
    newRd = Math.max(newRd, MIN_RD);

    const newR = r + (Q / ((1.0 / (rd * rd)) + d2Inv)) * sumDelta;

    playerMap.set(pName, new GlickoPlayer(newR, newRd));
  });
}

function calculateEngineRatings(names, matches, cutoffDateIso) {
  const playerMap = new Map();
  names.forEach(n => {
    if (n && n.trim()) playerMap.set(n.trim(), new GlickoPlayer());
  });

  if (!matches || matches.length === 0) {
    return Array.from(playerMap.entries()).map(([name, p]) => ({
      name,
      rating: p.rating,
      rd: p.rd
    }));
  }

  matches.forEach(m => {
    m.team1.concat(m.team2).forEach(pName => {
      getPlayerOrCreate(playerMap, pName);
    });
  });

  matches.sort((a, b) => {
    const dComp = a.date.localeCompare(b.date);
    return dComp !== 0 ? dComp : (a.id - b.id);
  });

  const byDate = new Map();
  matches.forEach(m => {
    if (!byDate.has(m.date)) byDate.set(m.date, []);
    byDate.get(m.date).push(m);
  });

  const [startY, startM, startD] = matches[0].date.split('-').map(Number);
  const endIso = (cutoffDateIso && typeof cutoffDateIso === 'string') ? cutoffDateIso : matches[matches.length - 1].date;
  const [endY, endM, endD] = endIso.split('-').map(Number);

  let curTime = Date.UTC(startY, startM - 1, startD);
  const endTime = Date.UTC(endY, endM - 1, endD);
  const ONE_DAY_MS = 24 * 60 * 60 * 1000;

  while (curTime <= endTime) {
    const d = new Date(curTime);
    const yyyy = d.getUTCFullYear();
    const mm = String(d.getUTCMonth() + 1).padStart(2, '0');
    const dd = String(d.getUTCDate()).padStart(2, '0');
    const dateStr = `${yyyy}-${mm}-${dd}`;

    const dayMatches = byDate.get(dateStr) || [];
    const activeToday = new Set();

    dayMatches.forEach(m => {
      m.team1.concat(m.team2).forEach(p => {
        if (p && p.trim()) activeToday.add(p.trim());
      });
    });

    decayAllPlayersOneDay(playerMap, activeToday);

    if (dayMatches.length > 0) {
      updatePeriod(playerMap, dayMatches);
    }

    curTime += ONE_DAY_MS;
  }

  return Array.from(playerMap.entries()).map(([name, p]) => ({
    name,
    rating: p.rating,
    rd: p.rd
  }));
}

// ============================================================================
// DATA FETCHING & UI RENDER
// ============================================================================

let cachedEntries = [];

function fetchMatches() {
  function toIsoDate(s){
    if(!s) return null;
    if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
    const parts = String(s).split('/');
    if(parts.length===3){
      const d = String(parts[0]).padStart(2,'0');
      const m = String(parts[1]).padStart(2,'0');
      const y = String(parts[2]);
      return `${y}-${m}-${d}`;
    }
    const dt = new Date(s);
    if(isNaN(dt.getTime())) return null;
    return dt.toISOString().split('T')[0];
  }

  function f_x(x){
    const k = 10;
    const xx = Number(x);
    if (!Number.isFinite(xx)) return 0.0001;
    return 0.5 + 1.0 / (1.0 + Math.exp(-k * (xx - 0.60)));
  }

  return fetch(`/api/read?action=getResults&eventType=ranked,grupo_liga,pozo,compas,doble_ko,legacy&ts=${Date.now()}`)
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(db => {
      const raw = (db && db.matches) ? db.matches : [];

      return raw.map((m, idx) => {
        const dateIso = toIsoDate(m.date) || toIsoDate(m.start_date) || new Date().toISOString().split('T')[0];

        const p1a = (m.p1a || '').trim();
        const p1b = (m.p1b || '').trim();
        const p2a = (m.p2a || '').trim();
        const p2b = (m.p2b || '').trim();

        const s1 = [m.s11, m.s12, m.s13].map(x => { const v = parseInt(String(x||'').trim(),10); return Number.isFinite(v) ? v : null; });
        const s2 = [m.s21, m.s22, m.s23].map(x => { const v = parseInt(String(x||'').trim(),10); return Number.isFinite(v) ? v : null; });

        const fmtLow = String(m.format || '').toLowerCase();
        let setsWon1 = 0;
        let setsWon2 = 0;
        let totalGames1 = 0;
        let totalGames2 = 0;

        for (let i = 0; i < 3; i++) {
          const g1 = s1[i];
          const g2 = s2[i];

          if (g1 === null || g2 === null) continue;

          if (i === 2 && fmtLow.includes('bo3_stb')) {
            if (g1 > g2) {
              setsWon1++;
              totalGames1 += 1;
            } else if (g2 > g1) {
              setsWon2++;
              totalGames2 += 1;
            }
            continue;
          }

          totalGames1 += g1;
          totalGames2 += g2;

          if (g1 > g2) setsWon1++;
          else if (g2 > g1) setsWon2++;
        }

        const totalGames = totalGames1 + totalGames2;
        if (totalGames === 0 || setsWon1 === setsWon2) return null;

        const winnerIsTeam1 = setsWon1 > setsWon2;
        const score = winnerIsTeam1 ? 1.0 : 0.0;

        let w1 = 1.0;
        if (fmtLow.includes('timed_games_long')) {
          w1 = 0.6;
        } else if (fmtLow.includes('timed') || fmtLow.includes('timed_games')) {
          w1 = 0.3;
        }

        const winnerGames = winnerIsTeam1 ? totalGames1 : totalGames2;
        const x = winnerGames / totalGames;
        let w2 = f_x(x);
        if (!Number.isFinite(w2) || w2 <= 0) w2 = 0.0001;

        const weight = w1 * w2;

        return {
          id: (m.id !== undefined && m.id !== null) ? m.id : idx,
          date: dateIso,
          team1: [p1a, p1b],
          team2: [p2a, p2b],
          score: score,
          weight: weight,
          event_type: (m.event_type || '').toString().toLowerCase(),
          event_id: (m.event_id !== undefined && m.event_id !== null) ? Number(m.event_id) : null
        };
      }).filter(m => m && m.date && m.team1[0] && m.team1[1] && m.team2[0] && m.team2[1]);
    })
    .catch(e => { console.error('Could not load matches', e); return []; });
}

function buildDateOptionsFromMatches(matches) {
  const isoToday = new Date().toISOString().split('T')[0];
  if (!matches || matches.length === 0) return [isoToday];

  const dates = Array.from(new Set(
    (matches || []).map(m => m && m.date).filter(Boolean)
  )).filter(date => date <= isoToday).sort();

  if (dates.length === 0) return [isoToday];

  const first = dates[0];
  let last = dates[dates.length - 1];
  if (last < isoToday) last = isoToday;

  const [y1,m1,d1] = first.split('-').map(Number);
  const [y2,m2,d2] = last.split('-').map(Number);
  let cur = Date.UTC(y1, m1 - 1, d1);
  const end = Date.UTC(y2, m2 - 1, d2);
  const ONE_DAY = 24 * 60 * 60 * 1000;
  const temp = [];
  while (cur <= end) {
    const dt = new Date(cur);
    const yyyy = dt.getUTCFullYear();
    const mm = String(dt.getUTCMonth() + 1).padStart(2, '0');
    const dd = String(dt.getUTCDate()).padStart(2, '0');
    temp.push(`${yyyy}-${mm}-${dd}`);
    cur += ONE_DAY;
  }
  return temp.reverse();
}

function populateDateDropdown(matches) {
  const sel = document.getElementById('ratingDate');
  if (!sel) return;
  const opts = buildDateOptionsFromMatches(matches);
  sel.innerHTML = '';
  const isoToday = new Date().toISOString().split('T')[0];
  const threshold = '2026-09-01';
  for (const v of opts) {
    const o = document.createElement('option');
    o.value = v;
    const parts = v.split('-');
    const display = `${parts[2]}/${parts[1]}/${parts[0]}`;
    let label = display;
    if (v === isoToday) label += ' (Actual)';
    if (v === threshold) label += ' (Nuevo comienzo)';
    o.textContent = label;
    sel.appendChild(o);
  }
  if (opts.includes(isoToday)) sel.value = isoToday;
  else if (opts.length > 0) sel.value = opts[0];
}

function filterMatchesForCutoff(allMatches, cutoffIso) {
  if (!allMatches) return [];
  let cutoff = cutoffIso;
  if (!cutoff) {
    const dates = allMatches.map(m => m.date).filter(Boolean).sort();
    cutoff = dates.length ? dates[dates.length - 1] : new Date().toISOString().split('T')[0];
  }

  const threshold = '2026-09-01';

  return allMatches.filter(m => {
    if (!m || !m.date) return false;
    if (m.date > cutoff) return false;

    const et = (m.event_type || '').toString().toLowerCase();
    const eid = (m.event_id !== undefined && m.event_id !== null) ? Number(m.event_id) : null;

    if (cutoff >= threshold) {
      if (!['ranked','grupo_liga','pozo','compas','doble_ko'].includes(et)) return false;
      if (eid === 23 || eid === 24) return false;
      return true;
    } else {
      if (et === 'legacy') return true;
      if (et === 'pozo') return (eid === 23 || eid === 24);
      if (['ranked','grupo_liga','compas','doble_ko'].includes(et)) return true;
      return false;
    }
  });
}

function loadNames(){
  const url = '/api/read?action=getNames';
  return fetch(url)
    .then(r => { if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
    .then(db => { return (db && db.names) ? db.names : []; })
    .catch(e => { return []; });
}

function computeRatings(entries, includeInactive = false, minReliability = 'any') {
  const registered = (!includeInactive && window._registeredNames && window._registeredNames.size > 0) ? window._registeredNames : null;

  let filtered = registered
    ? entries.filter(e => registered.has(e.name))
    : entries;

  if (minReliability !== 'any') {
    filtered = filtered.filter(e => {
      const rd = Number(e.rd);
      if (!Number.isFinite(rd)) return false;

      if (minReliability === 'very_low') return rd < 350;
      if (minReliability === 'low') return rd < 250;
      if (minReliability === 'medium') return rd < 190;
      if (minReliability === 'high') return rd < 140;
      return true;
    });
  }

  filtered.sort((a, b) => {
    if (b.rating !== a.rating) return b.rating - a.rating;
    return String(a.name || '').localeCompare(String(b.name || ''), 'es', { sensitivity: 'base', numeric: true });
  });

  const out = [];
  for (let i = 0; i < filtered.length; i++) {
    const e = filtered[i];
    let rank;
    if (i === 0) rank = 1;
    else if (filtered[i].rating === filtered[i - 1].rating) rank = out[i - 1].rank;
    else rank = i + 1;
    out.push({ rank, rating: e.rating, name: e.name, rd: e.rd });
  }
  return out;
}

function renderTable(rows) {
  if (!rows || rows.length === 0) {
    document.getElementById('ratingContainer').innerHTML = '<div class="muted">No hay jugadores que coincidan con los filtros</div>';
    return;
  }

  function getFiabilidadConfig(rd) {
    if (rd === undefined || rd === null) return { bars: 0, color: '', label: '' };
    const v = Number(rd);
    if (!Number.isFinite(v)) return { bars: 0, color: '', label: '' };

    if (v >= 350) return { bars: 0, color: '#f87171', label: 'Sin fiabilidad' };
    if (v < 100) return { bars: 5, color: '#4ade80', label: 'Muy alta' };
    if (v < 140) return { bars: 4, color: '#a3e635', label: 'Alta' };
    if (v < 190) return { bars: 3, color: '#facc15', label: 'Media' };
    if (v < 250) return { bars: 2, color: '#fb923c', label: 'Baja' };
    return { bars: 1, color: '#f87171', label: 'Muy baja' };
  }

  function formatRating(num) {
    if (num === undefined || num === null || !Number.isFinite(num)) return '-';
    return num.toFixed(2).replace('.', ',');
  }

  const TIER_DEFINITIONS = [
    { key: 'entreno', title: 'Entreno', rangeText: '> 1900,00 pts', min: 1900, max: Infinity },

    { key: 'avanzado-alto', title: 'Avanzado alto', rangeText: '1800,01 – 1900,00 pts', min: 1800, max: 1900 },

    { key: 'avanzado-medio', title: 'Avanzado medio', rangeText: '1600,01 – 1800,00 pts', min: 1600, max: 1800 },

    { key: 'intermedio-alto', title: 'Intermedio alto', rangeText: '1400,01 – 1600,00 pts', min: 1400, max: 1600 },

    { key: 'intermedio-medio', title: 'Intermedio medio', rangeText: '1200,01 – 1400,00 pts', min: 1200, max: 1400 },

    { key: 'iniciacion', title: 'Iniciación', rangeText: '≤ 1200,00 pts', min: -Infinity, max: 1200 }
  ];

  const html = [];

  for (const tier of TIER_DEFINITIONS) {
    const tierRows = rows.filter(r => r.rating > tier.min && r.rating <= tier.max);
    if (tierRows.length === 0) continue;

    html.push(`
      <div class="tier-section tier-${tier.key}">
        <div class="tier-title">
          <span>${tier.title}</span>
          <span class="tier-subtitle">${tier.rangeText}</span>
        </div>
        <table aria-label="Rating ${tier.title}">
          <thead>
            <tr>
              <th class="rank-col">Pos</th>
              <th>Jugador</th>
              <th class="rating-col">Rating</th>
              <th class="fiabilidad-col">Fiabilidad</th>
            </tr>
          </thead>
          <tbody>
    `);

    for (const r of tierRows) {
      const { bars, color, label } = getFiabilidadConfig(r.rd);
      const ratingFormatted = formatRating(r.rating);

      let segmentsHtml = '';
      for (let i = 1; i <= 5; i++) {
        const activeBg = i <= bars ? color : '#343538';
        segmentsHtml += `<span class="progress-segment" style="background-color: ${activeBg};"></span>`;
      }

      const progressHtml = `
        <div class="progress-segmented" title="${label}">
          ${segmentsHtml}
        </div>
      `;

      const showRD = (document.getElementById('toggleShowRD') && document.getElementById('toggleShowRD').checked) ? true : false;
      let reliabilityHtml;
      if (showRD) {
        const rdVal = (r.rd === undefined || r.rd === null || !Number.isFinite(Number(r.rd))) ? '-' : Number(Number(r.rd)).toFixed(2).replace('.', ',');
        reliabilityHtml = `<div style="color:#d8c3ad;font-weight:400;font-variant-numeric:tabular-nums">${rdVal}</div>`;
      } else {
        reliabilityHtml = progressHtml;
      }

      const playerLink = `/players?player=${encodeURIComponent(r.name)}`;

      html.push(`<tr>
        <td class="rank-col">${r.rank}</td>
        <td class="name-col"><a href="${playerLink}" style="color:inherit; text-decoration:none; cursor:pointer;">${escapeHtml(r.name)}</a></td>
        <td class="rating-col">${ratingFormatted}</td>
        <td class="fiabilidad-col">${reliabilityHtml}</td>
      </tr>`);
    }

    html.push(`
          </tbody>
        </table>
      </div>
    `);
  }

  document.getElementById('ratingContainer').innerHTML = html.join('');
}

function handleFilterChange() {
  const showInactive = document.getElementById('toggleInactive').checked;
  const minReliability = document.getElementById('minReliability').value;
  const dateSel = document.getElementById('ratingDate');
  const selected = dateSel ? dateSel.value : 'latest';

  const names = window._allNames || [];
  const allMatches = window._allMatches || [];
  const matchesForDate = filterMatchesForCutoff(allMatches, selected);

  cachedEntries = calculateEngineRatings(names, matchesForDate, selected);

  const ranked = computeRatings(cachedEntries, showInactive, minReliability);
  renderTable(ranked);
}

function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, function(c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

async function init() {
  const [names, matches] = await Promise.all([
    loadNames(),
    fetchMatches()
  ]);

  window._registeredNames = new Set((names || []).map(n => String(n).trim()).filter(Boolean));
  window._allNames = names || [];
  window._allMatches = matches || [];

  populateDateDropdown(window._allMatches);

  handleFilterChange();
}

init();
</script>
