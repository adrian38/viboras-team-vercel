<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resultados de ligas</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
body{font-family:Inter, system-ui, -apple-system, 'Segoe UI', Roboto, Arial;margin:0;padding:28px 18px;background:linear-gradient(180deg,#f5f8ff,#eef4ff 60%);color:#0b1530}
.site{max-width:980px;margin:0 auto}
.block{background:#fff;border-radius:12px;padding:16px;border:1px solid rgba(15,23,42,0.04);box-shadow:0 8px 30px rgba(16,24,40,0.04)}
.block-title{font-weight:700;margin-bottom:10px}
.controls{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.view-toggle{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 8px}
.view-btn{background:#fff;color:#6b7280;border:1px solid rgba(15,23,42,0.08);padding:8px 12px;border-radius:999px;cursor:pointer}
.view-btn.active{background:#2563eb;color:#fff;border-color:#2563eb}
.filter-box{background:linear-gradient(180deg,#eaf4ff,#e1f0ff);padding:12px;border-radius:10px;border:1px solid rgba(15,23,42,0.04);margin-bottom:12px}
.select{padding:8px;border-radius:8px;border:1px solid rgba(15,23,42,0.06)}
.small-btn{background:transparent;border:1px solid rgba(15,23,42,0.06);padding:6px 8px;border-radius:6px;cursor:pointer}
.btn{background:#2563eb;color:#fff;padding:8px 12px;border-radius:8px;border:none;cursor:pointer}
.back-btn{background:#fff;color:#2563eb;border:1px solid rgba(37,99,235,0.12);padding:8px 12px;border-radius:8px;cursor:pointer}
table{width:100%;border-collapse:collapse;margin-top:8px}
th,td{padding:8px;border-bottom:1px solid #f0f0f0;text-align:left}
.muted{color:#6b7280}
.duration-line{color:#1f7a4d;background:rgba(34,197,94,0.09);padding:2px 6px;border-radius:6px;display:inline-block}
.phase-limit{color:#7f1d1d;background:rgba(127,29,29,0.06);padding:2px 6px;border-radius:6px;display:inline-block}
.tag{display:inline-block;padding:4px 8px;border-radius:999px;background:#fff;border:1px solid #eee;margin-right:6px;font-weight:600}
.tag.win{background:#dcfce7;color:#065f46;border-color:rgba(16,185,129,0.12)}
.tag.lose{background:#fff5f5;color:#7f1d1d;border-color:rgba(239,68,68,0.08)}
.tag.tie{background:#ffffff;color:#374151;border-color:#e5e7eb}
.desktop-only{display:inline}
.mobile-only{display:none}
@media(max-width:720px){.desktop-only{display:none}.mobile-only{display:inline-block;margin-right:8px}}
.set-list{display:flex;gap:6px;flex-wrap:wrap}
.set-item{display:inline-block}
.set-item:not(:last-child)::after{content:", "}
  .edit-btn{background:transparent;border:1px solid rgba(15,23,42,0.06);padding:6px 8px;border-radius:6px;cursor:pointer}
  /* modal */
  .modal-backdrop{position:fixed;inset:0;background:rgba(11,21,48,0.4);display:none;align-items:center;justify-content:center;z-index:1200}
  .modal{background:#fff;border-radius:12px;padding:16px;max-width:760px;width:100%;box-shadow:0 12px 40px rgba(2,6,23,0.4)}
  .modal .team-card.team-3{background:linear-gradient(180deg,#fff8f1,#fff6ee);border:1px solid rgba(251,146,60,0.06)}
  .modal .controls{justify-content:flex-end;margin-top:12px}
@media(max-width:720px){body{padding:16px}.table-wrap{overflow-x:auto}.set-list{display:block}.set-item{display:block;margin-bottom:6px}.set-item:not(:last-child)::after{content:""}}

/* mobile sizing: match tournaments page */
@media(max-width:720px){
  body{font-size:0.8rem}
  table, th, td{font-size:0.8rem}
  .tag{font-weight:400;font-size:0.75rem}
  .set-list{display:inline;font-size:calc(1rem - 3pt)}
  .set-item{display:inline;margin-right:8px}
  .pos-badge{width:15.5px;height:15.5px;margin-right:4px}
  #durationLine,
  #phaseLimitLine,
  #provisionalNote,
  .empty-state-message,
  .muted{font-size:0.85rem}
  #leagueViewToggle{margin-top:18px !important}
}

  .pos-badge{display:inline-flex;width:34px;height:34px;border-radius:999px;align-items:center;justify-content:center;background:#fff;border:1px solid #e5e7eb;margin-right:10px;font-weight:700;color:#0b1530}
  .rating-name{display:flex;align-items:center}

<body>

<div class="site">
  <div class="block">
    <div class="block-title">Resultados de ligas</div>
    <div class="filter-box">
      <div class="controls" role="toolbar" aria-label="Filtros">
        <label style="display:flex;flex-direction:column;min-width:220px;flex:1">
          Liga
          <select id="leagueSelect" class="select"></select>
        </label>

        <label style="display:flex;flex-direction:column;min-width:160px">
          Grupo
          <select id="groupSelect" class="select"></select>
        </label>

        <label style="display:flex;flex-direction:column;min-width:140px">
          Fase
          <select id="phaseSelect" class="select"></select>
        </label>

        <label style="display:flex;flex-direction:column;flex:1;min-width:220px">
          Jugador
          <select id="player" class="select"></select>
        </label>

        <div style="display:flex;align-items:end;gap:8px">
          <button class="btn" id="filterBtn">Filtrar</button>
        </div>
      </div>
    </div>

    <div id="durationLine" class="duration-line" style="margin-top:8px">Duración de la liga: -</div>
    <div id="phaseLimitLine" class="phase-limit" style="margin-top:4px;display:none">Fecha límite fase -: - (Quedan 0 días)</div>

    <div id="leagueViewToggle" class="view-toggle" role="tablist" aria-label="Vista de la liga" style="display:none;margin-top:16px">
      <button type="button" class="view-btn" data-view="rating">Clasificación</button>
      <button type="button" class="view-btn active" data-view="results">Resultados</button>
    </div>

    <div id="provisionalNote" class="muted" style="margin-top:6px;display:none">Esta clasificación es provisional hasta la finalización de la liga.</div>

    <div id="ratingContainer" class="table-wrap" style="margin-top:6px;display:none"></div>
    <div id="pendingContainer" class="table-wrap" style="margin-top:12px;display:none"></div>
    <div id="completedContainer" class="table-wrap" style="margin-top:12px;display:none"></div>

    <div style="margin-top:14px;display:flex;align-items:center;justify-content:space-between;gap:12px">
      <div style="flex:1;text-align:left">
        <button class="btn" id="downloadBtn">Descargar resultados</button>
      </div>
      <div style="flex:0 0 auto;text-align:right">
        <button class="back-btn" onclick="window.location='/'">Atrás</button>
      </div>
    </div>
  </div>
</div>

<script>
let allMatches = []
let allEvents = []
let leagues = []
let currentView = 'results'

function formatDateText(text){
  if(!text) return ''
  if(/^\d{2}\/\d{2}\/\d{4}$/.test(text)) return text
  if(/^\d{4}-\d{2}-\d{2}$/.test(text)){ const [y,m,d]=text.split('-'); return `${d}/${m}/${y}` }
  return text
}

function parseEventNameForLeague(eventName, leagueName){
  // expect leagueName_Group_FaseN
  const prefix = `${leagueName}_`
  if(!eventName || !eventName.startsWith(prefix)) return null
  const rest = eventName.substring(prefix.length)
  const m = rest.match(/^(.*)_Fase(\d+)$/)
  if(!m) return null
  return { group: m[1], phase: Number(m[2]) }
}

function buildOption(value,label){ const o=document.createElement('option'); o.value=value; o.textContent=label; return o }

function parseDateValue(value){
  if(!value) return null
  if(/^\d{4}-\d{2}-\d{2}$/.test(value)){ const [y,m,d]=value.split('-'); return new Date(Date.UTC(Number(y),Number(m)-1,Number(d))) }
  if(/^\d{2}\/\d{2}\/\d{4}$/.test(value)){ const [d,m,y]=value.split('/'); return new Date(Date.UTC(Number(y),Number(m)-1,Number(d))) }
  return null
}

function getDateRangeMatch(value, start, end){
  const d = parseDateValue(value)
  const s = parseDateValue(start)
  const e = parseDateValue(end)
  if(!d || !s || !e) return false
  const dUTC = Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate())
  const sUTC = Date.UTC(s.getUTCFullYear(), s.getUTCMonth(), s.getUTCDate())
  const eUTC = Date.UTC(e.getUTCFullYear(), e.getUTCMonth(), e.getUTCDate())
  return dUTC >= sUTC && dUTC <= eUTC
}

function getActivePhaseForLeague(league){
  if(!league || !Array.isArray(allEvents)) return null
  const today = new Date(); const tUTC = Date.UTC(today.getFullYear(), today.getMonth(), today.getDate())
  const normalized = String(league.name || '').trim()
  for(const ev of allEvents){
    const eventName = String(ev.name || '')
    if(!eventName.startsWith(`${normalized}_`)) continue
    const parsed = parseEventNameForLeague(eventName, normalized)
    if(!parsed) continue
    const start = ev.start_date || ev.startDate || ''
    const end = ev.end_date || ev.endDate || ''
    const s = parseDateValue(start)
    const e = parseDateValue(end)
    if(!s || !e) continue
    const sUTC = Date.UTC(s.getUTCFullYear(), s.getUTCMonth(), s.getUTCDate())
    const eUTC = Date.UTC(e.getUTCFullYear(), e.getUTCMonth(), e.getUTCDate())
    if(tUTC >= sUTC && tUTC <= eUTC){ return String(parsed.phase) }
  }
  return null
}

function updatePhaseLimitLine(){
  const leagueId = document.getElementById('leagueSelect').value
  const league = leagues.find(l=>String(l.id)===String(leagueId))
  const phaseEl = document.getElementById('phaseSelect')
  const phaseLimitEl = document.getElementById('phaseLimitLine')
  if(!league || !phaseLimitEl) return

  let phaseNumber = null
  if(phaseEl && phaseEl.value && phaseEl.value !== 'all'){
    phaseNumber = Number(phaseEl.value)
  }
  if(!phaseNumber){
    const active = getActivePhaseForLeague(league)
    phaseNumber = active ? Number(active) : null
  }
  if(!phaseNumber){
    phaseLimitEl.style.display = 'none'
    phaseLimitEl.innerText = 'Fecha límite fase -: - (Quedan 0 días)'
    return
  }

  const ev = (allEvents || []).find(ev => {
    const eventName = String(ev.name || '')
    const parsed = parseEventNameForLeague(eventName, league.name)
    return !!parsed && String(parsed.phase) === String(phaseNumber)
  })
  if(!ev){
    phaseLimitEl.style.display = 'none'
    phaseLimitEl.innerText = 'Fecha límite fase -: - (Quedan 0 días)'
    return
  }

  const endValue = ev.end_date || ev.endDate || ''
  const endDate = parseDateValue(endValue)
  if(!endDate){
    phaseLimitEl.style.display = 'none'
    phaseLimitEl.innerText = 'Fecha límite fase -: - (Quedan 0 días)'
    return
  }

  const today = new Date();
  const tUTC = Date.UTC(today.getUTCFullYear(), today.getUTCMonth(), today.getUTCDate())
  const endUTC = Date.UTC(endDate.getUTCFullYear(), endDate.getUTCMonth(), endDate.getUTCDate())
  const daysLeft = Math.max(0, Math.ceil((endUTC - tUTC) / (1000 * 60 * 60 * 24)))

  phaseLimitEl.innerText = `Fecha límite fase ${phaseNumber}: ${formatDateText(endValue)} (Quedan ${daysLeft} días)`
  phaseLimitEl.style.display = 'block'
}

async function loadInitial(){
  try{
    const lg = await (await fetch('/api/getLeagues')).json()
    leagues = Array.isArray(lg)?lg:[]
    const sel = document.getElementById('leagueSelect')
    sel.innerHTML = ''
    sel.appendChild(buildOption('','-- Selecciona una liga --'))
    leagues.forEach(l=> sel.appendChild(buildOption(String(l.id), l.name)))

    // preselect a league that is currently in progress (today between start_date and end_date)
    try{
      const today = new Date(); const tUTC = Date.UTC(today.getFullYear(), today.getMonth(), today.getDate())
      function parseDateText(s){ if(!s) return null; if(/^\d{4}-\d{2}-\d{2}$/.test(s)){ const [y,m,d]=s.split('-'); return new Date(Date.UTC(Number(y),Number(m)-1,Number(d))) } if(/^\d{2}\/\d{2}\/\d{4}$/.test(s)){ const [d,m,y]=s.split('/'); return new Date(Date.UTC(Number(y),Number(m)-1,Number(d))) } return null }
      let found = null
      for(const L of leagues){
        const sd = L.start_date || L.startDate || ''
        const ed = L.end_date || L.endDate || ''
        const s = parseDateText(sd)
        const e = parseDateText(ed)
        if(s && e){ const sUTC = Date.UTC(s.getUTCFullYear(), s.getUTCMonth(), s.getUTCDate()); const eUTC = Date.UTC(e.getUTCFullYear(), e.getUTCMonth(), e.getUTCDate()); if(tUTC >= sUTC && tUTC <= eUTC){ found = String(L.id); break } }
      }
      if(found){ sel.value = found }
    }catch(_){ }

    // load group events matches
    const res = await fetch('/api/getResults?eventType=grupo_liga')
    const db = await res.json()
    allMatches = db.matches || []
    allEvents = db.events || []

    document.getElementById('durationLine').innerText = 'Duración de la liga: -'
    document.getElementById('pendingContainer').style.display = 'none'
    document.getElementById('completedContainer').style.display = 'none'
    document.getElementById('ratingContainer').style.display = 'none'
    document.getElementById('leagueViewToggle').style.display = 'none'
  }catch(e){ console.error(e); alert('No se pudieron cargar ligas y partidos') }
}

async function loadPlayerNames(){
  try{
    const res = await fetch('/api/getNames?ts=' + Date.now())
    const j = await res.json()
    const sel = document.getElementById('player')
    sel.innerHTML = ''
    const opt = document.createElement('option')
    opt.value = ''
    opt.innerText = 'Todos'
    sel.appendChild(opt)
    ;(j.names || []).forEach(n=>{ const o=document.createElement('option'); o.value = n; o.innerText = n; sel.appendChild(o) })
  }catch(e){ console.error('Could not load player names', e) }
}

function onLeagueChange(){
  const leagueId = document.getElementById('leagueSelect').value
  if(!leagueId){
    document.getElementById('groupSelect').innerHTML = ''
    document.getElementById('phaseSelect').innerHTML = ''
    document.getElementById('durationLine').innerText = 'Duración de la liga: -'
    document.getElementById('leagueViewToggle').style.display = 'none'
    return
  }
  const league = leagues.find(l=>String(l.id)===String(leagueId))
  if(!league) return
  document.getElementById('durationLine').innerText = `Duración de la liga: ${formatDateText(league.start_date)} - ${formatDateText(league.end_date)}`

  // derive groups and phases from events whose name starts with league.name_
  const evForLeague = allEvents.filter(ev => String(ev.name || '').startsWith(`${league.name}_`))
  const groups = new Set(); const phases = new Set()
  evForLeague.forEach(ev=>{
    const parsed = parseEventNameForLeague(ev.name, league.name)
    if(parsed){ groups.add(parsed.group); phases.add(parsed.phase) }
  })

  const gsel = document.getElementById('groupSelect')
  gsel.innerHTML = ''
  gsel.appendChild(buildOption('all','Todos'))
  Array.from(groups).sort((a,b)=>a.localeCompare(b,'es',{sensitivity:'base'})).forEach(g=> gsel.appendChild(buildOption(g,g)))

  const psel = document.getElementById('phaseSelect')
  psel.innerHTML = ''
  psel.appendChild(buildOption('all','Todas'))
  Array.from(phases).sort((a,b)=>a-b).forEach(p=> psel.appendChild(buildOption(String(p), String(p))) )

  const activePhase = getActivePhaseForLeague(league)
  if(activePhase && Array.from(phases).includes(Number(activePhase))){
    psel.value = String(activePhase)
  } else {
    psel.value = 'all'
  }

  document.getElementById('leagueViewToggle').style.display = 'flex'
  updatePhaseLimitLine()
  // default view is results
  setLeagueView('results')
  // automatically apply filter so selecting a league shows results immediately
  applyFilter()
}

function setLeagueView(view){
  currentView = (view==='rating') ? 'rating' : 'results'
  const buttons = document.querySelectorAll('#leagueViewToggle .view-btn')
  buttons.forEach(btn=> btn.classList.toggle('active', btn.getAttribute('data-view')===currentView))
  document.getElementById('ratingContainer').style.display = (currentView==='rating') ? 'block' : 'none'
  document.getElementById('pendingContainer').style.display = (currentView==='results') ? 'block' : 'none'
  document.getElementById('completedContainer').style.display = (currentView==='results') ? 'block' : 'none'

  // provisional note: only show when viewing classification
  const provisionalEl = document.getElementById('provisionalNote')
  if(currentView === 'rating'){
    const leagueId = document.getElementById('leagueSelect').value
    const league = leagues.find(l=>String(l.id)===String(leagueId))
    provisionalEl.style.display = isLeagueProvisional(league) ? 'block' : 'none'
  }else{
    provisionalEl.style.display = 'none'
  }
}

function isLeagueProvisional(league){
  if(!league) return false
  const s = league.end_date || ''
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)){
    const parts = s.split('-'); const endDate = new Date(Date.UTC(Number(parts[0]), Number(parts[1])-1, Number(parts[2])));
    const check = new Date(endDate); check.setUTCDate(check.getUTCDate()+1)
    const today = new Date(); const tUTC = Date.UTC(today.getUTCFullYear(), today.getUTCMonth(), today.getUTCDate()); const cUTC = Date.UTC(check.getUTCFullYear(), check.getUTCMonth(), check.getUTCDate())
    return tUTC < cUTC
  }
  const parts = (s||'').split('/')
  if(parts.length!==3) return false
  const endDate = new Date(Date.UTC(Number(parts[2]), Number(parts[1])-1, Number(parts[0])))
  const check = new Date(endDate); check.setUTCDate(check.getUTCDate()+1)
  const today = new Date(); const tUTC = Date.UTC(today.getUTCFullYear(), today.getUTCMonth(), today.getUTCDate()); const cUTC = Date.UTC(check.getUTCFullYear(), check.getUTCMonth(), check.getUTCDate())
  return tUTC < cUTC
}

function isPendingMatch(m){
  return m.s11 === '0' && m.s21 === '0' && (m.s12 === '' || m.s12 === null) && (m.s22===''||m.s22==null) && (m.s13===''||m.s13==null) && (m.s23===''||m.s23==null)
}

function computeRating(matches){
  // league order: wins -> sets percentage -> games percentage
  const stats = new Map()
  function ensure(n){ if(!stats.has(n)) stats.set(n,{name:n,wins:0,setsWon:0,setsLost:0,gamesWon:0,gamesLost:0}) }
  matches.forEach(m=>{
    const p1 = [(m.p1a||'').trim(), (m.p1b||'').trim()].filter(Boolean)
    const p2 = [(m.p2a||'').trim(), (m.p2b||'').trim()].filter(Boolean)
    let t1=0,t2=0
    for(let i=1;i<=3;i++){
      const a = (m['s1'+i]!==undefined && m['s1'+i]!=='')? parseInt(m['s1'+i],10): NaN
      const b = (m['s2'+i]!==undefined && m['s2'+i]!=='')? parseInt(m['s2'+i],10): NaN
      if(!isNaN(a) && !isNaN(b)){
        if(a>b) {
          t1++
          p1.forEach(n=>{ ensure(n); const e=stats.get(n); e.setsWon += 1 })
          p2.forEach(n=>{ ensure(n); const e=stats.get(n); e.setsLost += 1 })
        } else if(b>a) {
          t2++
          p2.forEach(n=>{ ensure(n); const e=stats.get(n); e.setsWon += 1 })
          p1.forEach(n=>{ ensure(n); const e=stats.get(n); e.setsLost += 1 })
        }
        p1.forEach(n=>{ ensure(n); const e=stats.get(n); e.gamesWon += a; e.gamesLost += b })
        p2.forEach(n=>{ ensure(n); const e=stats.get(n); e.gamesWon += b; e.gamesLost += a })
      }
    }
    if(t1>t2) p1.forEach(n=>{ ensure(n); stats.get(n).wins +=1 })
    else if(t2>t1) p2.forEach(n=>{ ensure(n); stats.get(n).wins +=1 })
    else {
      if((m.s12||'')==='1') p1.forEach(n=>{ ensure(n); stats.get(n).wins +=1 })
      else if((m.s22||'')==='1') p2.forEach(n=>{ ensure(n); stats.get(n).wins +=1 })
    }
  })

  const out = Array.from(stats.values()).map(s=>{
    const setsTotal = (s.setsWon||0)+(s.setsLost||0)
    const setsPct = setsTotal>0 ? s.setsWon/setsTotal : null
    const gamesTotal = (s.gamesWon||0)+(s.gamesLost||0)
    const gamesPct = gamesTotal>0 ? s.gamesWon/gamesTotal : null
    return Object.assign({}, s, { setsTotal, setsPct, gamesTotal, gamesPct })
  })
  out.sort((a,b)=>{
    if((b.wins||0)!==(a.wins||0)) return (b.wins||0)-(a.wins||0)
    const sa = a.setsPct===null?-1:a.setsPct
    const sb = b.setsPct===null?-1:b.setsPct
    if(sb!==sa) return sb>sa ? 1 : -1
    const ga = a.gamesPct===null?-1:a.gamesPct
    const gb = b.gamesPct===null?-1:b.gamesPct
    if(gb!==ga) return gb>ga ? 1 : -1
    return 0
  })
  let lastKey=null,pos=0,displayPos=0
  out.forEach(r=>{ pos++; const key=`${r.wins}_${r.setsPct}_${r.gamesPct}`; if(key!==lastKey){ displayPos=pos; lastKey=key } r.position=displayPos })
  return out
}

function renderRating(matches){
  const container = document.getElementById('ratingContainer')
  const rating = computeRating(matches||[])
  if(!rating.length){ container.innerHTML = '<div class="muted">Sin clasificación para mostrar.</div>'; return }
  const table = document.createElement('table')
  const thead = document.createElement('thead')
  thead.innerHTML = '<tr><th>Jugador</th><th>Victorias</th><th>Sets</th><th>Juegos</th></tr>'
  table.appendChild(thead)
  const tbody = document.createElement('tbody')
  rating.forEach(r=>{
    const tr=document.createElement('tr')
    const tdName=document.createElement('td'); tdName.innerText = r.name
    const tdW=document.createElement('td'); tdW.innerText=String(r.wins||0)
    const tdS=document.createElement('td'); tdS.innerText = `${Math.round(r.setsWon||0)}-${Math.round(r.setsLost||0)} (${r.setsPct===null?'-':Math.round((r.setsPct||0)*100)+'%'})`
    const tdG=document.createElement('td'); tdG.innerText = `${Math.round(r.gamesWon||0)}-${Math.round(r.gamesLost||0)} (${r.gamesPct===null?'-':Math.round((r.gamesPct||0)*100)+'%'})`
    tr.appendChild(tdName); tr.appendChild(tdW); tr.appendChild(tdS); tr.appendChild(tdG); tbody.appendChild(tr)
  })
  table.appendChild(tbody)
  container.innerHTML=''
  container.appendChild(table)
}

function renderResults(pending, completed){
  const pendC = document.getElementById('pendingContainer')
  const compC = document.getElementById('completedContainer')

  // Pending
  if(!pending.length) pendC.innerHTML = ''
  else{
    const title = document.createElement('div')
    title.className = 'muted'
    title.innerHTML = '<br><strong>Partidos pendientes</strong>'

    const t = document.createElement('table')
    const thead = document.createElement('thead')
    thead.innerHTML = '<tr><th>Jugadores</th><th>Marcador</th></tr>'
    t.appendChild(thead)
    const tbody = document.createElement('tbody')

    pending.forEach(m => {
      const tr = document.createElement('tr')

      // players column (desktop: individual tags, mobile: combined)
      const tdPlayers = document.createElement('td')
      const p1aTag = document.createElement('span'); p1aTag.className = 'tag desktop-only'; p1aTag.innerText = m.p1a || ''
      const p1bTag = document.createElement('span'); p1bTag.className = 'tag desktop-only'; p1bTag.innerText = m.p1b || ''
      const vs = document.createElement('strong'); vs.className = 'desktop-only'; vs.style.margin = '0 8px'; vs.innerText = 'VS'
      const p2aTag = document.createElement('span'); p2aTag.className = 'tag desktop-only'; p2aTag.innerText = m.p2a || ''
      const p2bTag = document.createElement('span'); p2bTag.className = 'tag desktop-only'; p2bTag.innerText = m.p2b || ''
      tdPlayers.appendChild(p1aTag); tdPlayers.appendChild(p1bTag); tdPlayers.appendChild(vs); tdPlayers.appendChild(p2aTag); tdPlayers.appendChild(p2bTag)

      const mobileTeam1 = document.createElement('span'); mobileTeam1.className = 'tag mobile-only'; mobileTeam1.innerText = `${(m.p1a||'').trim()} / ${(m.p1b||'').trim()}`
      const mobileTeam2 = document.createElement('span'); mobileTeam2.className = 'tag mobile-only'; mobileTeam2.innerText = `${(m.p2a||'').trim()} / ${(m.p2b||'').trim()}`
      tdPlayers.appendChild(mobileTeam1); tdPlayers.appendChild(mobileTeam2)

      // score column: for pending matches show edit button instead of stored 0-0
      const tdScore = document.createElement('td')
      const edit = document.createElement('button')
      edit.className = 'edit-btn'
      edit.setAttribute('type','button')
      edit.title = 'Editar marcador'
      edit.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25z" stroke="#0b1530" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z" stroke="#0b1530" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>'
      edit.addEventListener('click', ()=> openEditModal(m))
      tdScore.appendChild(edit)
      tr.appendChild(tdPlayers); tr.appendChild(tdScore)
      tbody.appendChild(tr)
    })

    t.appendChild(tbody)
    pendC.innerHTML = ''
    pendC.appendChild(title)
    pendC.appendChild(t)
  }

  // Completed
  if(!completed.length) compC.innerHTML = '<div class="muted">\nNo hay partidos completados.</div>'
  else{
    const title = document.createElement('div')
    title.className = 'muted'
    title.innerHTML = '<br><strong>Partidos completados</strong>'

    const t = document.createElement('table')
    const thead = document.createElement('thead')
    thead.innerHTML = '<tr><th>Jugadores</th><th>Marcador</th></tr>'
    t.appendChild(thead)
    const tbody = document.createElement('tbody')

    completed.forEach(m => {
      const tr = document.createElement('tr')

      // compute result type
      let team1Sets = 0, team2Sets = 0
      for(let i=1;i<=3;i++){ const aRaw = m['s1'+i]; const bRaw = m['s2'+i]; const a = (aRaw!==undefined && aRaw!=='')?parseInt(aRaw,10):NaN; const b = (bRaw!==undefined && bRaw!=='')?parseInt(bRaw,10):NaN; if(!isNaN(a) && !isNaN(b)){ if(a>b) team1Sets++; else if(b>a) team2Sets++ } }
      let resultType = 'tie'
      if(team1Sets > team2Sets) resultType = 'team1'
      else if(team2Sets > team1Sets) resultType = 'team2'
      else { if((m.s12||'') === '1') resultType = 'team1'; else if((m.s22||'') === '1') resultType = 'team2' }

      function makeTag(name, team){ const span = document.createElement('span'); span.className = 'tag'; if(resultType === 'tie') span.classList.add('tie'); else if(resultType === 'team1' && team===1) span.classList.add('win'); else if(resultType === 'team2' && team===2) span.classList.add('win'); else span.classList.add('lose'); span.innerText = name; return span }

      const tdPlayers = document.createElement('td')
      const p1aTag = makeTag(m.p1a||'',1); p1aTag.classList.add('desktop-only')
      const p1bTag = makeTag(m.p1b||'',1); p1bTag.classList.add('desktop-only')
      const vs = document.createElement('strong'); vs.className='desktop-only'; vs.style.margin='0 8px'; vs.innerText = 'VS'
      const p2aTag = makeTag(m.p2a||'',2); p2aTag.classList.add('desktop-only')
      const p2bTag = makeTag(m.p2b||'',2); p2bTag.classList.add('desktop-only')
      tdPlayers.appendChild(p1aTag); tdPlayers.appendChild(p1bTag); tdPlayers.appendChild(vs); tdPlayers.appendChild(p2aTag); tdPlayers.appendChild(p2bTag)

      const mobileTeam1 = document.createElement('span'); mobileTeam1.className='tag mobile-only'; mobileTeam1.innerText = `${(m.p1a||'').trim()} / ${(m.p1b||'').trim()}`
      const mobileTeam2 = document.createElement('span'); mobileTeam2.className='tag mobile-only'; mobileTeam2.innerText = `${(m.p2a||'').trim()} / ${(m.p2b||'').trim()}`
      if(resultType === 'team1'){ mobileTeam1.classList.add('win'); mobileTeam2.classList.add('lose') }
      else if(resultType === 'team2'){ mobileTeam1.classList.add('lose'); mobileTeam2.classList.add('win') }
      else { mobileTeam1.classList.add('tie'); mobileTeam2.classList.add('tie') }
      tdPlayers.appendChild(mobileTeam1); tdPlayers.appendChild(mobileTeam2)

      // score
      const sets = []
      for(let i=1;i<=3;i++){
        if(i===2 && String(m.format) === 'timed_games') continue
        let a = m['s1'+i] || ''
        let b = m['s2'+i] || ''
        if(a === '' && b === '') continue
        const score = String(a) + '-' + String(b)
        const display = (String(m.format) === 'bo3_stb' && i === 3) ? `[${score}]` : score
        sets.push(display)
      }
      const tdScore = document.createElement('td')
      const list = document.createElement('div'); list.className = 'set-list'
      sets.forEach(s=>{ const it=document.createElement('span'); it.className='set-item'; it.innerText = String(s).replace(/-/g, '\u2011'); list.appendChild(it) })
      tdScore.appendChild(list)

      tr.appendChild(tdPlayers); tr.appendChild(tdScore); tbody.appendChild(tr)
    })

    t.appendChild(tbody)
    compC.innerHTML = ''
    compC.appendChild(title)
    compC.appendChild(t)
  }
}

function applyFilter(){
  const leagueId = document.getElementById('leagueSelect').value
  const group = document.getElementById('groupSelect').value
  const phase = document.getElementById('phaseSelect').value
  const player = (document.getElementById('player').value||'').trim().toLowerCase()
  if(!leagueId){ document.getElementById('durationLine').innerText='Duración de la liga: -'; return }
  const league = leagues.find(l=>String(l.id)===String(leagueId))
  const matchesForLeague = allMatches.filter(m=> (m.event_name||'').startsWith(`${league.name}_`))
  updatePhaseLimitLine()
  // filter by group/phase
  let filtered = matchesForLeague.filter(m=>{
    const parsed = parseEventNameForLeague(m.event_name||'', league.name)
    if(!parsed) return false
    if(group && group!=='all' && parsed.group !== group) return false
    if(phase && phase!=='all' && String(parsed.phase) !== String(phase)) return false
    return true
  })
  // player filter
  if(player){ filtered = filtered.filter(m=> [m.p1a,m.p1b,m.p2a,m.p2b].some(n => (n||'').toLowerCase().includes(player))) }

  // separate pending/completed
  const pending = filtered.filter(isPendingMatch)
  const completed = filtered.filter(m=> !isPendingMatch(m))

  // rating uses filtered (including pending?) Probably all matches for selection; we'll use completed matches for rating
  renderResults(pending, completed)

  // classification
  if(currentView==='rating'){
    // show classifications for ALL groups of the selected league (ignore group dropdown)
    renderGroupRatings(league)
  }
}

function renderGroupRatings(league){
  const container = document.getElementById('ratingContainer')
  if(!league){ container.innerHTML = '<div class="muted">Sin clasificación para mostrar.</div>'; return }

  // derive groups from events for this league
  const evForLeague = allEvents.filter(ev => String(ev.name || '').startsWith(`${league.name}_`))
  const groups = new Set()
  evForLeague.forEach(ev=>{ const parsed = parseEventNameForLeague(ev.name, league.name); if(parsed) groups.add(parsed.group) })
  const groupList = Array.from(groups).sort((a,b)=>a.localeCompare(b,'es',{sensitivity:'base'}))
  if(!groupList.length){ container.innerHTML = '<div class="muted">Sin clasificación para mostrar.</div>'; return }

  container.innerHTML = ''
  groupList.forEach(groupName => {
    const title = document.createElement('div'); title.className = 'block-title'; title.innerText = `\n\nClasificación del grupo ${groupName}`
    container.appendChild(title)

    // collect matches for this group across all phases
    const matches = allMatches.filter(m=>{ const parsed = parseEventNameForLeague(m.event_name||'', league.name); return parsed && parsed.group === groupName })
    const completedMatches = matches.filter(m=> !isPendingMatch(m))
    const rating = computeRating(completedMatches)

    if(!rating.length){ const empty = document.createElement('div'); empty.className='muted'; empty.innerText='Sin clasificación para mostrar.'; container.appendChild(empty); return }

    const table = document.createElement('table')
    const thead = document.createElement('thead'); thead.innerHTML = '<tr><th>Jugador</th><th>Victorias</th><th>Sets</th><th>Juegos</th></tr>'; table.appendChild(thead)
    const tbody = document.createElement('tbody')

    rating.forEach(r=>{
      const tr = document.createElement('tr')
      const tdName = document.createElement('td')
      const nameWrap = document.createElement('div'); nameWrap.className = 'rating-name'
      const badge = document.createElement('span'); badge.className = 'pos-badge'
      if(r.position === 1) badge.classList.add('pos-1')
      else if(r.position === 2) badge.classList.add('pos-2')
      else if(r.position === 3) badge.classList.add('pos-3')
      badge.innerText = String(r.position)
      const nameSpan = document.createElement('span'); nameSpan.innerText = r.name
      nameWrap.appendChild(badge); nameWrap.appendChild(nameSpan)
      tdName.appendChild(nameWrap)

      const tdW = document.createElement('td'); tdW.innerText = String(r.wins||0)
      const tdS = document.createElement('td'); const sw=Math.round(r.setsWon||0); const sl=Math.round(r.setsLost||0); const spct=(r.setsPct===null)?'-':Math.round((r.setsPct||0)*100)+'%'; tdS.innerText = `${sw}-${sl} (${spct})`
      const tdG = document.createElement('td'); const gw=Math.round(r.gamesWon||0); const gl=Math.round(r.gamesLost||0); const gpct=(r.gamesPct===null)?'-':Math.round((r.gamesPct||0)*100)+'%'; tdG.innerText = `${gw}-${gl} (${gpct})`

      tr.appendChild(tdName); tr.appendChild(tdW); tr.appendChild(tdS); tr.appendChild(tdG); tbody.appendChild(tr)
    })

    table.appendChild(tbody)
    container.appendChild(table)
  })
}

document.addEventListener('DOMContentLoaded', async ()=>{
  await loadInitial()
  await loadPlayerNames()
  const leagueSelectEl = document.getElementById('leagueSelect')
  leagueSelectEl.addEventListener('change', onLeagueChange)
  document.getElementById('filterBtn').addEventListener('click', applyFilter)
  document.getElementById('phaseSelect').addEventListener('change', ()=>{ updatePhaseLimitLine(); applyFilter() })
  // player select change applies filter immediately
  document.getElementById('player').addEventListener('change', applyFilter)
  document.querySelectorAll('#leagueViewToggle .view-btn').forEach(b=> b.addEventListener('click', ()=>{ setLeagueView(b.getAttribute('data-view')); applyFilter() }))
  // if a league was auto-selected during loadInitial, trigger the change handler to populate groups/results
  if(leagueSelectEl.value){ onLeagueChange() }
})

// --- Edit modal creation and handlers ---

  const backdrop = document.createElement('div'); backdrop.className='modal-backdrop'; backdrop.id='editBackdrop'
  const modal = document.createElement('div'); modal.className='modal'; modal.id='editModal'

  modal.innerHTML = `
    <style>
      #editModal .score-grid {
        display: grid;
        grid-template-columns: minmax(100px, 1fr) repeat(3, 48px);
        gap: 8px;
        align-items: center;
        margin-bottom: 8px;
      }
      #editModal .score-header {
        font-weight: 600;
        color: #6b7280;
        text-align: center;
      }
      #editModal .score-label {
        font-weight: 600;
        font-size: 0.9rem;
        word-break: break-word;
        padding-right: 4px;
      }

        border: 1px solid rgba(15,23,42,0.12);
      }
    </style>
    <div style="font-weight:700;margin-bottom:12px">Indicar resultado</div>
    <div class="teams">
      <div class="team-card team-3" style="padding:16px;border-radius:8px">
        <div class="score-grid" style="margin-bottom:6px">
          <div></div>
          <div class="score-header">Set 1</div>
          <div class="score-header">Set 2</div>
          <div class="score-header">Set 3</div>
        </div>
        <div class="score-grid">
          <div class="score-label" id="e_team1_title">Equipo 1</div>
          <input id="e_s11" class="score" type="text" inputmode="numeric" pattern="\\d*" placeholder="" />
          <input id="e_s12" class="score" type="text" inputmode="numeric" pattern="\\d*" placeholder="" />
          <input id="e_s13" class="score" type="text" inputmode="numeric" pattern="\\d*" placeholder="" />
        </div>
        <div class="score-grid">
          <div class="score-label" id="e_team2_title">Equipo 2</div>
          <input id="e_s21" class="score" type="text" inputmode="numeric" pattern="\\d*" placeholder="" />
          <input id="e_s22" class="score" type="text" inputmode="numeric" pattern="\\d*" placeholder="" />
          <input id="e_s23" class="score" type="text" inputmode="numeric" pattern="\\d*" placeholder="" />
        </div>
        <div style="margin-top:12px;padding:8px;border-radius:8px;background:rgba(255,255,255,0.6);border:1px solid rgba(251,146,60,0.12);display:flex;align-items:center;gap:10px">
          <input id="e_stb" type="checkbox" style="width:18px;height:18px;margin:0">
          <label for="e_stb" style="font-weight:600;color:#6b7280;font-size:0.9rem">Set 3 es super tie-break</label>

    <div class="controls" style="margin-top:16px;display:flex;justify-content:flex-end;gap:8px">
      <button id="e_cancel" class="back-btn">Atrás</button>
      <button id="e_save" class="btn">Enviar</button>
    </div>
  `

  backdrop.appendChild(modal)
  document.body.appendChild(backdrop)

  document.getElementById('e_cancel').addEventListener('click', closeEditModal)
  document.getElementById('e_save').addEventListener('click', submitEditResult)
}

let editTargetMatch = null
function openEditModal(match){
  createEditModal()
  editTargetMatch = match

  const t1 = [(match.p1a||'').trim(), (match.p1b||'').trim()].filter(Boolean).join(' / ') || 'Equipo 1'
  const t2 = [(match.p2a||'').trim(), (match.p2b||'').trim()].filter(Boolean).join(' / ') || 'Equipo 2'

  document.getElementById('e_team1_title').innerText = t1
  document.getElementById('e_team2_title').innerText = t2

  document.getElementById('e_s11').value = ''
  document.getElementById('e_s12').value = ''
  document.getElementById('e_s13').value = ''
  document.getElementById('e_s21').value = ''
  document.getElementById('e_s22').value = ''
  document.getElementById('e_s23').value = ''

  document.getElementById('e_stb').checked = (String(match.format)==='bo3_stb')

  document.getElementById('editBackdrop').style.display = 'flex'
}

function closeEditModal(){
  const bd = document.getElementById('editBackdrop')
  if(bd) bd.style.display = 'none'
  editTargetMatch = null
}

async function submitEditResult(){
  if(!editTargetMatch) return
  const s11 = (document.getElementById('e_s11').value||'').trim()
  const s21 = (document.getElementById('e_s21').value||'').trim()
  // basic validation
  if(!/^\d+$/.test(s11) || !/^\d+$/.test(s21)) { alert('Introduce resultado de Set 1'); return }
  const s12 = (document.getElementById('e_s12').value||'').trim()
  const s22 = (document.getElementById('e_s22').value||'').trim()
  // basic validation
  if(!/^\d+$/.test(s12) || !/^\d+$/.test(s22)) { alert('Introduce resultado de Set 2'); return }
  const s13 = (document.getElementById('e_s13').value||'').trim()
  const s23 = (document.getElementById('e_s23').value||'').trim()
  // validate optional sets numeric if present
  for(const v of [s12,s22,s13,s23]){ if(v!=='' && !/^\d+$/.test(v)){ alert('Los sets deben ser números enteros no negativos'); return } }

  const payload = {
    date: formatDateText(editTargetMatch.date || ''),
    p1a: editTargetMatch.p1a, p1b: editTargetMatch.p1b, p2a: editTargetMatch.p2a, p2b: editTargetMatch.p2b,
    s11: s11, s21: s21, s12: s12, s22: s22, s13: s13, s23: s23
  }
  if(document.getElementById('e_stb').checked) payload.format = 'bo3_stb'
  // include original to target the exact match row
  payload._original = { date: editTargetMatch.date, p1a: editTargetMatch.p1a, p1b: editTargetMatch.p1b, p2a: editTargetMatch.p2a, p2b: editTargetMatch.p2b, event_id: editTargetMatch.event_id }

  const btn = document.getElementById('e_save')
  btn.disabled = true; btn.textContent = 'Enviando...'
  try{
    const res = await fetch('/api/submitResult',{ method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) })
    const j = await res.json().catch(()=>({}))
    if(!res.ok || !j.ok){ throw new Error('save_failed') }
    closeEditModal()
    // refresh data and reapply filter
    await loadInitial()
    onLeagueChange()
    alert('Marcador guardado')
  }catch(e){ console.error(e); alert('Error al guardar marcador') }
  finally{ if(btn){ btn.disabled = false; btn.textContent = 'Enviar' } }
}
</script>
