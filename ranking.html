<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ranking</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f8ff;--card:#ffffff;--muted:#6b7280;--primary:#2563eb}
*{box-sizing:border-box}
body{font-family:Inter, system-ui, -apple-system, 'Segoe UI', Roboto, Arial;margin:0;background:linear-gradient(180deg,var(--bg),#eef4ff 60%);color:#0b1530;padding:28px 18px}
.site{max-width:980px;margin:0 auto}
.block{background:var(--card);border-radius:12px;padding:16px;border:1px solid rgba(15,23,42,0.04);box-shadow:0 8px 30px rgba(16,24,40,0.04)}

/* Controles (Header) */
.controls {
  display: flex;
  align-items: center;
  margin-bottom: 16px;
  font-weight: 500;
  font-size: 0.95rem;
}
.controls input[type="checkbox"] { width: 16px; height: 16px; cursor: pointer; }

/* Tabla */
.table-container {
  border-radius: 10px;
  border: 1px solid rgba(0, 0, 0, 0.05);
  overflow-x: auto;
}
table{width:100%;border-collapse:collapse;margin:0}
th,td{padding:12px 10px;border-bottom:1px solid rgba(0,0,0,0.04);text-align:left;vertical-align:middle}
th{background:#f8fafc;font-weight:700;color:#4b5563;}
tr:last-child td { border-bottom: none; }

.rank-col{width:64px;text-align:center;font-weight:700;color:#4b5563;}
.name-col{font-weight:600;color:#1e293b}
.points-col{width:96px;text-align:center;font-weight:700;color:#2563eb;}
.detail-col{width:90px;text-align:center;color:#4b5563}

/* Lógica visual de las columnas de detalle */
.hide-detail .detail-col { display: none; }

/* Botones */
.back-btn{background:#fff;color:#2563eb;border:1px solid rgba(37,99,235,0.12);padding:8px 12px;border-radius:8px;cursor:pointer;font-weight:500;}
.muted{color:var(--muted)}

.info-btn {
  background: #f7fee7;
  color: #4d7c0f;
  border: 1px solid #bef264;
  padding: 8px 14px;
  border-radius: 8px;
  cursor: pointer;
  font-weight: 700;
  transition: all 0.15s ease;
  box-shadow: 0 2px 8px rgba(163, 230, 53, 0.25);
}
.info-btn:hover { background: #ecfccb; border-color: #a3e635; transform: translateY(-1px); }

@media(max-width:720px){body{padding:16px}}
</style>
</head>
<body>

<div class="site">
  <div class="block">

    <!-- Header con el Checkbox -->
    <div class="controls">
      <label style="cursor: pointer; display: flex; align-items: center; gap: 8px;">
        <input type="checkbox" id="toggleDetail" onchange="toggleColumns()">
        <span>Ver detalle</span>
      </label>
    </div>

    <!-- Contenedor del Ranking -->
    <div class="table-container">
      <table id="rankingTable" class="hide-detail" aria-label="Ranking">
        <thead>
          <tr>
            <th class="rank-col">Pos</th>
            <th>Jugador</th>
            <th class="detail-col">Torneos</th>
            <th class="detail-col">Ligas</th>
            <th class="detail-col">Partidos</th>
            <th class="points-col">Puntos</th>
          </tr>
        </thead>
        <tbody id="rankingBody">
          <tr><td colspan="6" class="muted" style="text-align:center; padding: 24px;">Cargando ranking…</td></tr>
        </tbody>
      </table>
    </div>

    <!-- Footer -->
    <div style="margin-top:14px;display:flex;justify-content:space-between;align-items:center">
      <button class="info-btn" onclick="window.location.href='/ranking-info.html'">
        💡 ¿Cómo funciona el ranking?
      </button>
      <div style="text-align:right">
        <button class="back-btn" onclick="window.location='/'">Atrás</button>
      </div>
    </div>

  </div>
</div>

<script>
// ============================================================================
// UI & TABLA
// ============================================================================

function toggleColumns() {
  const table = document.getElementById('rankingTable');
  const isChecked = document.getElementById('toggleDetail').checked;
  if (isChecked) {
    table.classList.remove('hide-detail');
  } else {
    table.classList.add('hide-detail');
  }
}

function renderRanking(data) {
  const tbody = document.getElementById('rankingBody');

  if (!data || data.length === 0) {
    tbody.innerHTML = '<tr><td colspan="6" class="muted" style="text-align:center; padding:24px;">No hay jugadores en el ranking</td></tr>';
    return;
  }

  // Ordenar por Puntos totales descendente, y en empate alfabéticamente
  data.sort((a, b) => {
    if (b.puntos !== a.puntos) return b.puntos - a.puntos;
    return a.name.localeCompare(b.name, 'es', { sensitivity: 'base', numeric: true });
  });

  let html = '';
  let currentRank = 1;

  data.forEach((row, index) => {
    // Manejo de empates en posiciones
    if (index > 0 && row.puntos < data[index - 1].puntos) {
      currentRank = index + 1;
    }

    html += `
      <tr>
        <td class="rank-col">${currentRank}</td>
        <td class="name-col">${escapeHtml(row.name)}</td>
        <td class="detail-col">${row.torneos}</td>
        <td class="detail-col">${row.ligas}</td>
        <td class="detail-col">${row.partidos}</td>
        <td class="points-col">${row.puntos.toLocaleString('es-ES')}</td>
      </tr>
    `;
  });

  tbody.innerHTML = html;
}

function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, function(c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

// ============================================================================
// CARGA Y PROCESAMIENTO DE DATOS
// ============================================================================

function fetchActivePlayers() {
  return fetch('/api/getNames')
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(db => (db && db.names) ? db.names : [])
    .catch(e => { console.error('Error cargando jugadores', e); return []; });
}

function fetchMatches() {
  const url = `/api/getResults?eventType=ranked,grupo_liga,pozo,doble_ko&ts=${Date.now()}`;
  return fetch(url)
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(db => (db && db.matches) ? db.matches : [])
    .catch(e => { console.error('Error cargando partidos', e); return []; });
}

function processRanking(players, matches) {
  const rankingMap = new Map();

  // 1. Inicializar mapa solo con jugadores activos
  players.forEach(name => {
    const trimmed = String(name || '').trim();
    if (trimmed) {
      rankingMap.set(trimmed, {
        name: trimmed,
        torneos: 0,
        ligas: 0,
        partidos: 0,
        puntos: 0
      });
    }
  });

  // 2. Procesar los partidos para asignar los puntos por categoría
  matches.forEach(m => {
    const type = String(m.event_type || '').trim().toLowerCase();

    // Obtener los 4 jugadores del partido
    const matchPlayers = [m.p1a, m.p1b, m.p2a, m.p2b]
      .map(p => String(p || '').trim())
      .filter(Boolean);

    matchPlayers.forEach(pName => {
      // Solo sumamos puntos si el jugador está entre los activos registrados
      if (rankingMap.has(pName)) {
        const stats = rankingMap.get(pName);

        // Partidos: event_type = ranked
        if (type === 'ranked') {
          stats.partidos += 1;
        }
        // Ligas: event_type = grupo_liga
        else if (type === 'grupo_liga') {
          stats.ligas += 1;
        }
        // Torneos: event_type = pozo o doble_ko
        else if (type === 'pozo' || type === 'doble_ko') {
          stats.torneos += 1;
        }

        // Fórmula básica: 1 punto por partido disputado en cualquier categoría
        stats.puntos = stats.partidos + stats.ligas + stats.torneos;
      }
    });
  });

  return Array.from(rankingMap.values());
}

async function init() {
  try {
    const [players, matches] = await Promise.all([
      fetchActivePlayers(),
      fetchMatches()
    ]);

    const rankingData = processRanking(players, matches);
    renderRanking(rankingData);
  } catch (err) {
    console.error('Error al inicializar el ranking:', err);
    document.getElementById('rankingBody').innerHTML = '<tr><td colspan="6" class="muted" style="text-align:center; padding: 24px;">Error cargando los datos del ranking</td></tr>';
  }
}

init();
</script>

</body>
</html>
