<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ranking</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f8ff;--card:#ffffff;--muted:#6b7280;--primary:#2563eb}
*{box-sizing:border-box}
body{font-family:Inter, system-ui, -apple-system, 'Segoe UI', Roboto, Arial;margin:0;background:linear-gradient(180deg,var(--bg),#eef4ff 60%);color:#0b1530;padding:28px 18px}
.site{max-width:980px;margin:0 auto}
.block{background:var(--card);border-radius:12px;padding:16px;border:1px solid rgba(15,23,42,0.04);box-shadow:0 8px 30px rgba(16,24,40,0.04)}
.block-title{font-weight:700;margin-bottom:10px}
table{width:100%;border-collapse:collapse;margin-top:8px}
th,td{padding:10px;border-bottom:1px solid #f0f0f0;text-align:left}
th{background:#fbfdff;font-weight:700}
.rank-col{width:72px;text-align:center}
.rating-col{width:96px;text-align:center;color:var(--muted);font-weight:700}
.fiabilidad-col{width:96px;text-align:center;color:var(--muted);font-weight:700}
.name-col{font-weight:600}
.back-btn{background:#fff;color:#2563eb;border:1px solid rgba(37,99,235,0.12);padding:8px 12px;border-radius:8px;cursor:pointer}
.muted{color:var(--muted)}
@media(max-width:720px){body{padding:16px}}
</style>
</head>
<body>

<div class="site">
  <div class="block">

    <div id="rankingContainer">
      <div class="muted">Cargando ranking…</div>
    </div>

    <div style="margin-top:14px;display:flex;justify-content:space-between;align-items:center">
      <div></div>
      <div style="text-align:right">
        <button class="back-btn" onclick="window.location='/'">Atrás</button>
      </div>
    </div>

  </div>
</div>

<script>
// ============================================================================
// GLICKO-2 ENGINE (MATCHES PYTHON IMPLEMENTATION EXACTLY)
// ============================================================================

const GLICKO_SCALE = 173.7178;
const TAU = 0.5;
const INITIAL_RATING = 1500.0;
const INITIAL_RD = 350.0;
const INITIAL_SIGMA = 0.12;
const MIN_RD = 80.0;
const MAX_RD = 350.0;

class Glicko2Player {
  constructor(rating = INITIAL_RATING, rd = INITIAL_RD, sigma = INITIAL_SIGMA) {
    this.rating = rating;
    this.rd = rd;
    this.sigma = sigma;
  }

  get mu() { return (this.rating - 1500.0) / GLICKO_SCALE; }
  get phi() { return this.rd / GLICKO_SCALE; }

  static fromGlickoScale(mu, phi, sigma) {
    return new Glicko2Player(
      1500.0 + GLICKO_SCALE * mu,
      GLICKO_SCALE * phi,
      sigma
    );
  }
}

function g(phi) {
  return 1.0 / Math.sqrt(1.0 + (3.0 * phi * phi) / (Math.PI * Math.PI));
}

function expected(mu, oppMu, oppPhi) {
  const gPhi = g(oppPhi);
  const z = gPhi * (mu - oppMu);
  if (z >= 0) {
    return 1.0 / (1.0 + Math.exp(-z));
  }
  const ez = Math.exp(z);
  return ez / (1.0 + ez);
}

function solveNewSigma(phi, sigma, delta, v, tau) {
  const a = Math.log(sigma * sigma);
  const phiSq = phi * phi;
  const tauSq = tau * tau;

  function f(x) {
    const ex = Math.exp(x);
    const num = ex * (delta * delta - phiSq - v - ex);
    const den = 2.0 * Math.pow(phiSq + v + ex, 2);
    return (num / den) - ((x - a) / tauSq);
  }

  let A = a;
  let B;

  if (delta * delta > phiSq + v) {
    B = Math.log(delta * delta - phiSq - v);
  } else {
    let k = 1;
    while (f(a - k * tau) < 0.0) {
      k += 1;
      if (k > 1000) break;
    }
    B = a - k * tau;
  }

  let fA = f(A);
  let fB = f(B);

  for (let i = 0; i < 100; i++) {
    if (Math.abs(B - A) < 1e-12) break;

    let C = A + (A - B) * fA / (fB - fA);
    let fC = f(C);

    if (fC * fB < 0) {
      A = B;
      fA = fB;
    } else {
      fA *= fB / (fB + fC);
    }
    B = C;
    fB = fC;
  }

  return Math.exp(A / 2.0);
}

function decayAllPlayersOneDay(playerMap) {
  const maxPhi = MAX_RD / GLICKO_SCALE;

  playerMap.forEach((player, key) => {
    const mu = player.mu;
    const phi = player.phi;

    let phiStar = Math.sqrt(phi * phi + player.sigma * player.sigma);
    phiStar = Math.min(phiStar, maxPhi);

    playerMap.set(key, Glicko2Player.fromGlickoScale(mu, phiStar, player.sigma));
  });
}

function getPlayerOrCreate(playerMap, name) {
  const trimmed = (name || '').trim();
  if (!trimmed) return new Glicko2Player();
  if (!playerMap.has(trimmed)) {
    playerMap.set(trimmed, new Glicko2Player());
  }
  return playerMap.get(trimmed);
}

function getTeamState(p1Key, p2Key, playerMap) {
  const p1 = getPlayerOrCreate(playerMap, p1Key);
  const p2 = getPlayerOrCreate(playerMap, p2Key);

  const teamMu = (p1.mu + p2.mu) / 2.0;
  const teamPhi = Math.sqrt(p1.phi * p1.phi + p2.phi * p2.phi) / 2.0;
  return { mu: teamMu, phi: teamPhi };
}

function updatePeriod(playerMap, periodMatches) {
  const starting = new Map();
  playerMap.forEach((p, name) => {
    starting.set(name, new Glicko2Player(p.rating, p.rd, p.sigma));
  });

  const observations = new Map();

  for (const m of periodMatches) {
    const t1State = getTeamState(m.team1[0], m.team1[1], starting);
    const t2State = getTeamState(m.team2[0], m.team2[1], starting);

    const scoreT1 = m.score;
    const scoreT2 = 1.0 - m.score;

    m.team1.forEach(p => {
      if (!observations.has(p)) observations.set(p, []);
      observations.get(p).push({ oppMu: t2State.mu, oppPhi: t2State.phi, score: scoreT1, weight: m.weight });
    });

    m.team2.forEach(p => {
      if (!observations.has(p)) observations.set(p, []);
      observations.get(p).push({ oppMu: t1State.mu, oppPhi: t1State.phi, score: scoreT2, weight: m.weight });
    });
  }

  observations.forEach((obsList, pName) => {
    const player = getPlayerOrCreate(starting, pName);
    const mu = player.mu;
    const phi = player.phi;

    let sumV = 0.0;
    let sumDelta = 0.0;

    for (const obs of obsList) {
      const gPhi = g(obs.oppPhi);
      const eVal = expected(mu, obs.oppMu, obs.oppPhi);

      sumV += obs.weight * gPhi * gPhi * eVal * (1.0 - eVal);
      sumDelta += obs.weight * gPhi * (obs.score - eVal);
    }

    if (sumV <= 0) return;

    const v = 1.0 / sumV;
    const delta = v * sumDelta;

    const newSigma = solveNewSigma(phi, player.sigma, delta, v, TAU);
    const phiStar = Math.sqrt(phi * phi + newSigma * newSigma);
    let newPhi = 1.0 / Math.sqrt((1.0 / (phiStar * phiStar)) + (1.0 / v));

    const minPhi = MIN_RD / GLICKO_SCALE;
    newPhi = Math.max(newPhi, minPhi);

    const newMu = mu + newPhi * newPhi * sumDelta;

    playerMap.set(pName, Glicko2Player.fromGlickoScale(newMu, newPhi, newSigma));
  });
}

function calculateEngineRankings(names, matches) {
  const playerMap = new Map();
  names.forEach(n => {
    if (n && n.trim()) playerMap.set(n.trim(), new Glicko2Player());
  });

  if (!matches || matches.length === 0) {
    return Array.from(playerMap.entries()).map(([name, p]) => ({
      name,
      rating: Math.round(p.rating),
      rd: Math.round(p.rd)
    }));
  }

  matches.forEach(m => {
    m.team1.concat(m.team2).forEach(pName => {
      getPlayerOrCreate(playerMap, pName);
    });
  });

  // Preserve insertion order on identical dates (stable sort)
  matches.sort((a, b) => {
    const dComp = a.date.localeCompare(b.date);
    return dComp !== 0 ? dComp : (a.id - b.id);
  });

  const byDate = new Map();
  matches.forEach(m => {
    if (!byDate.has(m.date)) byDate.set(m.date, []);
    byDate.get(m.date).push(m);
  });

  const [startY, startM, startD] = matches[0].date.split('-').map(Number);
  const [endY, endM, endD] = matches[matches.length - 1].date.split('-').map(Number);

  let curTime = Date.UTC(startY, startM - 1, startD);
  const endTime = Date.UTC(endY, endM - 1, endD);
  const ONE_DAY_MS = 24 * 60 * 60 * 1000;

  while (curTime <= endTime) {
    const d = new Date(curTime);
    const yyyy = d.getUTCFullYear();
    const mm = String(d.getUTCMonth() + 1).padStart(2, '0');
    const dd = String(d.getUTCDate()).padStart(2, '0');
    const dateStr = `${yyyy}-${mm}-${dd}`;

    decayAllPlayersOneDay(playerMap);

    if (byDate.has(dateStr)) {
      updatePeriod(playerMap, byDate.get(dateStr));
    }

    curTime += ONE_DAY_MS;
  }

  return Array.from(playerMap.entries()).map(([name, p]) => ({
    name,
    rating: Math.round(p.rating),
    rd: Math.round(p.rd)
  }));
}

// ============================================================================
// DATA FETCHING & UI RENDER
// ============================================================================

function fetchNames() {
  const url = '/api/getNames?includeInactive=1&ts=' + Date.now();
  return fetch(url)
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(db => (db && db.names) ? db.names : [])
    .catch(e => { console.error('Could not load names', e); return []; });
}

function fetchMatches() {
  function toIsoDate(s){
    if(!s) return null;
    if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
    const parts = String(s).split('/');
    if(parts.length===3){
      const d = String(parts[0]).padStart(2,'0');
      const m = String(parts[1]).padStart(2,'0');
      const y = String(parts[2]);
      return `${y}-${m}-${d}`;
    }
    const dt = new Date(s);
    if(isNaN(dt.getTime())) return null;
    return dt.toISOString().split('T')[0];
  }

  function f_x(x){
    return (4.0 * x - 1.0) / (x + 1.0);
  }

  return fetch(`/api/getResults?eventType=legacy,pozo&ts=${Date.now()}`)
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(db => {
      const raw = (db && db.matches) ? db.matches : [];
      return raw.map((m, idx) => {
        const dateIso = toIsoDate(m.date) || toIsoDate(m.start_date) || new Date().toISOString().split('T')[0];

        const p1a = (m.p1a || '').trim();
        const p1b = (m.p1b || '').trim();
        const p2a = (m.p2a || '').trim();
        const p2b = (m.p2b || '').trim();

        const s1 = [m.s11, m.s12, m.s13].map(x => { const v = parseInt(String(x||'').trim(),10); return Number.isFinite(v) ? v : null; });
        const s2 = [m.s21, m.s22, m.s23].map(x => { const v = parseInt(String(x||'').trim(),10); return Number.isFinite(v) ? v : null; });

        const fmtLow = String(m.format || '').toLowerCase();
        let setsWon1 = 0;
        let setsWon2 = 0;
        let totalGames1 = 0;
        let totalGames2 = 0;

        for (let i = 0; i < 3; i++) {
          const g1 = s1[i];
          const g2 = s2[i];

          if (g1 === null || g2 === null) continue;

          if (i === 2 && fmtLow.includes('bo3_stb')) {
            if (g1 > g2) {
              setsWon1++;
              totalGames1 += 1;
            } else if (g2 > g1) {
              setsWon2++;
              totalGames2 += 1;
            }
            continue;
          }

          totalGames1 += g1;
          totalGames2 += g2;

          if (g1 > g2) setsWon1++;
          else if (g2 > g1) setsWon2++;
        }

        const totalGames = totalGames1 + totalGames2;
        if (totalGames === 0 || setsWon1 === setsWon2) return null;

        const winnerIsTeam1 = setsWon1 > setsWon2;
        const score = winnerIsTeam1 ? 1.0 : 0.0;

        const w1 = (fmtLow.includes('timed') || fmtLow.includes('timed_games')) ? 0.25 : 1.0;

        const winnerGames = winnerIsTeam1 ? totalGames1 : totalGames2;
        const x = winnerGames / totalGames;
        let w2 = f_x(x);
        if (!Number.isFinite(w2) || w2 <= 0) w2 = 0.0001;

        const weight = w1 * w2;

        return {
          id: idx,
          date: dateIso,
          team1: [p1a, p1b],
          team2: [p2a, p2b],
          score: score,
          weight: weight
        };
      }).filter(m => m && m.date && m.team1[0] && m.team1[1] && m.team2[0] && m.team2[1]);
    })
    .catch(e => { console.error('Could not load matches', e); return []; });
}

function computeRankings(entries) {
  entries.sort((a, b) => {
    if (b.rating !== a.rating) return b.rating - a.rating;
    return String(a.name || '').localeCompare(String(b.name || ''), 'es', { sensitivity: 'base', numeric: true });
  });

  const out = [];
  for (let i = 0; i < entries.length; i++) {
    const e = entries[i];
    let rank;
    if (i === 0) rank = 1;
    else if (entries[i].rating === entries[i - 1].rating) rank = out[i - 1].rank;
    else rank = i + 1;
    out.push({ rank, rating: e.rating, name: e.name, rd: e.rd });
  }
  return out;
}

function renderTable(rows) {
  if (!rows || rows.length === 0) {
    document.getElementById('rankingContainer').innerHTML = '<div class="muted">No hay jugadores registrados</div>';
    return;
  }
  function rdLabel(rd) {
    if (rd === undefined || rd === null) return '';
    const v = Number(rd);
    if (!Number.isFinite(v)) return '';
    if (v < 120) return 'Muy alta';
    if (v < 160) return 'Alta';
    if (v < 200) return 'Media';
    if (v < 240) return 'Baja';
    return 'Muy baja';
  }

  const html = [`<table aria-label="Ranking"><thead><tr><th class="rank-col">Pos</th><th>Jugador</th><th class="rating-col">Puntos</th><th class="fiabilidad-col">Fiabilidad</th></tr></thead><tbody>`];
  for (const r of rows) {
    const label = rdLabel(r.rd);
    html.push(`<tr><td class="rank-col">${r.rank}</td><td class="name-col">${escapeHtml(r.name)}</td><td class="rating-col">${r.rating}</td><td class="fiabilidad-col">${label}</td></tr>`);
  }
  html.push('</tbody></table>');
  document.getElementById('rankingContainer').innerHTML = html.join('');
}

function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, function(c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

async function init() {
  const [names, matches] = await Promise.all([fetchNames(), fetchMatches()]);
  const entries = calculateEngineRankings(names, matches);
  const ranked = computeRankings(entries);
  renderTable(ranked);
}

init();
</script>

</body>
</html>
