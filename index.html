<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pirate Padel Team</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="/image.png" type="image/png">
<style>
:root{
  --bg:#f5f8ff;
  --card:#ffffff;
  --muted:#6b7280;
  --primary:#2563eb; /* blue */
  --accent:#06b6d4; /* teal */
  --success:#10b981;
}
*{box-sizing:border-box}
body{
  font-family:Inter, system-ui, -apple-system, 'Segoe UI', Roboto, Arial;
  margin:0;
  background:linear-gradient(180deg,var(--bg),#eef4ff 60%);
  color:#0f172a;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  padding:28px 18px;
}
.site{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.block{background:var(--card);border-radius:12px;padding:16px;border:1px solid rgba(15,23,42,0.04);box-shadow:0 8px 30px rgba(16,24,40,0.04)}
.block-title{font-weight:700;margin-bottom:10px;font-size:1.05rem;color:#0b1530}
.block-row{display:flex;gap:12px;align-items:center}

.controls{display:flex;gap:12px;flex-wrap:wrap}
.btn{background:var(--primary);color:#fff;padding:10px 16px;border-radius:10px;border:none;cursor:pointer;font-weight:700;min-width:140px;box-shadow:0 8px 20px rgba(37,99,235,0.08);transition:transform .12s ease}
.btn.secondary{background:var(--accent)}
.btn.secondary-green{background:#14b8a6}
.btn.purple{background:#8b5cf6;box-shadow:0 8px 20px rgba(139,92,246,0.12)}
.btn.red{background:#ef4444;color:white;box-shadow:0 8px 20px rgba(239,68,68,0.12)}
.btn.warn{background:#fb923c;color:white;box-shadow:0 8px 20px rgba(251,146,60,0.12)}

.admin-bottom{background:#ef4444;color:#fff;border:none;padding:8px 12px;border-radius:8px;cursor:pointer}
.admin-desktop{display:block;background:#ef4444;color:#fff;border:none;padding:8px 12px;border-radius:8px;cursor:pointer;margin:12px auto 18px auto;min-width:160px;text-align:center}
.admin-mobile{display:none}
@media(max-width:720px){
  .admin-desktop{display:none}
  .admin-mobile{display:block;margin:12px auto 18px auto}
}

.register-input{flex:1;min-width:180px;padding:10px;border-radius:8px;border:1px solid rgba(15,23,42,0.06)}

#days{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-top:8px}
.day{background:linear-gradient(180deg,#fff,#fbfdff);padding:14px;border-radius:10px;border:1px solid rgba(15,23,42,0.04);cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:600;color:#0b1530;min-height:58px}
.day.red{background:linear-gradient(180deg,#fff1f0,#fff8f7);border-color:rgba(255,99,99,0.08)}
.day:hover{transform:translateY(-6px);box-shadow:0 12px 30px rgba(12,20,40,0.06)}

label.small{display:block;font-weight:600;margin-bottom:6px;color:var(--muted)}

@media(min-width:900px){.site{gap:20px}.block-row{align-items:center}}
@media(max-width:720px){body{padding:16px}.btn{min-width:120px;padding:12px 14px}#days{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}.register-input{min-width:0;width:100%}#adminOverlay > div{flex-direction:column}#adminOverlay > div > #adminMenuColumn{flex-basis:auto;width:100%}#adminOverlay > div > #adminMain{width:100%;max-width:100%}.pozo-form-grid{grid-template-columns:1fr !important}}
</style>
</head>

<body>

<div class="site">

  <div class="block">
    <div class="block-title">Sube resultados</div>
      <div class="block-row">
        <div style="flex:1">
          <label class="small">Publica los resultados de tus partidos</label>
          <div class="controls">
            <button onclick="window.location='submit-result.html'" class="btn">Partidos individuales</button>
            <button class="btn secondary-green">Ligas</button>
            <button class="btn warn">Torneos</button>
          </div>
        </div>
      </div>
  </div>

  <div class="block">
    <div class="block-title">Consulta resultados</div>
    <div class="block-row">
      <div style="flex:1">
        <label class="small">Consulta el historial de resultados de partidos y eventos</label>
        <div class="controls">
          <button class="btn" onclick="window.location='history.html'">Partidos individuales</button>
          <button class="btn secondary-green">Ligas</button>
          <button class="btn warn" onclick="window.location='tournaments.html'">Torneos</button>
        </div>
      </div>
    </div>
  </div>

  <div class="block">
    <div class="block-title">Rendimiento</div>
    <div class="block-row">
      <div style="flex:1">
        <label class="small">Analiza tu rendimiento de juego y el del grupo</label>
        <div class="controls">
          <button class="btn red">Ranking</button>
          <button class="btn purple" onclick="window.location='statistics.html'">Estadísticas</button>
        </div>
      </div>
    </div>
  </div>

  <div class="block">
    <div class="block-title">Organización de partidos</div>
    <div class="block-row">
      <div style="flex:1">
        <label class="small">Selecciona un día para indicar tu disponibilidad</label>
        <div id="days"></div>
      </div>
    </div>
  </div>

</div>

<script src="app.js"></script>

<!-- Desktop admin button (visible on larger screens) -->
<button class="btn admin-desktop" onclick="openAdmin()" aria-label="Administración">Administración</button>

<!-- Mobile-only admin button (bottom center, shown only on small screens) -->
<button class="admin-bottom admin-mobile" onclick="openAdmin()" aria-label="Administración móvil">Administración</button>

<script>
// Administration overlay for managing registered names
async function openAdmin(){
  // prompt for admin key before opening admin panel
  const key = prompt('Clave de administrador:')
  if(key !== '4F7K9Q2Z'){
    alert('Clave incorrecta')
    return
  }
  window._adminKey = key

  let overlay = document.getElementById('adminOverlay')
  if(!overlay){
    overlay = document.createElement('div')
    overlay.id = 'adminOverlay'
    overlay.style.display = 'none'
    overlay.style.position = 'fixed'
    overlay.style.inset = '0'
    overlay.style.background = 'rgba(0,0,0,0.4)'
    overlay.style.alignItems = 'center'
    overlay.style.justifyContent = 'center'
    overlay.style.padding = '24px'
    overlay.innerHTML = `
      <div style="background:var(--card);max-width:640px;width:100%;border-radius:12px;padding:12px;box-shadow:0 12px 30px rgba(2,6,23,0.3);color:var(--muted);display:flex;gap:12px;justify-content:center;align-items:flex-start">
        <div id="adminMenuColumn" style="flex:0 0 260px;display:flex;flex-direction:column;gap:8px;align-items:stretch">
          <div style="font-weight:700;text-align:center;padding:8px 0">Administración</div>
          <button class="btn" style="width:100%;text-align:left" onclick="showPlayerPanel()">Nuevo jugador</button>
          <button class="btn" style="width:100%;text-align:left" onclick="alert('No implementado aún')">Nueva liga</button>
          <button class="btn" style="width:100%;text-align:left" onclick="alert('No implementado aún')">Nuevo grupo de liga</button>
          <button class="btn" style="width:100%;text-align:left" onclick="alert('No implementado aún')">Nuevo torneo Doble KO</button>
          <button class="btn" style="width:100%;text-align:left" onclick="showPozoPanel()">Nuevo torneo Pozo</button>
          <button class="btn red" style="width:100%;text-align:left" onclick="closeAdmin()">Cerrar</button>
        </div>
        <div id="adminMain" style="flex:1;display:none;flex-direction:column;gap:8px;max-width:520px">
          <div style="display:flex;align-items:center;justify-content:space-between">
            <div id="adminHeaderTitle" style="font-weight:700">Jugadores</div>
            <button id="adminHeaderButton" class="btn ghost" onclick="showAdminMenu()">Atrás</button>
          </div>
          <div id="adminContent" style="display:flex;flex-direction:column;gap:8px;max-height:420px;overflow:auto;padding-right:6px">
            <!-- Dynamic content: registration form + list -->
            <div id="playerForm" style="display:flex;gap:8px;align-items:center">
              <input id="playerNameInput" class="register-input" placeholder="Nombre completo" />
              <button class="btn secondary-green" onclick="registerPlayer()">Registrar jugador</button>
            </div>
            <div id="adminList" style="display:flex;flex-direction:column;gap:8px;overflow:auto"></div>
          </div>
        </div>
      </div>
    `
    document.body.appendChild(overlay)
  }
  overlay.style.display = 'flex'
  showAdminMenu()
}

// switch panel in admin overlay
function showAdminMenu(){
  const menu = document.getElementById('adminMenuColumn')
  const content = document.getElementById('adminContent')
  const adminMain = document.getElementById('adminMain')
  const header = document.getElementById('adminHeaderTitle')
  if(menu) menu.style.display = 'flex'
  if(content) content.style.display = 'none'
  if(adminMain) adminMain.style.display = 'none'
  if(header) header.innerText = 'Jugadores'
}

function normalizeDateInput(val){
  if(/^\d{4}-\d{2}-\d{2}$/.test(String(val||''))){
    const [y,m,d] = String(val).split('-')
    return `${d}/${m}/${y}`
  }
  return String(val || '')
}

function showPlayerPanel(){
  const menu = document.getElementById('adminMenuColumn')
  const content = document.getElementById('adminContent')
  const adminMain = document.getElementById('adminMain')
  const header = document.getElementById('adminHeaderTitle')
  if(menu) menu.style.display = 'none'
  if(adminMain) adminMain.style.display = 'flex'
  if(content) content.style.display = 'flex'
  if(header) header.innerText = 'Jugadores'
  content.innerHTML = `
    <div id="playerForm" style="display:flex;gap:8px;align-items:center">
      <input id="playerNameInput" class="register-input" placeholder="Nombre completo" />
      <button class="btn secondary-green" onclick="registerPlayer()">Registrar jugador</button>
    </div>
    <div id="adminList" style="display:flex;flex-direction:column;gap:8px;overflow:auto"></div>
  `
  loadAdminNames()
}

function showPozoPanel(){
  const menu = document.getElementById('adminMenuColumn')
  const content = document.getElementById('adminContent')
  const adminMain = document.getElementById('adminMain')
  const header = document.getElementById('adminHeaderTitle')
  if(menu) menu.style.display = 'none'
  if(adminMain) adminMain.style.display = 'flex'
  if(content) content.style.display = 'flex'
  if(header) header.innerText = 'Nuevo torneo Pozo'
  content.innerHTML = `
    <div style="display:flex;flex-direction:column;gap:12px;min-width:0">
      <label style="display:flex;flex-direction:column;gap:6px;font-weight:600;color:var(--muted)">
        Nombre del torneo
        <input id="pozoName" class="register-input" placeholder="Ej: Pozo DD/MM/AAAA" />
      </label>
      <div class="pozo-form-grid" style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <label style="display:flex;flex-direction:column;gap:6px;font-weight:600;color:var(--muted)">
          Fecha inicio
          <input id="pozoStartDate" type="date" class="register-input" />
        </label>
        <label style="display:flex;flex-direction:column;gap:6px;font-weight:600;color:var(--muted)">
          Fecha fin
          <input id="pozoEndDate" type="date" class="register-input" />
        </label>
      </div>
      <label style="display:flex;flex-direction:column;gap:6px;font-weight:600;color:var(--muted)">
        CSV del torneo
        <input id="pozoCsvFile" type="file" accept=".csv,text/csv" />
      </label>
      <div style="color:var(--muted);font-size:0.9rem;line-height:1.4">
        Formato del fichero CSV (sin cabecera): jugador1;jugador2;jugador3;jugador4;juegos_pareja1;juegos_pareja2
      </div>
      <div style="color:var(--muted);font-size:0.9rem;line-height:1.4">
        En caso de empate a juegos, añadir el símbolo '+' a los juegos de la pareja ganadora, por ejemplo J1;J2;J3;J4;4;4+
      </div>
      <button class="btn secondary-green" onclick="submitPozoTournament()">Guardar torneo</button>
    </div>
  `
}

async function submitPozoTournament(){
  const name = document.getElementById('pozoName')?.value.trim() || ''
  const startInput = document.getElementById('pozoStartDate')?.value || ''
  const endInput = document.getElementById('pozoEndDate')?.value || ''
  const fileEl = document.getElementById('pozoCsvFile')
  const file = fileEl && fileEl.files ? fileEl.files[0] : null

  if(!name){ alert('Introduce el nombre del torneo'); return }
  if(!startInput || !endInput){ alert('Selecciona la fecha de inicio y la de fin'); return }
  if(!file){ alert('Sube un fichero CSV'); return }

  try{
    const csvText = await file.text()
    const payload = {
      name,
      start_date: normalizeDateInput(startInput),
      end_date: normalizeDateInput(endInput),
      csv: csvText
    }

    const res = await fetch('/api/createPozoTournament', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    })

    const json = await res.json().catch(() => ({}))
    if(!res.ok || !json.ok){
      throw new Error(json && json.error ? json.error : 'Error al guardar el torneo')
    }

    alert('Torneo Pozo guardado')
    closeAdmin()
  }catch(e){
    console.error(e)
    alert(e && e.message ? e.message : 'Error al guardar el torneo')
  }
}

async function registerPlayer(){
  const el = document.getElementById('playerNameInput')
  if(!el) return
  const name = el.value.trim()
  if(!name){ alert('Introduce un nombre completo'); return }
  try{
    const res = await fetch('/api/submitName',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name})})
    const j = await res.json()
    if(j && j.ok){
      if(j.added){ alert('Jugador guardado'); el.value = '' }
      else alert('Nombre ya registrado')
      await loadAdminNames()
    } else {
      alert('Error al guardar')
    }
  }catch(e){ console.error(e); alert('Error al guardar') }
}
function closeAdmin(){ const o=document.getElementById('adminOverlay'); if(o) o.style.display='none' }

async function loadAdminNames(){
  const isLocal = location.hostname==='localhost' || location.hostname==='127.0.0.1'
  try{
    const res = await fetch('/api/getNames')
    const db = await res.json()
    const names = (db && db.names) ? (db.names.slice().sort((a,b)=>a.toLowerCase().localeCompare(b.toLowerCase()))) : []
    const container = document.getElementById('adminList')
    if(!container) return
    container.innerHTML = ''
    for(const n of names){
      const row = document.createElement('div')
      row.style.display = 'flex'
      row.style.alignItems = 'center'
      row.style.justifyContent = 'space-between'
      row.style.padding = '8px'
      row.style.borderRadius = '8px'
      row.style.background = 'linear-gradient(180deg,#fff,#fbfdff)'
      const span = document.createElement('div')
      span.style.color = 'var(--muted)'
      span.innerText = n
      const btn = document.createElement('button')
      btn.className = 'btn ghost'
      btn.style.minWidth = '90px'
      btn.innerText = 'Eliminar'
      btn.onclick = (async ()=>{
        if(!confirm(`Eliminar "${n}"?`)) return
        try{
          const endpoint = '/api/deleteName'
          const r = await fetch(endpoint,{
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({name:n, adminKey: window._adminKey})
          })
          const j = await r.json()
          if(j && j.ok){
            await loadAdminNames()
          } else {
            alert('No se pudo eliminar')
          }
        }catch(e){ console.error(e); alert('Error al eliminar') }
      })
      row.appendChild(span)
      row.appendChild(btn)
      container.appendChild(row)
    }
  }catch(e){ console.error('Could not load names for admin',e) }
}


</script>

</body>
</html>
