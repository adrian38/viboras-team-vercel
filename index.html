    overlay.style.inset = '0'
    overlay.style.background = 'rgba(0,0,0,0.4)'

    overlay.style.justifyContent = 'center'

              <button class="btn secondary-green" onclick="registerPlayer()">Registrar jugador</button>

// switch panel in admin overlay
function showAdminMenu(){
  const menu = document.getElementById('adminMenuColumn')
  const content = document.getElementById('adminContent')
  const adminMain = document.getElementById('adminMain')
  const header = document.getElementById('adminHeaderTitle')
  if(menu) menu.style.display = 'flex'

  if(header) header.innerText = 'Jugadores'

const MAX_LEAGUE_GROUPS = 20
const MAX_LEAGUE_PHASES = 10

function clampLeagueCount(value, maxValue){
  const parsed = Number.parseInt(String(value ?? ''), 10)
  if(!Number.isFinite(parsed)) return 1
  return Math.min(Math.max(parsed, 1), maxValue)
}

function changeNumber(id, delta){
  const el = document.getElementById(id)
  if(!el) return
  const min = el.hasAttribute('min') ? Number(el.getAttribute('min')) : null
  const max = el.hasAttribute('max') ? Number(el.getAttribute('max')) : null
  let val = Number(el.value) || 0
  val = val + delta
  if(min !== null) val = Math.max(val, min)
  if(max !== null) val = Math.min(val, max)
  el.value = String(val)
  // trigger input handlers if any
  const evt = new Event('input', { bubbles: true })
  el.dispatchEvent(evt)
}

function normalizeDateInput(val){
  if(/^\d{4}-\d{2}-\d{2}$/.test(String(val||''))){
    const [y,m,d] = String(val).split('-')
    return `${d}/${m}/${y}`
  }
  return String(val || '')
}

function addDaysToDateText(dateText, daysToAdd){
  const [d, m, y] = String(dateText || '').split('/')
  if(!d || !m || !y) return null
  const date = new Date(Date.UTC(Number(y), Number(m) - 1, Number(d)))
  date.setUTCDate(date.getUTCDate() + daysToAdd)
  const dd = String(date.getUTCDate()).padStart(2, '0')
  const mm = String(date.getUTCMonth() + 1).padStart(2, '0')
  const yyyy = String(date.getUTCFullYear())
  return `${dd}/${mm}/${yyyy}`
}

function validateLeaguePhaseSequence(leagueStartDate, leagueEndDate, phaseList){
  if(!leagueStartDate || !leagueEndDate){
    return 'Faltan las fechas de la liga'
  }

  const leagueStart = new Date(Date.UTC(Number(leagueStartDate.split('/')[2]), Number(leagueStartDate.split('/')[1]) - 1, Number(leagueStartDate.split('/')[0])))
  const leagueEnd = new Date(Date.UTC(Number(leagueEndDate.split('/')[2]), Number(leagueEndDate.split('/')[1]) - 1, Number(leagueEndDate.split('/')[0])))

  if(leagueStart > leagueEnd){
    return 'La fecha de inicio de la liga no puede ser posterior a la de fin'
  }

  if(!phaseList || phaseList.length === 0){
    return 'La liga debe tener al menos una fase'
  }

  const firstPhase = phaseList[0]
  const lastPhase = phaseList[phaseList.length - 1]

  if(firstPhase.start_date !== leagueStartDate){
    return 'La primera fase debe empezar el mismo día que la liga'
  }
  if(lastPhase.end_date !== leagueEndDate){
    return 'La última fase debe terminar el mismo día que la liga'
  }

  for(let i = 0; i < phaseList.length; i++){
    const phase = phaseList[i]
    const phaseStart = new Date(Date.UTC(Number(phase.start_date.split('/')[2]), Number(phase.start_date.split('/')[1]) - 1, Number(phase.start_date.split('/')[0])))
    const phaseEnd = new Date(Date.UTC(Number(phase.end_date.split('/')[2]), Number(phase.end_date.split('/')[1]) - 1, Number(phase.end_date.split('/')[0])))

    if(phaseStart > phaseEnd){
      return `La fecha de inicio de la fase ${i + 1} no puede ser posterior a la de fin`
    }

    if(i === 0 && phaseStart.getTime() !== leagueStart.getTime()){
      return 'La primera fase debe empezar el mismo día que la liga'
    }

    if(i > 0){
      const previousPhase = phaseList[i - 1]
      const previousEnd = new Date(Date.UTC(Number(previousPhase.end_date.split('/')[2]), Number(previousPhase.end_date.split('/')[1]) - 1, Number(previousPhase.end_date.split('/')[0])))
      const expectedStart = new Date(previousEnd)
      expectedStart.setUTCDate(expectedStart.getUTCDate() + 1)
      if(phaseStart.getTime() !== expectedStart.getTime()){
        return 'Las fases deben ser consecutivas, sin dejar días en blanco ni solaparse'
      }
    }
  }

  return null
}

function parseSubstitutionGroupsInput(rawText){
  if(!rawText) return []
  const lines = String(rawText).split(/\r?\n/)
  const groups = []
  const seen = new Set()

  for(const line of lines){
    const trimmed = line.trim()
    if(!trimmed) continue
    const names = trimmed.split(/[;,]/).map(part => part.trim()).filter(Boolean)
    if(!names.length) continue
    const uniqueNames = []
    for(const name of names){
      if(!name) continue
      if(seen.has(name)){
        throw new Error(`El jugador "${name}" no puede aparecer en más de un grupo de sustituciones`)
      }
      seen.add(name)
      uniqueNames.push(name)
    }
    if(uniqueNames.length > 1){
      groups.push(uniqueNames)
    }
  }

  return groups
}

function renderLeagueDynamicFields(){
  const groupField = document.getElementById('leagueGroupCount')
  const phaseField = document.getElementById('leaguePhaseCount')
  const groupCount = clampLeagueCount(groupField?.value || '1', MAX_LEAGUE_GROUPS)
  const phaseCount = clampLeagueCount(phaseField?.value || '1', MAX_LEAGUE_PHASES)

  if(groupField) groupField.value = String(groupCount)
  if(phaseField) phaseField.value = String(phaseCount)

  const groupContainer = document.getElementById('leagueGroupNameContainer')
  const phaseContainer = document.getElementById('leaguePhaseContainer')

  if(groupContainer){
    const items = []
    for(let i=0;i<groupCount;i++){
      items.push(`
        <label style="display:flex;flex-direction:column;gap:6px;font-weight:600;color:var(--muted)">
          Grupo ${i + 1}
          <input id="leagueGroupName_${i}" class="register-input" placeholder="Ej: A, B, Oro, Plata..." maxlength="40" />
        </label>
      `)
    }
    groupContainer.innerHTML = `
      <div style="display:flex;flex-direction:column;gap:10px">
        <div style="font-weight:700;color:var(--muted)">Nombres de los grupos</div>
        ${items.join('')}
      </div>
    `
  }

  if(phaseContainer){
    const items = []
    for(let i=0;i<phaseCount;i++){
      items.push(`
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;border:1px solid rgba(148,163,184,0.25);padding:10px;border-radius:8px">
          <div style="font-weight:700;color:var(--muted);grid-column:1 / -1">Fase ${i + 1}</div>
          <label style="display:flex;flex-direction:column;gap:6px;font-weight:600;color:var(--muted)">
            Fecha inicio
            <input id="leaguePhaseStart_${i}" type="date" class="register-input" />
          </label>
          <label style="display:flex;flex-direction:column;gap:6px;font-weight:600;color:var(--muted)">
            Fecha fin
            <input id="leaguePhaseEnd_${i}" type="date" class="register-input" />
          </label>
        </div>
      `)
    }
    phaseContainer.innerHTML = `
      <div style="display:flex;flex-direction:column;gap:10px">
        <div style="font-weight:700;color:var(--muted)">Fases</div>
        ${items.join('')}
      </div>
    `
  }
}

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">

          Fecha inicio

        </label>
        <label style="display:flex;flex-direction:column;gap:6px;font-weight:600;color:var(--muted)">
          Fecha fin
          <input id="leagueEndDate" type="date" class="register-input" />
        </label>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">

          Cantidad de grupos
          <div class="number-with-controls">
            <input id="leagueGroupCount" type="number" min="1" max="20" value="1" class="register-input" />
            <div class="number-controls" style="gap:6px">

              <button type="button" onclick="changeNumber('leagueGroupCount',-1)">−</button>
            </div>

        </label>
        <label style="display:flex;flex-direction:column;gap:6px;font-weight:600;color:var(--muted)">
          Cantidad de fases
          <div class="number-with-controls">

            <div class="number-controls" style="gap:6px">

          </div>

      phaseField.value = String(clampLeagueCount(phaseField.value, MAX_LEAGUE_PHASES))

    }
  }
  renderLeagueDynamicFields()
}

async function submitLeague(){
  const leagueName = document.getElementById('leagueName')?.value.trim() || ''
  const leagueStart = document.getElementById('leagueStartDate')?.value || ''
  const leagueEnd = document.getElementById('leagueEndDate')?.value || ''
  const groupCount = clampLeagueCount(document.getElementById('leagueGroupCount')?.value || '1', MAX_LEAGUE_GROUPS)
  const phaseCount = clampLeagueCount(document.getElementById('leaguePhaseCount')?.value || '1', MAX_LEAGUE_PHASES)

  if(!leagueName){ alert('Introduce el nombre de la liga'); return }
  if(!leagueStart || !leagueEnd){ alert('Selecciona la fecha de inicio y la de fin de la liga'); return }
  if(groupCount > MAX_LEAGUE_GROUPS){ alert(`El número máximo de grupos es ${MAX_LEAGUE_GROUPS}`); return }
  if(phaseCount > MAX_LEAGUE_PHASES){ alert(`El número máximo de fases es ${MAX_LEAGUE_PHASES}`); return }

  const groupNames = []
  for(let i=0;i<groupCount;i++){
    const raw = document.getElementById(`leagueGroupName_${i}`)?.value.trim() || ''
    const value = raw || String(i + 1)
    groupNames.push(value)
  }

  if(new Set(groupNames).size !== groupNames.length){
    alert('Los nombres de los grupos deben ser únicos');
    return
  }

  const phases = []
  for(let i=0;i<phaseCount;i++){
    const start = document.getElementById(`leaguePhaseStart_${i}`)?.value || ''
    const end = document.getElementById(`leaguePhaseEnd_${i}`)?.value || ''
    if(!start || !end){ alert(`Falta la fecha de inicio o fin de la fase ${i + 1}`); return }
    phases.push({ start_date: normalizeDateInput(start), end_date: normalizeDateInput(end) })
  }

  const errorMessage = validateLeaguePhaseSequence(normalizeDateInput(leagueStart), normalizeDateInput(leagueEnd), phases)
  if(errorMessage){
    alert(errorMessage)
    return
  }

  try{
    const res = await fetch('/api/league-admin?action=createLeague', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        name: leagueName,
        start_date: normalizeDateInput(leagueStart),
        end_date: normalizeDateInput(leagueEnd),
        group_count: groupCount,
        phase_count: phaseCount,
        group_names: groupNames,
        phases
      })
    })

    const json = await res.json().catch(() => ({}))
    if(!res.ok || !json.ok){
      throw new Error(json && json.error ? json.error : 'Error al guardar la liga')
    }

    alert('Liga guardada')
    closeAdmin()
  }catch(e){
    console.error(e)
    alert(e && e.message ? e.message : 'Error al guardar la liga')
  }
}

function formatSubstitutionGroupsForTextarea(groups){
  let normalized = groups
  if(typeof normalized === 'string'){
    try {
      normalized = JSON.parse(normalized)
    } catch (e) {
      return ''
    }
  }
  if(!Array.isArray(normalized)) return ''
  return normalized
    .map((group) => {
      if(!Array.isArray(group)) return ''
      return group.map((player) => String(player || '').trim()).filter(Boolean).join(', ')
    })
    .filter(Boolean)
    .join('\n')
}

    </div>
  `

  ;(async ()=>{

      const res = await fetch('/api/read?action=getLeagues')

      if(!sel) return

        sel.innerHTML = '<option value="">(sin ligas)</option>'
        return
      }
      for(const league of json){
        const opt = document.createElement('option')
        opt.value = String(league.id)
        opt.innerText = league.name
        sel.appendChild(opt)
      }
      if(!sel.value && sel.options.length){ sel.value = sel.options[0].value }
      sel.addEventListener('change', async ()=>{ await loadSubstitutionGroupsForSelectedLeague() })
      await loadSubstitutionGroupsForSelectedLeague()
    }catch(e){ console.error('Could not load substitution leagues', e) }
  })()
}

async function loadSubstitutionGroupsForSelectedLeague(){
  const sel = document.getElementById('substitutionLeagueSelect')
  const input = document.getElementById('substitutionGroupsInput')
  if(!sel || !input) return
  const leagueId = sel.value
  if(!leagueId){ input.value = ''; return }

  try{
    const res = await fetch('/api/read?action=getLeagues')
    const json = await res.json()
    const league = Array.isArray(json) ? json.find(l => String(l.id) === String(leagueId)) : null
    const rawGroups = league && league.substitution_groups ? league.substitution_groups : []
    input.value = formatSubstitutionGroupsForTextarea(rawGroups)
  }catch(e){ console.error('Could not load league substitution groups', e) }
}

async function submitLeagueSubstitutions(){
  const sel = document.getElementById('substitutionLeagueSelect')
  const input = document.getElementById('substitutionGroupsInput')
  const leagueId = sel ? sel.value : ''
  const rawText = input ? input.value : ''

  if(!leagueId){ alert('Selecciona una liga'); return }

  let groups = []
  try{
    groups = parseSubstitutionGroupsInput(rawText)
  }catch(error){
    alert(error && error.message ? error.message : 'Hay un error en la configuración de sustituciones')

  try{
    const res = await fetch('/api/league-admin?action=updateLeagueSubstitutions', {
      method: 'POST',

  }catch(e){ console.error(e); alert(e && e.message ? e.message : 'Error al guardar sustituciones') }
}

async function registerPlayer(){
  const el = document.getElementById('playerNameInput')
  if(!el) return
  const name = el.value.trim()
  if(!name){ alert('Introduce un nombre completo'); return }
  try{
    const res = await fetch('/api/write?action=submitName',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name})})
    const j = await res.json()
    if(j && j.ok){
      if(j.added){ alert('Jugador guardado'); el.value = '' }
      else alert('Nombre ya registrado')
      await loadAdminNames()
    } else {
      alert('Error al guardar')
    }
  }catch(e){ console.error(e); alert('Error al guardar') }

function closeAdmin(){ const o=document.getElementById('adminOverlay'); if(o) o.style.display='none' }

async function loadAdminNames(){
  const isLocal = location.hostname==='localhost' || location.hostname==='127.0.0.1'
  try{
    const res = await fetch('/api/read?action=getNames')
    const db = await res.json()
    const names = (db && db.names) ? (db.names.slice().sort((a,b)=>a.toLowerCase().localeCompare(b.toLowerCase()))) : []
    const container = document.getElementById('adminList')
    if(!container) return
    container.innerHTML = ''
    for(const n of names){
      const row = document.createElement('div')
      row.style.display = 'flex'
      row.style.alignItems = 'center'
      row.style.justifyContent = 'space-between'
      row.style.padding = '8px'
      row.style.borderRadius = '8px'
      row.style.background = 'linear-gradient(180deg,#fff,#fbfdff)'
      const span = document.createElement('div')
      span.style.color = 'var(--muted)'
      span.innerText = n
      const btn = document.createElement('button')
      btn.className = 'btn ghost'
      btn.style.minWidth = '90px'
      btn.innerText = 'Eliminar'
      btn.onclick = (async ()=>{
        if(!confirm(`Eliminar "${n}"?`)) return
        try{
          const endpoint = '/api/write?action=deleteName'
          const r = await fetch(endpoint,{
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({name:n, adminKey: window._adminKey})
          })
          const j = await r.json()
          if(j && j.ok){
            await loadAdminNames()
          } else {
            alert('No se pudo eliminar')
          }
        }catch(e){ console.error(e); alert('Error al eliminar') }
      })
      row.appendChild(span)
      row.appendChild(btn)
      container.appendChild(row)
    }
  }catch(e){ console.error('Could not load names for admin',e) }
}
