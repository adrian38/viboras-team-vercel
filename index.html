<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Viboras Team</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/theme.css">
<link rel="icon" href="/image.png" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest" crossorigin="use-credentials">
<script src="/splash.js"></script>
<script src="/pwa.js" defer></script>
<script src="/auth-client.js" defer></script>
<meta name="apple-mobile-web-app-title" content="Viboras">
<meta name="theme-color" content="#121316">
<style>
/* El panel de administracion lo monta openAdmin() con HTML en linea, y casi
   todo su color sale de var(--card) y var(--muted). Redefinirlas aqui lo
   pasa a oscuro entero sin tocar el script. */
:root{
  --card:var(--vt-surface-2);
  --muted:var(--vt-muted);
  --topbar-height:56px;
}

/* number controls for mobile */
.number-with-controls{display:flex;align-items:center}
.number-controls{display:none;flex-direction:column;margin-left:8px}
.number-controls button{background:var(--vt-surface-3);border:1px solid var(--vt-border-strong);color:var(--vt-text);padding:6px;border-radius:var(--vt-r-sm);width:34px;height:28px;font-weight:700;cursor:pointer}
@media(max-width:720px){
  .number-controls{display:flex}
}

.site{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:var(--vt-md)}

/* Portada: logo y nombre del club, con el boton de normativa encima. */
.hero{max-width:1100px;margin:0 auto var(--vt-lg);text-align:center}
.hero h1{font-size:48px;line-height:52px;letter-spacing:0.01em}
@media(max-width:720px){.hero h1{font-size:34px;line-height:38px}}

/* Tarjeta de modulo. El resplandor dorado de la esquina es el del mockup. */
.block{
  position:relative;
  display:flex;
  flex-direction:column;
  background:var(--vt-surface-2);
  border:1px solid var(--vt-border);
  border-radius:var(--vt-r-xl);
  padding:var(--vt-lg);
  overflow:hidden;
  transition:border-color .2s ease,box-shadow .2s ease;
}
/* La fila de botones se pega abajo, para que las cuatro tarjetas alineen. */
.block .block-row{flex:1}
.block .block-row > div{display:flex;flex-direction:column;height:100%}
.block .controls{margin-top:auto}
.block::after{
  content:'';
  position:absolute;top:-70px;right:-70px;
  width:170px;height:170px;border-radius:var(--vt-r-full);
  background:rgba(245,158,11,0.09);
  filter:blur(44px);
  pointer-events:none;
  transition:background .25s ease;
}
.block:hover{border-color:var(--vt-border-gold);box-shadow:0 12px 36px rgba(0,0,0,0.5)}
.block:hover::after{background:rgba(245,158,11,0.18)}

/* Cabecera del modulo: distintivo con el icono, y a la derecha el icono
   grande de marca de agua que llevan las tarjetas del mockup. */
.block-head{
  position:relative;z-index:var(--vt-z-contenido);
  display:flex;align-items:center;justify-content:space-between;
  gap:var(--vt-sm);
  margin-bottom:var(--vt-sm);
}
.block-head > div{display:flex;align-items:center;gap:var(--vt-sm)}
.block-icon{
  display:flex;align-items:center;justify-content:center;
  width:40px;height:40px;flex:0 0 auto;
  border-radius:var(--vt-r);
  background:rgba(245,158,11,0.14);
  color:var(--vt-gold);
}
.block-marca{color:var(--vt-outline-variant,#534434);transition:color .2s ease}
.block:hover .block-marca{color:var(--vt-gold-dark)}

.block-title{
  position:relative;z-index:var(--vt-z-contenido);
  margin:0;
  font-family:var(--vt-font-head);
  font-size:30px;font-weight:800;letter-spacing:0.03em;text-transform:uppercase;
  color:var(--vt-text-strong);
  line-height:1;
}
.block-row{position:relative;z-index:var(--vt-z-contenido);display:flex;gap:var(--vt-md);align-items:center}

label.small{
  display:block;
  margin:0 0 var(--vt-md);
  font-size:15px;font-weight:400;line-height:1.5;
  color:var(--vt-text);
  max-width:56ch;
}

/* Los botones de la portada van todos iguales, como en el mockup: superficie
   elevada que pasa a oro al pasar por encima. Las clases de color que habia
   (.warn, .purple, .ranking...) se conservan porque estan en el marcado, pero
   ya no pintan nada distinto. */
/* Rejilla en vez de flex: con cuatro botones, flex dejaba tres arriba y uno
   suelto a lo ancho. Asi caen 2x2, como en el mockup. */
.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:var(--vt-sm)}
.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:var(--vt-sm);
  min-width:0;
  padding:12px 16px;
  background:var(--vt-surface-4);
  border:1px solid var(--vt-border-strong);
  border-radius:var(--vt-r);
  color:var(--vt-text);
  font-family:var(--vt-font-body);
  font-size:13px;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;
  cursor:pointer;
  transition:background .18s ease,color .18s ease,border-color .18s ease;
}
.btn:hover{background:var(--vt-gold);border-color:var(--vt-gold);color:#121316}

/* La normativa del grupo es la unica en rojo, como estaba: es el aviso. */
.btn.black-top{
  flex:0 0 auto;min-width:0;
  background:var(--vt-error-bg);
  border:1px solid rgba(255,180,171,0.35);
  border-radius:var(--vt-r-full);
  color:var(--vt-error);
  padding:9px 20px;
  /* Sin z-index: lo heredaba de cuando .topbar era fija. Como .topbar es
     flex, el boton es un elemento flexible y ahi el z-index si cuenta, de
     modo que ese 1101 le hacia tapar el panel de administracion. */
}
.btn.black-top:hover{background:rgba(147,0,10,0.34);border-color:var(--vt-error);color:var(--vt-error)}

/* Barra superior en el flujo del documento (no fija). Así el botón se desplaza al hacer scroll y desaparece. */
/* space-between desde que hay cuentas: normativa a la izquierda, el chip de
   sesion a la derecha. */
.topbar{position:static;display:flex;align-items:center;justify-content:space-between;gap:var(--vt-sm);height:var(--topbar-height);padding:0 var(--vt-sm);pointer-events:auto}
.topbar .vt-chip{flex:0 0 auto;white-space:nowrap;text-decoration:none}
/* A 375 px los dos textos caben con 16 px de sobra; a 320 el chip desbordaba
   29 px. Por debajo de 370 se queda en el icono, que sigue llevando a /cuenta
   y conserva su aria-label. */
@media (max-width:370px){ .topbar .vt-chip__nombre{display:none} }
/* Con la campanita no caben los tres a 375 px: por debajo de 420 el boton
   dice solo NORMATIVA y el chip se queda en el icono. */
@media (max-width:420px){ .topbar-largo,.topbar .vt-chip__nombre{display:none} }
.topbar .btn.black-top{pointer-events:auto}
.topbar-spacer{display:none}

.admin-bottom,.admin-desktop{
  display:inline-flex;align-items:center;justify-content:center;gap:var(--vt-sm);
  background:transparent;
  border:1px solid var(--vt-border-strong);
  border-radius:var(--vt-r);
  color:var(--vt-muted);
  padding:10px 20px;
  font-family:var(--vt-font-body);
  font-size:13px;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;
  cursor:pointer;
}
.admin-bottom:hover,.admin-desktop:hover{border-color:var(--vt-gold);color:var(--vt-gold-light)}
/* Hay dos botones de administracion en el marcado, uno por ancho, y solo
   puede verse uno. Van en flex, no en block, para que el icono se separe del
   texto, y con width:max-content para que el margin:auto los centre.
   Nada de "body > .admin-desktop": ese selector tiene mas especificidad que
   el display:none del media query, que no la gana por estar dentro de una
   media query, y dejaba los dos botones a la vista en movil. */
.admin-desktop{display:flex;width:max-content;margin:var(--vt-lg) auto;min-width:200px}
.admin-mobile{display:none}
@media(max-width:720px){
  .admin-desktop{display:none}
  .admin-mobile{display:flex;width:max-content;margin:var(--vt-lg) auto}
}

.register-input{
  flex:1;min-width:180px;
  padding:10px 12px;
  background:var(--vt-surface-deep);
  border:1px solid var(--vt-border-strong);
  border-radius:var(--vt-r);
  color:var(--vt-text);
  font-family:var(--vt-font-body);
  font-size:15px;
}
.register-input:focus{outline:none;border-color:var(--vt-gold)}
.register-input::placeholder{color:var(--vt-faint)}

#days{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:var(--vt-sm);margin-top:var(--vt-sm)}
.day{
  background:var(--vt-surface-3);
  border:1px solid var(--vt-border);
  border-radius:var(--vt-r);
  color:var(--vt-text);
  padding:14px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  font-weight:600;min-height:58px;
  transition:background .12s ease,border-color .12s ease;
}
.day.red{background:var(--vt-error-bg);border-color:rgba(255,180,171,0.25);color:var(--vt-error)}
.day:hover{background:var(--vt-surface-4);border-color:var(--vt-gold-dark)}

/* El panel de administracion trae sus propios colores claros en linea. */
/* openAdmin() crea el overlay con position:fixed pero sin z-index, asi que
   se quedaba por debajo de las tarjetas, que llevan z-index:1 para taparse
   su propio resplandor. La pagina se veia a traves del panel. */
#adminOverlay{background:rgba(0,0,0,0.72) !important;z-index:var(--vt-z-velo) !important}
#adminOverlay > div{position:relative;z-index:var(--vt-z-modal)}
#adminOverlay input,#adminOverlay select,#adminOverlay textarea{
  background:var(--vt-surface-deep);
  border:1px solid var(--vt-border-strong);
  border-radius:var(--vt-r);
  color:var(--vt-text);
  font-family:var(--vt-font-body);
  padding:8px 10px;
}
#adminOverlay input:focus,#adminOverlay select:focus{outline:none;border-color:var(--vt-gold)}
#adminOverlay option{background:var(--vt-surface-2)}
#adminOverlay .btn{min-width:0}

@media(min-width:900px){
  .site{gap:20px}
  .block-row{align-items:center}

  /* Desktop-only 2-column layout for main blocks */
  .site{ display:grid; grid-template-columns: 1fr 1fr; grid-template-areas: "upload consult" "performance performance" "organization organization"; gap:18px }
  .block--upload{ grid-area: upload }
  .block--consult{ grid-area: consult }
  .block--performance{ grid-area: performance }
  .block--organization{ grid-area: organization }
}
@media(max-width:720px){.block{padding:var(--vt-md)}.block-title{font-size:25px}.btn{min-width:120px;padding:12px 14px}#days{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}.register-input{min-width:0;width:100%}#adminOverlay > div{flex-direction:column}#adminOverlay > div > #adminMenuColumn{flex-basis:auto;width:100%}#adminOverlay > div > #adminMain{width:100%;max-width:100%}.pozo-form-grid{grid-template-columns:1fr !important}}
</style>
</head>

<body>

<div class="hero">
  <div class="topbar">
    <button class="btn black-top" onclick="window.location='group-normativa.html'"><span class="ms ms--sm notranslate" translate="no" aria-hidden="true">gavel</span>NORMATIVA<span class="topbar-largo">&nbsp;DEL GRUPO</span></button>
    <div class="vt-row" style="gap:var(--vt-sm);flex:0 0 auto;flex-wrap:nowrap">
    <div class="vt-campana" id="vtCampana" hidden>

          <button class="btn warn" onclick="window.location='tournaments.html'"><span class="ms ms--sm notranslate" translate="no" aria-hidden="true">emoji_symbols</span>Torneos</button>

<!-- Desktop admin button (visible on larger screens) -->
<button class="btn admin-desktop" onclick="openAdmin()" aria-label="Administración"><span class="ms ms--sm notranslate" translate="no" aria-hidden="true">shield_person</span>Administración</button>

<!-- Mobile-only admin button (bottom center, shown only on small screens) -->
<button class="admin-bottom admin-mobile" onclick="openAdmin()" aria-label="Administración móvil"><span class="ms ms--sm notranslate" translate="no" aria-hidden="true">shield_person</span>Administración</button>

<script>
// Administration overlay for managing registered names
async function openAdmin(){
  // Lo decide la sesion; el servidor lo vuelve a comprobar en deleteName.
  const me = await window.vtMe
  if(!me || me.role !== 'admin'){
    alert('Solo para administradores')
    return
  }

  let overlay = document.getElementById('adminOverlay')
  if(!overlay){
    overlay = document.createElement('div')
    overlay.id = 'adminOverlay'
    overlay.style.display = 'none'
    overlay.style.position = 'fixed'
    overlay.style.inset = '0'
    overlay.style.background = 'rgba(0,0,0,0.4)'
    overlay.style.alignItems = 'center'
    overlay.style.justifyContent = 'center'
    overlay.style.padding = '24px'
    overlay.innerHTML = `
      <div style="background:var(--card);max-width:640px;width:100%;border-radius:12px;padding:12px;box-shadow:0 12px 30px rgba(2,6,23,0.3);color:var(--muted);display:flex;gap:12px;justify-content:center;align-items:flex-start">
        <div id="adminMenuColumn" style="flex:0 0 260px;display:flex;flex-direction:column;gap:8px;align-items:stretch">
          <div style="font-weight:700;text-align:center;padding:8px 0">Administración</div>
          <button class="btn" style="width:100%;text-align:left" onclick="showPlayerPanel()">Nuevo jugador</button>
          <button class="btn" style="width:100%;text-align:left" onclick="showCompasPanel()">Nuevo torneo Compás</button>
          <button class="btn" style="width:100%;text-align:left" onclick="showPozoPanel()">Nuevo torneo Pozo</button>
          <button class="btn red" style="width:100%;text-align:left" onclick="closeAdmin()">Cerrar</button>
        </div>
        <div id="adminMain" style="flex:1;display:none;flex-direction:column;gap:8px;max-width:520px">
          <div style="display:flex;align-items:center;justify-content:space-between">
            <div id="adminHeaderTitle" style="font-weight:700">Jugadores</div>
            <button id="adminHeaderButton" class="btn ghost" onclick="showAdminMenu()">Atrás</button>
          </div>
          <div id="adminContent" style="display:flex;flex-direction:column;gap:8px;max-height:420px;overflow:auto;padding-right:6px">
            <!-- Dynamic content: registration form + list -->
            <div id="playerForm" style="display:flex;gap:8px;align-items:center">
              <input id="playerNameInput" class="register-input" placeholder="Nombre completo" />
              <button class="btn secondary-green" onclick="registerPlayer()">Registrar jugador</button>
            </div>
            <div id="adminList" style="display:flex;flex-direction:column;gap:8px;overflow:auto"></div>
          </div>
        </div>
      </div>
    `
    document.body.appendChild(overlay)
  }
  overlay.style.display = 'flex'
  showAdminMenu()
}

// switch panel in admin overlay
function showAdminMenu(){
  const menu = document.getElementById('adminMenuColumn')
  const content = document.getElementById('adminContent')
  const adminMain = document.getElementById('adminMain')
  const header = document.getElementById('adminHeaderTitle')
  if(menu) menu.style.display = 'flex'
  if(content) content.style.display = 'none'
  if(adminMain) adminMain.style.display = 'none'
  if(header) header.innerText = 'Jugadores'
}

function normalizeDateInput(val){
  if(/^\d{4}-\d{2}-\d{2}$/.test(String(val||''))){
    const [y,m,d] = String(val).split('-')
    return `${d}/${m}/${y}`
  }
  return String(val || '')
}

function addDaysToDateText(dateText, daysToAdd){
  const [d, m, y] = String(dateText || '').split('/')
  if(!d || !m || !y) return null
  const date = new Date(Date.UTC(Number(y), Number(m) - 1, Number(d)))
  date.setUTCDate(date.getUTCDate() + daysToAdd)
  const dd = String(date.getUTCDate()).padStart(2, '0')
  const mm = String(date.getUTCMonth() + 1).padStart(2, '0')
  const yyyy = String(date.getUTCFullYear())
  return `${dd}/${mm}/${yyyy}`
}

function showPlayerPanel(){
  const menu = document.getElementById('adminMenuColumn')
  const content = document.getElementById('adminContent')
  const adminMain = document.getElementById('adminMain')
  const header = document.getElementById('adminHeaderTitle')
  if(menu) menu.style.display = 'none'
  if(adminMain) adminMain.style.display = 'flex'
  if(content) content.style.display = 'flex'
  if(header) header.innerText = 'Jugadores'
  content.innerHTML = `
    <div id="playerForm" style="display:flex;gap:8px;align-items:center">
      <input id="playerNameInput" class="register-input" placeholder="Nombre completo" />
      <button class="btn secondary-green" onclick="registerPlayer()">Registrar jugador</button>
    </div>
    <div id="adminList" style="display:flex;flex-direction:column;gap:8px;overflow:auto"></div>
  `
  loadAdminNames()
}

function showPozoPanel(){
  const menu = document.getElementById('adminMenuColumn')
  const content = document.getElementById('adminContent')
  const adminMain = document.getElementById('adminMain')
  const header = document.getElementById('adminHeaderTitle')
  if(menu) menu.style.display = 'none'
  if(adminMain) adminMain.style.display = 'flex'
  if(content) content.style.display = 'flex'
  if(header) header.innerText = 'Nuevo torneo Pozo'
  content.innerHTML = `
    <div style="display:flex;flex-direction:column;gap:12px;min-width:0">
      <label style="display:flex;flex-direction:column;gap:6px;font-weight:600;color:var(--muted)">
        Nombre del torneo
        <input id="pozoName" class="register-input" placeholder="Ej: Pozo DD/MM/AAAA" />
      </label>
      <div class="pozo-form-grid" style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <label style="display:flex;flex-direction:column;gap:6px;font-weight:600;color:var(--muted)">
          Fecha inicio
          <input id="pozoStartDate" type="date" class="register-input" />
        </label>
        <label style="display:flex;flex-direction:column;gap:6px;font-weight:600;color:var(--muted)">
          Fecha fin
          <input id="pozoEndDate" type="date" class="register-input" />
        </label>
      </div>
      <label style="display:flex;flex-direction:column;gap:6px;font-weight:600;color:var(--muted)">
        CSV del torneo
        <input id="pozoCsvFile" type="file" accept=".csv,text/csv" />
      </label>
      <div style="color:var(--muted);font-size:0.9rem;line-height:1.4">
        Formato del fichero CSV (sin cabecera): jugador1;jugador2;jugador3;jugador4;juegos_pareja1;juegos_pareja2
      </div>
      <div style="color:var(--muted);font-size:0.9rem;line-height:1.4">
        En caso de empate a juegos, añadir el símbolo '+' a los juegos de la pareja ganadora, por ejemplo J1;J2;J3;J4;4;4+
      </div>
      <button class="btn secondary-green" onclick="submitPozoTournament()">Guardar torneo</button>
    </div>
  `
}

function showCompasPanel(){
  const menu = document.getElementById('adminMenuColumn')
  const content = document.getElementById('adminContent')
  const adminMain = document.getElementById('adminMain')
  const header = document.getElementById('adminHeaderTitle')
  if(menu) menu.style.display = 'none'
  if(adminMain) adminMain.style.display = 'flex'
  if(content) content.style.display = 'flex'
  if(header) header.innerText = 'Nuevo torneo Compás'
  content.innerHTML = `
    <div style="display:flex;flex-direction:column;gap:12px;min-width:0">
      <label style="display:flex;flex-direction:column;gap:6px;font-weight:600;color:var(--muted)">
        Nombre del torneo
        <input id="compasName" class="register-input" placeholder="Ej: Compás DD/MM/AAAA" />
      </label>
      <div class="pozo-form-grid" style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <label style="display:flex;flex-direction:column;gap:6px;font-weight:600;color:var(--muted)">
          Fecha inicio
          <input id="compasStartDate" type="date" class="register-input" />
        </label>
        <label style="display:flex;flex-direction:column;gap:6px;font-weight:600;color:var(--muted)">
          Fecha fin
          <input id="compasEndDate" type="date" class="register-input" />
        </label>
      </div>
      <label style="display:flex;flex-direction:column;gap:6px;font-weight:600;color:var(--muted)">
        CSV del torneo
        <input id="compasCsvFile" type="file" accept=".csv,text/csv" />
      </label>
      <div style="color:var(--muted);font-size:0.9rem;line-height:1.4">
        Formato del fichero CSV (sin cabecera): ronda;bracket;jugador1;jugador2;jugador3;jugador4;juegos_pareja1;juegos_pareja2
      </div>
      <div style="color:var(--muted);font-size:0.9rem;line-height:1.4">
        Valores válidos para <strong>bracket</strong>: E, W, N, S, NE, SE, NW, SW (mayúsculas o minúsculas aceptadas).
      </div>
      <button class="btn secondary-green" onclick="submitCompasTournament()">Guardar torneo</button>
    </div>
  `
}

async function submitCompasTournament(){
  const name = document.getElementById('compasName')?.value.trim() || ''
  const startInput = document.getElementById('compasStartDate')?.value || ''
  const endInput = document.getElementById('compasEndDate')?.value || ''
  const fileEl = document.getElementById('compasCsvFile')
  const file = fileEl && fileEl.files ? fileEl.files[0] : null

  if(!name){ alert('Introduce el nombre del torneo'); return }
  if(!startInput || !endInput){ alert('Selecciona la fecha de inicio y la de fin'); return }
  if(!file){ alert('Sube un fichero CSV'); return }

  try{
    const csvText = await file.text()
    const payload = {
      name,
      start_date: normalizeDateInput(startInput),
      end_date: normalizeDateInput(endInput),
      csv: csvText
    }

    const res = await fetch('/api/league-admin?action=createCompasTournament', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    })

    const json = await res.json().catch(() => ({}))
    if(!res.ok || !json.ok){ throw new Error(json && json.error ? json.error : 'Error al guardar el torneo') }

    alert('Torneo Compás guardado')
    closeAdmin()
  }catch(e){ console.error(e); alert(e && e.message ? e.message : 'Error al guardar el torneo') }
}

async function submitPozoTournament(){
  const name = document.getElementById('pozoName')?.value.trim() || ''
  const startInput = document.getElementById('pozoStartDate')?.value || ''
  const endInput = document.getElementById('pozoEndDate')?.value || ''

async function registerPlayer(){
  const el = document.getElementById('playerNameInput')
  if(!el) return
  const name = el.value.trim()
  if(!name){ alert('Introduce un nombre completo'); return }
  try{
    const res = await fetch('/api/write?action=submitName',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name})})
    const j = await res.json()
    if(j && j.ok){
      if(j.added){ alert('Jugador guardado'); el.value = '' }
      else alert('Nombre ya registrado')
      await loadAdminNames()
    } else {
      alert('Error al guardar')
    }
  }catch(e){ console.error(e); alert('Error al guardar') }
}
function closeAdmin(){ const o=document.getElementById('adminOverlay'); if(o) o.style.display='none' }

async function loadAdminNames(){
  const isLocal = location.hostname==='localhost' || location.hostname==='127.0.0.1'
  try{
    const res = await fetch('/api/read?action=getNames')
    const db = await res.json()
    const names = (db && db.names) ? (db.names.slice().sort((a,b)=>a.toLowerCase().localeCompare(b.toLowerCase()))) : []
    const container = document.getElementById('adminList')
    if(!container) return
    container.innerHTML = ''
    for(const n of names){
      const row = document.createElement('div')
      row.style.display = 'flex'
      row.style.alignItems = 'center'
      row.style.justifyContent = 'space-between'
      row.style.padding = '8px'
      row.style.borderRadius = '8px'
      row.style.background = 'var(--vt-surface-deep)'
      row.style.border = '1px solid var(--vt-border)'
      const span = document.createElement('div')
      span.style.color = 'var(--vt-text)'
      span.innerText = n
      const btn = document.createElement('button')
      btn.className = 'btn ghost'
      btn.style.minWidth = '90px'
      btn.innerText = 'Eliminar'
      btn.onclick = (async ()=>{
        if(!confirm(`Eliminar "${n}"?`)) return
        try{
          const endpoint = '/api/write?action=deleteName'
          const r = await fetch(endpoint,{
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({name:n})
          })
          const j = await r.json()
          if(j && j.ok){
            await loadAdminNames()
          } else {
            alert('No se pudo eliminar')
          }
        }catch(e){ console.error(e); alert('Error al eliminar') }
      })
      row.appendChild(span)
      row.appendChild(btn)
      container.appendChild(row)
    }
  }catch(e){ console.error('Could not load names for admin',e) }
}
