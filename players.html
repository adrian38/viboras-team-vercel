<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jugadores</title>
  <link rel="icon" href="/image.png" type="image/png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <script src="/pwa.js" defer></script>
  <meta name="apple-mobile-web-app-title" content="Viboras">
  <meta name="theme-color" content="#121316">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/theme.css">
  <style>
    /* La grafica la monta renderChart() como una cadena de SVG con los
       colores escritos a mano (fill="#667085", stroke="#16a34a"...). Son
       atributos de presentacion, asi que el CSS los gana sin !important y
       sin tocar la funcion, que esta perdonada en tools/code-size.mjs con
       106 lineas y solo puede encoger. */

    .card {
      background: var(--vt-surface);
      border: 1px solid var(--vt-border);
      border-radius: var(--vt-r-xl);
      box-shadow: var(--vt-shadow-card);
      padding: var(--vt-lg);
    }

    .toolbar {
      display: flex;
      align-items: end;
      gap: var(--vt-md);
      flex-wrap: wrap;
      margin-bottom: var(--vt-md);
    }

    label {
      display: flex;
      flex-direction: column;
      gap: var(--vt-xs);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--vt-muted);
    }

    select, .btn, .nav-btn { font: inherit; }

    select {
      min-width: 220px;
      padding: 10px 34px 10px 12px;
      border-radius: var(--vt-r);
      border: 1px solid var(--vt-border-strong);
      background: var(--vt-surface-deep);
      color: var(--vt-text);
      font-size: 15px;
      font-weight: 600;
      appearance: none;
      cursor: pointer;
      background-image: linear-gradient(45deg, transparent 50%, var(--vt-muted) 50%), linear-gradient(135deg, var(--vt-muted) 50%, transparent 50%);
      background-position: calc(100% - 18px) 50%, calc(100% - 13px) 50%;
      background-size: 5px 5px, 5px 5px;
      background-repeat: no-repeat;
    }
    select:focus { outline: none; border-color: var(--vt-gold); }
    select option { background: var(--vt-surface-2); }

    .btn {
      padding: 10px 18px;
      border-radius: var(--vt-r);
      border: none;
      cursor: pointer;
      font-weight: 700;
      color: #121316;
      background: var(--vt-gold);
    }
    .btn:hover { background: var(--vt-yellow); }

    .back-btn {
      padding: 9px 16px;
      background: transparent;
      color: var(--vt-text);
      border: 1px solid var(--vt-border-strong);
      border-radius: var(--vt-r);
      cursor: pointer;
      font-weight: 700;
    }
    .back-btn:hover { border-color: var(--vt-gold); color: var(--vt-gold-light); }

    .chart-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin: 10px 0 8px;
    }

    .nav-btn {
      width: 40px;
      height: 40px;
      border-radius: var(--vt-r);
      border: 1px solid var(--vt-border-strong);
      background: var(--vt-surface-3);
      color: var(--vt-text);
      cursor: pointer;
      font-size: 1.2rem;
      font-weight: 700;
      transition: all 0.15s ease;
    }

    .nav-btn:hover:not(:disabled) {
      background: var(--vt-surface-4);
      border-color: var(--vt-gold);
      color: var(--vt-gold-light);
    }

    .nav-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .range-label {
      flex: 1;
      text-align: center;
      font-family: var(--vt-font-head);
      font-size: 19px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--vt-text);
      border: 1px solid var(--vt-border-strong);
      background: var(--vt-surface-3);
      border-radius: var(--vt-r);
      padding: 9px 12px;
      cursor: pointer;
      user-select: none;
    }
    .range-label:hover { border-color: var(--vt-gold); color: var(--vt-gold-light); }

    .chart-shell {
      background: var(--vt-surface-deep);
      border: 1px solid var(--vt-border);
      border-radius: var(--vt-r-lg);
      padding: var(--vt-md);
      overflow: auto;
      min-height: 300px;
    }

    svg {
      display: block;
      width: 100%;
      min-width: 700px;
      height: 310px;
      border-radius: var(--vt-r);
    }

    /* Colores de la grafica, sobre los atributos que escribe renderChart(). */
    .chart-shell svg text { fill: var(--vt-outline, #a08e7a); }
    .chart-shell svg line { stroke: var(--vt-border-strong); }
    .chart-shell svg polyline { stroke: var(--vt-gold); }
    .chart-shell svg circle { fill: var(--vt-gold); stroke: var(--vt-bg); }
    /* El circulo grande de cada punto es solo zona de click: sigue invisible. */
    .chart-shell svg circle[fill="transparent"] { fill: transparent; stroke: none; }

    .muted { color: var(--vt-muted); }

    .summary {
      margin-top: var(--vt-md);
      background: var(--vt-surface-3);
      border: 1px solid var(--vt-border);
      border-radius: var(--vt-r);
      padding: var(--vt-md);
      font-weight: 600;
      color: var(--vt-text);
    }

    .summary-delta {
      display: inline-block;
      margin-left: 8px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .page-footer {
      display: flex;
      justify-content: flex-end;
      margin-top: 14px;
      padding-top: 4px;
    }

    .match-list {
      margin-top: 14px;
      display: grid;
      gap: 10px;
    }

    .match-item {
      padding: 10px 12px;
      border: 1px solid var(--vt-border);
      border-left: 3px solid var(--vt-border-strong);
      border-radius: var(--vt-r);
      background: var(--vt-surface-2);
      line-height: 1.5;
      color: var(--vt-text);
    }

    .match-item strong {
      color: var(--vt-text-strong);
    }

    .event-tag {
      display: inline-block;
      border-radius: 999px;
      padding: 3px 8px;
      font-size: 0.72rem;
      font-weight: 700;
      border: 1px solid transparent;
      letter-spacing: 0.02em;
      margin-right: 8px;
      vertical-align: middle;
    }

    /* Partido suelto, liga o torneo: tres tonos que siguen distinguiendose
       sobre carbono. */
    .event-tag.match { background: rgba(216, 180, 254, 0.10); color: #d8b4fe; border-color: rgba(216, 180, 254, 0.30); }
    .event-tag.league { background: rgba(125, 211, 252, 0.10); color: #7dd3fc; border-color: rgba(125, 211, 252, 0.30); }
    .event-tag.tournament { background: rgba(245, 158, 11, 0.12); color: var(--vt-gold-light); border-color: var(--vt-border-gold); }

    .match-result {
      font-weight: 700;
    }

    .match-result.win { color: #4ade80; }
    .match-result.loss { color: #f87171; }

    .match-score-block {
      display: inline-block;
    }

    .match-score-separator {
      display: inline-block;
      margin: 0 6px;
    }

    @media (max-width: 720px) {
      .card { padding: var(--vt-md); }
      .page-header { align-items: flex-start; }
      .toolbar { align-items: stretch; }
      select { width: 100%; min-width: 0; }
      .chart-shell { padding: 8px; }
      svg { min-width: 620px; }

      .summary,
      .summary-delta,
      .match-item,
      .match-item strong,
      .event-tag,
      .match-result {
        font-size: 0.7rem;
      }

      .summary,
      .match-item {
        line-height: 1.45;
      }

      .match-item {
        display: block;
      }

      .match-score-separator {
        display: none;
      }

      .match-score-block {
        display: block;
        margin: 6px 0 0 0;
        text-align: center;
      }
    }
  </style>
</head>
<body>
  <div class="vt-page">

    <div style="text-align:center">
      <img src="/image.png" alt="Víboras Team" width="88" height="88" style="border-radius:var(--vt-r-lg);filter:drop-shadow(0 4px 16px rgba(245,158,11,0.25))">
      <h1 class="vt-gold" style="margin-top:var(--vt-sm)">Jugadores</h1>
      <span class="vt-label">Evolución del rating · Víboras Pádel</span>
    </div>

    <div class="card">

      <div class="toolbar">
        <label>
          <select id="playerSelect"></select>
        </label>
      </div>

      <div class="chart-toolbar">
        <button id="prevWindowBtn" class="nav-btn" type="button" aria-label="Anterior">←</button>
        <button id="rangeLabel" class="range-label" type="button">Cargando…</button>
        <button id="nextWindowBtn" class="nav-btn" type="button" aria-label="Siguiente">→</button>
      </div>

      <div class="chart-shell">
        <svg id="ratingChart" viewBox="0 0 820 310" preserveAspectRatio="none" aria-label="Evolución del rating"></svg>
      </div>

      <div id="summary" class="summary muted">Selecciona un punto para ver el detalle del día.</div>
      <div id="matchList" class="match-list"></div>

      <div class="page-footer">
        <button class="back-btn" type="button" onclick="window.location='/'">Atrás</button>
      </div>
    </div>
  </div>

  <script>
    const MIN_DATE = '2026-09-01';
    const DAILY_SNAPSHOT_LIMIT = 3650;

    let allNames = [];
    let allMatches = [];
    let dailySeries = [];
    let selectedDay = null;
    let currentMonthDate = new Date();

    const Q = Math.LN10 / 400.0;
    const C_DAILY = 15.0; // Daily uncertainty decay constant
    const INITIAL_RATING = 1500.0;
    const INITIAL_RD = 350.0;
    const MIN_RD = 80.0;
    const MAX_RD = 350.0;

    class GlickoPlayer {
      constructor(rating = INITIAL_RATING, rd = INITIAL_RD) {
        this.rating = rating;
        this.rd = rd;
      }
    }

    function g(rd) {
      return 1.0 / Math.sqrt(1.0 + (3.0 * Q * Q * rd * rd) / (Math.PI * Math.PI));
    }

    function expected(r, oppR, oppRd) {
      const gRd = g(oppRd);
      return 1.0 / (1.0 + Math.pow(10, (-gRd * (r - oppR)) / 400.0));
    }

    function decayAllPlayersOneDay(playerMap, activePlayersToday = new Set()) {
      playerMap.forEach((player, key) => {
        if (activePlayersToday.has(key)) return;
        const newRd = Math.min(Math.sqrt(player.rd * player.rd + C_DAILY * C_DAILY), MAX_RD);
        playerMap.set(key, new GlickoPlayer(player.rating, newRd));
      });
    }

    function getPlayerOrCreate(playerMap, name) {
      const trimmed = (name || '').trim();
      if (!trimmed) return new GlickoPlayer();
      if (!playerMap.has(trimmed)) playerMap.set(trimmed, new GlickoPlayer());
      return playerMap.get(trimmed);
    }

    function getTeamState(p1Key, p2Key, playerMap) {
      const p1 = getPlayerOrCreate(playerMap, p1Key);
      const p2 = getPlayerOrCreate(playerMap, p2Key);
      const teamR = (p1.rating + p2.rating) / 2.0;
      const teamRd = Math.sqrt(p1.rd * p1.rd + p2.rd * p2.rd) / 2.0;
      return { rating: teamR, rd: teamRd };
    }

    function getEffectiveObservationR(playerR, teamR, opponentTeamR) {
      return opponentTeamR + (playerR - teamR);
    }

    function getEffectiveObservationRd(opponentTeamRd, teammateRd) {
      const safeOpp = Number.isFinite(opponentTeamRd) ? opponentTeamRd : 0;
      const safeTeammate = Number.isFinite(teammateRd) ? teammateRd : 0;
      return Math.hypot(safeOpp, safeTeammate / 2);
    }

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function getReliabilityWeight(rdObs) {
      const RD_DISCOUNT_START = 110.56;
      const RD_ALL_FRESH = Math.sqrt(3.0) * MAX_RD / 2.0;
      const MIN_RELIABILITY_WEIGHT = 0.50;
      const CURVE = 1.0;

      const t = clamp(
        (rdObs - RD_DISCOUNT_START) / (RD_ALL_FRESH - RD_DISCOUNT_START),
        0.0,
        1.0
      );

      return 1.0 - (1.0 - MIN_RELIABILITY_WEIGHT) * Math.pow(t, CURVE);
    }

    function updatePeriod(playerMap, periodMatches) {
      const starting = new Map();
      playerMap.forEach((p, name) => {
        starting.set(name, new GlickoPlayer(p.rating, p.rd));
      });

      const observations = new Map();

      for (const m of periodMatches) {
        const t1State = getTeamState(m.team1[0], m.team1[1], starting);
        const t2State = getTeamState(m.team2[0], m.team2[1], starting);

        const scoreT1 = m.score;
        const scoreT2 = 1.0 - m.score;

        m.team1.forEach((p, idx) => {
          const teammate = m.team1[1 - idx] || p;
          const teammateRd = getPlayerOrCreate(starting, teammate).rd;
          const teammateR = getPlayerOrCreate(starting, teammate).rating;
          const playerR = getPlayerOrCreate(starting, p).rating;
          const effectiveObservationR = getEffectiveObservationR(playerR, (playerR + teammateR) / 2.0, t2State.rating);
          if (!observations.has(p)) observations.set(p, []);
          observations.get(p).push({ oppR: effectiveObservationR, oppRd: t2State.rd, teammateRd, score: scoreT1, weight: m.weight });
        });

        m.team2.forEach((p, idx) => {
          const teammate = m.team2[1 - idx] || p;
          const teammateRd = getPlayerOrCreate(starting, teammate).rd;
          const teammateR = getPlayerOrCreate(starting, teammate).rating;
          const playerR = getPlayerOrCreate(starting, p).rating;
          const effectiveObservationR = getEffectiveObservationR(playerR, (playerR + teammateR) / 2.0, t1State.rating);
          if (!observations.has(p)) observations.set(p, []);
          observations.get(p).push({ oppR: effectiveObservationR, oppRd: t1State.rd, teammateRd, score: scoreT2, weight: m.weight });
        });
      }

      observations.forEach((obsList, pName) => {
        const player = getPlayerOrCreate(starting, pName);
        const r = player.rating;
        const rd = player.rd;

        let d2Inv = 0.0;
        let sumDelta = 0.0;

        for (const obs of obsList) {
          const effectiveObservationRd = getEffectiveObservationRd(obs.oppRd, obs.teammateRd);
          const gRd = g(effectiveObservationRd);
          const eVal = expected(r, obs.oppR, effectiveObservationRd);

          const w3 = getReliabilityWeight(effectiveObservationRd);
          const effectiveWeight = obs.weight * w3;

          d2Inv += effectiveWeight * Q * Q * gRd * gRd * eVal * (1.0 - eVal);
          sumDelta += effectiveWeight * gRd * (obs.score - eVal);
        }

        if (d2Inv <= 0) return;

        let newRd = 1.0 / Math.sqrt((1.0 / (rd * rd)) + d2Inv);
        newRd = Math.max(newRd, MIN_RD);

        const newR = r + (Q / ((1.0 / (rd * rd)) + d2Inv)) * sumDelta;

        playerMap.set(pName, new GlickoPlayer(newR, newRd));
      });
    }

    function toIsoDate(value) {
      if (!value) return null;
      if (/^\d{4}-\d{2}-\d{2}$/.test(value)) return value;
      const parts = String(value).split('/');
      if (parts.length === 3) {
        const d = String(parts[0]).padStart(2, '0');
        const m = String(parts[1]).padStart(2, '0');
        const y = String(parts[2]);
        return `${y}-${m}-${d}`;
      }
      const dt = new Date(value);
      if (Number.isNaN(dt.getTime())) return null;
      return dt.toISOString().split('T')[0];
    }

    function formatDisplayDate(iso) {
      if (!iso) return '-';
      const d = new Date(`${iso}T00:00:00Z`);
      return d.toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit', year: 'numeric' });
    }

    function formatShortDate(iso) {
      if (!iso) return '-';
      const d = new Date(`${iso}T00:00:00Z`);
      return String(d.getUTCDate()).padStart(2, '0');
    }

    function formatRating(value) {
      if (value === undefined || value === null || !Number.isFinite(value)) return '-';
      return Number(value).toFixed(2).replace('.', ',');
    }

    function getMatchEventTag(match) {
      const rawType = String(match && (match.event_type || match.type || '')).trim().toLowerCase();
      if (rawType === 'grupo_liga') return { label: 'Liga', className: 'league' };
      if (rawType === 'pozo' || rawType === 'doble_ko' || rawType === 'compas') return { label: 'Torneo', className: 'tournament' };
      return { label: 'Partido', className: 'match' };
    }

    function getSelectedPlayerMatchOutcome(match, playerName) {
      const team1 = [String(match.p1a || '').trim(), String(match.p1b || '').trim()].filter(Boolean);
      const team2 = [String(match.p2a || '').trim(), String(match.p2b || '').trim()].filter(Boolean);
      const playerOnTeam1 = team1.includes(playerName);
      const playerOnTeam2 = team2.includes(playerName);
      if (!playerOnTeam1 && !playerOnTeam2) return null;

      const setScores = [
        [Number.parseInt(String(match.s11 || '').trim(), 10), Number.parseInt(String(match.s21 || '').trim(), 10)],
        [Number.parseInt(String(match.s12 || '').trim(), 10), Number.parseInt(String(match.s22 || '').trim(), 10)],
        [Number.parseInt(String(match.s13 || '').trim(), 10), Number.parseInt(String(match.s23 || '').trim(), 10)]
      ];

      let team1Sets = 0;
      let team2Sets = 0;
      setScores.forEach(([a, b]) => {
        if (!Number.isFinite(a) || !Number.isFinite(b)) return;
        if (a === 0 && b === 0) return;
        if (a > b) team1Sets++;
        else if (b > a) team2Sets++;
      });

      if (team1Sets === team2Sets) return null;

      const playerWon = playerOnTeam1 ? team1Sets > team2Sets : team2Sets > team1Sets;
      return playerWon ? 'win' : 'loss';
    }

    function buildMatchLineHtml(match, playerName) {
      const team1 = [match.p1a, match.p1b].filter(Boolean).join(' / ');
      const team2 = [match.p2a, match.p2b].filter(Boolean).join(' / ');
      const tag = getMatchEventTag(match);
      const resultClass = getSelectedPlayerMatchOutcome(match, playerName);

      const setScores = [
        [match.s11, match.s21],
        [match.s12, match.s22],
        [match.s13, match.s23]
      ].filter(([a, b]) => {
        if (a === null || a === undefined || b === null || b === undefined) return false;
        const ai = Number.parseInt(String(a).trim(), 10);
        const bi = Number.parseInt(String(b).trim(), 10);
        if (!Number.isFinite(ai) || !Number.isFinite(bi)) return false;
        if (ai === 0 && bi === 0) return false;
        return true;
      });

      if (!setScores.length) return null;

      const scoreText = setScores.map(([a, b]) => `${String(a ?? 0)}-${String(b ?? 0)}`).join(', ');
      const scoreHtml = `<span class="match-result ${resultClass || ''}">${scoreText}</span>`;
      return '<div class="match-item"><span class="event-tag ' + tag.className + '">' + tag.label + '</span><strong>' + team1 + '</strong> vs <strong>' + team2 + '</strong><span class="match-score-separator"> — </span><span class="match-score-block">' + scoreHtml + '</span></div>';
    }

    function buildDailyHistoricalSeries() {
      const playerMap = new Map();
      allNames.forEach((name) => {
        const clean = String(name || '').trim();
        if (!clean) return;
        playerMap.set(clean, new GlickoPlayer());
      });

      const byDate = new Map();
      allMatches.forEach((m) => {
        const day = toIsoDate(m.date) || toIsoDate(m.start_date);
        if (!day || day < MIN_DATE) return;
        const rec = {
          team1: [String(m.p1a || '').trim(), String(m.p1b || '').trim()].filter(Boolean),
          team2: [String(m.p2a || '').trim(), String(m.p2b || '').trim()].filter(Boolean),
          score: 0,
          weight: 1
        };

        if (rec.team1.length !== 2 || rec.team2.length !== 2) return;

        const s1 = [m.s11, m.s12, m.s13].map(v => Number.parseInt(String(v || '').trim(), 10)).filter(v => Number.isFinite(v));
        const s2 = [m.s21, m.s22, m.s23].map(v => Number.parseInt(String(v || '').trim(), 10)).filter(v => Number.isFinite(v));

        if (!s1.length || !s2.length) return;

        let sets1 = 0;
        let sets2 = 0;
        let totalGames1 = 0;
        let totalGames2 = 0;
        const fmtLow = String(m.format || '').toLowerCase();

        for (let i = 0; i < 3; i++) {
          const a = s1[i];
          const b = s2[i];
          if (Number.isFinite(a) && Number.isFinite(b)) {
            if (i === 2 && fmtLow.includes('bo3_stb')) {
              if (a > b) {
                sets1++;
                totalGames1 += 1;
              } else if (b > a) {
                sets2++;
                totalGames2 += 1;
              }
              continue;
            }

            totalGames1 += a;
            totalGames2 += b;
            if (a > b) sets1++;
            else if (b > a) sets2++;
          }
        }

        if (sets1 === sets2) return;
        const winnerIsTeam1 = sets1 > sets2;
        const score = winnerIsTeam1 ? 1.0 : 0.0;
        const totalGames = totalGames1 + totalGames2;
        if (totalGames === 0) return;

        const x = winnerIsTeam1 ? totalGames1 / totalGames : totalGames2 / totalGames;
        let w1 = 1.0;
        if (fmtLow.includes('timed_games_long')) {
          w1 = 0.6;
        } else if (fmtLow.includes('timed') || fmtLow.includes('timed_games')) {
          w1 = 0.3;
        }

        const k = 10;
        const xx = Number(x);
        let w2 = 0.0001;
        if (Number.isFinite(xx)) {
          w2 = 0.5 + 1.0 / (1.0 + Math.exp(-k * (xx - 0.60)));
        }
        if (!Number.isFinite(w2) || w2 <= 0) w2 = 0.0001;

        const finalWeight = w1 * w2;
        rec.score = score;
        rec.weight = finalWeight;

        if (!byDate.has(day)) byDate.set(day, []);
        byDate.get(day).push(rec);
      });

      const allDates = [];
      const lastKnown = allMatches.length ? allMatches.map(m => toIsoDate(m.date) || toIsoDate(m.start_date)).filter(Boolean).sort().slice(-1)[0] || new Date().toISOString().slice(0, 10) : new Date().toISOString().slice(0, 10);
      let cursor = MIN_DATE;
      const end = lastKnown > new Date().toISOString().slice(0, 10) ? new Date().toISOString().slice(0, 10) : lastKnown;
      const limitDate = new Date(`${end}T00:00:00Z`);
      const startDate = new Date(`${cursor}T00:00:00Z`);
      const msPerDay = 24 * 60 * 60 * 1000;
      let counter = 0;

      while (startDate.getTime() <= limitDate.getTime() && counter < DAILY_SNAPSHOT_LIMIT) {
        const dateStr = startDate.toISOString().slice(0, 10);
        allDates.push(dateStr);
        startDate.setTime(startDate.getTime() + msPerDay);
        counter++;
      }

      const historical = [];
      const selectedPlayerMap = new Map(playerMap);

      allDates.forEach((dateStr) => {
        const dayMatches = byDate.get(dateStr) || [];
        const activeToday = new Set();

        dayMatches.forEach(m => {
          (m.team1 || []).concat(m.team2 || []).forEach(p => {
            if (p && p.trim()) activeToday.add(p.trim());
          });
        });

        decayAllPlayersOneDay(selectedPlayerMap, activeToday);

        if (dayMatches.length > 0) {
          updatePeriod(selectedPlayerMap, dayMatches);
        }

        historical.push({
          date: dateStr,
          values: new Map(selectedPlayerMap)
        });
      });

      return historical;
    }

    function getPlayerSeries(playerName) {
      if (!playerName) return [];
      const cleaned = String(playerName).trim();
      if (!cleaned) return [];
      return dailySeries.map((entry) => {
        const value = entry.values.get(cleaned) || new GlickoPlayer();
        return {
          date: entry.date,
          rating: value.rating,
          rd: value.rd
        };
      });
    }

    function monthNames() {
      return ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
    }

    function formatMonthLabel(date) {
      const safeDate = date instanceof Date ? new Date(date) : new Date();
      const month = monthNames()[safeDate.getUTCMonth() || safeDate.getMonth()];
      const year = safeDate.getUTCFullYear ? safeDate.getUTCFullYear() : safeDate.getFullYear();
      return `${month} ${year}`;
    }

    function getVisibleMonthStart(date) {
      return new Date(Date.UTC(date.getUTCFullYear(), date.getUTCMonth(), 1));
    }

    function getVisibleMonthEnd(date) {
      return new Date(Date.UTC(date.getUTCFullYear(), date.getUTCMonth() + 1, 0));
    }

    function clampMonthDate(date) {
      const minMonth = new Date('2026-09-01T00:00:00Z');
      const today = new Date();
      today.setUTCHours(0, 0, 0, 0);
      const currentMonth = new Date(Date.UTC(today.getUTCFullYear(), today.getUTCMonth(), 1));
      if (date < minMonth) return new Date(minMonth);
      if (date > currentMonth) return new Date(currentMonth);
      return new Date(date);
    }

    function getVisibleMonthSeries() {
      const monthStart = getVisibleMonthStart(currentMonthDate);
      const monthEnd = getVisibleMonthEnd(currentMonthDate);
      const startIso = monthStart.toISOString().slice(0, 10);
      const endDate = new Date(monthEnd);
      const today = new Date();
      today.setUTCHours(0, 0, 0, 0);
      if (endDate > today) endDate.setTime(today.getTime());
      const endIso = endDate.toISOString().slice(0, 10);
      return dailySeries.filter((point) => point.date >= startIso && point.date <= endIso);
    }

    function updateRangeLabel() {
      const visible = getVisibleMonthSeries();
      if (!visible.length) {
        document.getElementById('rangeLabel').textContent = formatMonthLabel(currentMonthDate);
        return;
      }
      document.getElementById('rangeLabel').textContent = formatMonthLabel(currentMonthDate);
    }

    function renderChart() {
      const playerName = document.getElementById('playerSelect').value;
      if (!playerName) {
        document.getElementById('ratingChart').innerHTML = '';
        document.getElementById('summary').textContent = 'Selecciona un jugador para ver su evolución.';
        document.getElementById('matchList').innerHTML = '';
        return;
      }

      const series = getPlayerSeries(playerName);
      if (!series.length) {
        document.getElementById('ratingChart').innerHTML = '';
        document.getElementById('summary').textContent = 'No hay datos para este jugador en el rango seleccionado.';
        document.getElementById('matchList').innerHTML = '';
        return;
      }

      const monthStart = getVisibleMonthStart(currentMonthDate);
      const monthEnd = getVisibleMonthEnd(currentMonthDate);
      const startIso = monthStart.toISOString().slice(0, 10);
      const endIso = monthEnd.toISOString().slice(0, 10);
      const visibleSeries = series.filter((point) => point.date >= startIso && point.date <= endIso);
      if (!visibleSeries.length) {
        document.getElementById('summary').textContent = 'Sin datos disponibles en este intervalo.';
        document.getElementById('matchList').innerHTML = '';
        return;
      }

      const svg = document.getElementById('ratingChart');
      const daysInMonth = getVisibleMonthEnd(currentMonthDate).getUTCDate();
      const width = Math.max(820, daysInMonth * 30);
      const height = 310;
      const padding = { top: 18, right: 16, bottom: 34, left: 42 };
      const plotW = width - padding.left - padding.right;
      const plotH = height - padding.top - padding.bottom;

      const values = visibleSeries.map(d => d.rating);
      const minVal = Math.min(...values) - 30;
      const maxVal = Math.max(...values) + 30;
      const yRange = maxVal - minVal || 1;

      const xForIndex = (index) => padding.left + (visibleSeries.length === 1 ? plotW / 2 : (index / (visibleSeries.length - 1)) * plotW);
      const yForValue = (value) => padding.top + ((maxVal - value) / yRange) * plotH;

      const gridLines = Array.from({ length: 5 }, (_, i) => {
        const value = minVal + (i / 4) * yRange;
        const y = yForValue(value);
        return `
          <line x1="${padding.left}" y1="${y}" x2="${width - padding.right}" y2="${y}" stroke="rgba(148,163,184,0.28)" stroke-dasharray="4 4" />
          <text x="8" y="${y + 4}" fill="#667085" font-size="11">${Math.round(value)}</text>
        `;
      }).join('');

      const xLabels = visibleSeries.map((point, idx) => {
        const x = xForIndex(idx);
        return `<text x="${x}" y="${height - 10}" text-anchor="middle" fill="#667085" font-size="11">${formatShortDate(point.date)}</text>`;
      }).join('');

      const points = visibleSeries.map((point, idx) => ({
        ...point,
        x: xForIndex(idx),
        y: yForValue(point.rating)
      }));

      const polyline = points.map((point) => `${point.x},${point.y}`).join(' ');

      const dayValueMarkup = points.map((point) => `
        <g data-day="${point.date}" class="chart-point" style="cursor:pointer">
          <circle cx="${point.x}" cy="${point.y}" r="5.5" fill="#22c55e" stroke="#fff" stroke-width="2" />
          <circle cx="${point.x}" cy="${point.y}" r="12" fill="transparent" data-day="${point.date}" />
        </g>
      `).join('');

      svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
      svg.setAttribute('width', String(width));
      svg.innerHTML = `
        <g>
          ${gridLines}
          <line x1="${padding.left}" y1="${height - padding.bottom}" x2="${width - padding.right}" y2="${height - padding.bottom}" stroke="rgba(15,23,42,0.18)" />
          <line x1="${padding.left}" y1="${padding.top}" x2="${padding.left}" y2="${height - padding.bottom}" stroke="rgba(15,23,42,0.18)" />
          <polyline fill="none" stroke="#16a34a" stroke-width="2.5" points="${polyline}" opacity="0.95" />
          ${dayValueMarkup}
          ${xLabels}
        </g>
      `;

      const selected = visibleSeries.find((point) => point.date === selectedDay) || visibleSeries[visibleSeries.length - 1];
      if (selected) {
        selectedDay = selected.date;
        updateSelectedDayDetails(playerName, selectedDay);
      } else {
        document.getElementById('summary').textContent = 'Selecciona un punto para ver el detalle del día';
        document.getElementById('matchList').innerHTML = '';
      }

      svg.querySelectorAll('[data-day]').forEach((node) => {
        node.addEventListener('click', () => {
          const day = node.getAttribute('data-day');
          if (!day) return;
          openDayDetail(playerName, day);
        });
      });

      updateRangeLabel();
      syncNavigationButtons();
    }

    function getPreviousDayRatingDelta(playerName, day) {
      const series = getPlayerSeries(playerName);
      if (!series.length) return null;

      const currentIndex = series.findIndex((point) => point.date === day);
      if (currentIndex <= 0) return null;

      const current = series[currentIndex];
      const previous = series[currentIndex - 1];
      if (!current || !previous || current.rating === undefined || previous.rating === undefined) return null;

      const diff = current.rating - previous.rating;
      if (!Number.isFinite(diff) || diff === 0) return null;

      return {
        diff,
        icon: diff > 0 ? '︽' : '︾',
        color: diff > 0 ? '#4ade80' : '#f87171'
      };
    }

    function updateSelectedDayDetails(playerName, day) {
      if (!playerName) {
        document.getElementById('summary').textContent = 'Selecciona un jugador para ver su evolución.';
        document.getElementById('matchList').innerHTML = '';
        return;
      }

      const selectedData = getPlayerSeries(playerName).find((point) => point.date === day) || { rating: null, rd: null };
      const rating = selectedData.rating ?? 0;
      const rd = selectedData.rd ?? 0;
      const dayMatches = allMatches.filter((m) => {
        const matchDay = toIsoDate(m.date) || toIsoDate(m.start_date);
        if (matchDay !== day) return false;
        const namesInMatch = [String(m.p1a || '').trim(), String(m.p1b || '').trim(), String(m.p2a || '').trim(), String(m.p2b || '').trim()];
        return namesInMatch.includes(playerName);
      });

      const summaryEl = document.getElementById('summary');
      const baseText = 'Día ' + formatDisplayDate(day) + ' · Rating: ' + formatRating(rating) + ' ± ' + formatRating(rd);
      const delta = getPreviousDayRatingDelta(playerName, day);

      if (!delta) {
        summaryEl.textContent = baseText;
      } else {
        const deltaText = delta.icon + ' ' + formatRating(Math.abs(delta.diff));
        summaryEl.innerHTML = `${baseText} <span class="summary-delta" style="color:${delta.color};">${deltaText}</span>`;
      }

      const listEl = document.getElementById('matchList');
      const validMatches = dayMatches
        .map((m) => buildMatchLineHtml(m, playerName))
        .filter(Boolean);

      listEl.innerHTML = validMatches.length
        ? validMatches.join('')
        : '<div class="match-item muted">No hubo partidos para este jugador en este día.</div>';
    }

    function openDayDetail(playerName, day) {
      selectedDay = day;
      updateSelectedDayDetails(playerName, day);
    }

    function syncNavigationButtons() {
      const prevButton = document.getElementById('prevWindowBtn');
      const nextButton = document.getElementById('nextWindowBtn');
      const minMonth = new Date('2026-09-01T00:00:00Z');
      const today = new Date();
      today.setUTCHours(0, 0, 0, 0);
      const currentMonth = new Date(Date.UTC(today.getUTCFullYear(), today.getUTCMonth(), 1));
      prevButton.disabled = currentMonthDate.getTime() <= minMonth.getTime();
      nextButton.disabled = currentMonthDate.getTime() >= currentMonth.getTime();
    }

    function moveWindow(direction) {
      if (!dailySeries.length) return;
      const nextDate = new Date(Date.UTC(currentMonthDate.getUTCFullYear(), currentMonthDate.getUTCMonth() + direction, 1));
      const minMonth = new Date('2026-09-01T00:00:00Z');
      const today = new Date();
      today.setUTCHours(0, 0, 0, 0);
      const maxMonth = new Date(Date.UTC(today.getUTCFullYear(), today.getUTCMonth(), 1));
      if (nextDate < minMonth) return;
      if (nextDate > maxMonth) return;
      currentMonthDate = nextDate;
      renderChart();
    }

    function populatePlayers() {
      const select = document.getElementById('playerSelect');
      const sortedNames = [...new Set(allNames.map((name) => String(name).trim()).filter(Boolean))].sort((a, b) =>
        a.localeCompare(b, 'es', { sensitivity: 'base', numeric: true })
      );

      select.innerHTML = '<option value="">-- Selecciona un jugador --</option>';
      sortedNames.forEach((name) => {
        const option = document.createElement('option');
        option.value = name;
        option.textContent = name;
        select.appendChild(option);
      });
      select.value = '';
    }

    function setDefaultPlayerSelection() {
      const select = document.getElementById('playerSelect');
      const params = new URLSearchParams(window.location.search);
      const requestedPlayer = params.get('player') || '';
      const exists = Array.from(select.options).some((option) => option.value === requestedPlayer);

      select.value = exists ? requestedPlayer : '';
    }

    function promptMonthSelection() {
      const suggested = `${String(currentMonthDate.getUTCMonth() + 1).padStart(2, '0')}/${currentMonthDate.getUTCFullYear()}`;
      const input = prompt('Introduce un mes (MM/YYYY):', suggested);
      if (input === null) return;
      const match = String(input).trim().match(/^(\d{1,2})\/(\d{4})$/);
      if (!match) {
        alert('Formato inválido. Usa MM/YYYY, por ejemplo 03/2026');
        return;
      }
      const month = Number(match[1]);
      const year = Number(match[2]);
      if (month < 1 || month > 12) {
        alert('El mes debe estar entre 01 y 12');
        return;
      }
      const minMonth = new Date('2026-09-01T00:00:00Z');
      const today = new Date();
      today.setUTCHours(0, 0, 0, 0);
      const maxMonth = new Date(Date.UTC(today.getUTCFullYear(), today.getUTCMonth(), 1));
      const candidate = new Date(Date.UTC(year, month - 1, 1));
      if (candidate < minMonth || candidate > maxMonth) {
        alert('Solo se puede consultar desde Septiembre 2026 hasta el mes actual');
        return;
      }
      currentMonthDate = candidate;
      renderChart();
    }

    function handlePlayerChange() {
      const selected = document.getElementById('playerSelect').value;
      if (!selected || !Array.isArray(dailySeries) || !dailySeries.length) {
        document.getElementById('ratingChart').innerHTML = '';
        document.getElementById('summary').textContent = 'Selecciona un jugador para ver su evolución.';
        document.getElementById('matchList').innerHTML = '';
        return;
      }
      currentMonthDate = clampMonthDate(new Date());
      renderChart();
    }

    async function loadData() {
      const namesRes = await fetch('/api/read?action=getNames&ts=' + Date.now());
      const namesData = await namesRes.json();
      allNames = (namesData.names || []).map((n) => String(n).trim()).filter(Boolean);

      const matchesRes = await fetch('/api/read?action=getResults&eventType=ranked,grupo_liga,pozo,compas,doble_ko,legacy&ts=' + Date.now());
      const matchesData = await matchesRes.json();
      allMatches = (matchesData.matches || []).filter((m) => {
        const date = toIsoDate(m.date) || toIsoDate(m.start_date);
        if (!date) return false;
        return date >= MIN_DATE;
      });

      populatePlayers();
      setDefaultPlayerSelection();
      dailySeries = buildDailyHistoricalSeries();
      if (!dailySeries.length) {
        document.getElementById('rangeLabel').textContent = 'Sin datos';
        document.getElementById('summary').textContent = 'No hay datos disponibles para mostrar.';
        return;
      }

      const requestedPlayer = document.getElementById('playerSelect').value;
      currentMonthDate = clampMonthDate(new Date());
      document.getElementById('rangeLabel').textContent = requestedPlayer ? formatMonthLabel(currentMonthDate) : 'Selecciona un jugador';
      document.getElementById('summary').textContent = requestedPlayer ? 'Cargando evolución...' : 'Selecciona un punto para ver el detalle del día';
      document.getElementById('matchList').innerHTML = '';
      document.getElementById('ratingChart').innerHTML = '';

      if (requestedPlayer) {
        handlePlayerChange();
      }
    }

    document.addEventListener('DOMContentLoaded', async () => {
      document.getElementById('playerSelect').addEventListener('change', handlePlayerChange);
      document.getElementById('prevWindowBtn').addEventListener('click', () => moveWindow(-1));
      document.getElementById('nextWindowBtn').addEventListener('click', () => moveWindow(1));
      document.getElementById('rangeLabel').addEventListener('click', promptMonthSelection);
      await loadData();
    });
  </script>
</body>
</html>
