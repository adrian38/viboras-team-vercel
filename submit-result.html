<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enviar resultado</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/theme.css">
<link rel="icon" href="/image.png" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<script src="/pwa.js" defer></script>
<meta name="apple-mobile-web-app-title" content="Viboras">
<meta name="theme-color" content="#121316">

<style>
/* Formulario de resultado. Los nombres de clase se conservan: submitResult()
   localiza el boton con document.querySelector('.btn.warn'). */

.form-row{display:flex;gap:var(--vt-md);align-items:center;margin-bottom:var(--vt-md)}
.label-inline{
  width:110px;flex:0 0 auto;
  font-size:12px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;
  color:var(--vt-muted);
}

.input,select{
  width:100%;
  padding:10px 12px;
  background:var(--vt-surface-deep);
  border:1px solid var(--vt-border-strong);
  border-radius:var(--vt-r);
  color:var(--vt-text);
  font-family:var(--vt-font-body);
  font-size:15px;
}
.input:focus,select:focus{outline:none;border-color:var(--vt-gold)}
select{appearance:none;cursor:pointer;padding-right:34px;
  background-image:linear-gradient(45deg,transparent 50%,var(--vt-muted) 50%),linear-gradient(135deg,var(--vt-muted) 50%,transparent 50%);
  background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat}
select option{background:var(--vt-surface-2)}
/* El icono del date picker nativo es negro sobre negro. */
input[type=date]::-webkit-calendar-picker-indicator{filter:invert(1) opacity(.55);cursor:pointer}

.teams{display:flex;flex-direction:column;gap:var(--vt-md);margin-top:var(--vt-md)}
.team-card{
  background:var(--vt-surface-2);
  border:1px solid var(--vt-border);
  border-radius:var(--vt-r-lg);
  padding:var(--vt-md);
}
.team-title{
  display:flex;align-items:center;gap:var(--vt-sm);
  margin-bottom:var(--vt-md);
  font-family:var(--vt-font-head);
  font-size:18px;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;
  color:var(--vt-gold);
}
.team-title::before{content:'';width:7px;height:7px;border-radius:var(--vt-r-full);background:var(--vt-gold)}
.team-card.team-3 .team-title{color:var(--vt-text-strong)}
.team-card.team-3 .team-title::before{display:none}

.players{display:flex;flex-direction:column;gap:var(--vt-sm)}

.score{
  width:100%;
  padding:12px 8px;
  background:var(--vt-surface-deep);
  border:1px solid var(--vt-border-strong);
  border-radius:var(--vt-r);
  color:var(--vt-text-strong);
  font-family:var(--vt-font-head);
  font-size:22px;font-weight:700;
  text-align:center;
}
.score:focus{outline:none;border-color:var(--vt-gold)}
.score-grid input.score{width:100%;box-sizing:border-box}
.score-label{
  display:flex;align-items:center;
  font-size:13px;font-weight:600;
  color:var(--vt-text);
  padding:8px 0;
}

.controls{display:flex;gap:var(--vt-sm);justify-content:flex-end;margin-top:var(--vt-lg)}
.btn{
  padding:10px 20px;
  border:1px solid transparent;
  border-radius:var(--vt-r);
  background:var(--vt-surface-3);
  color:var(--vt-text);
  font-family:var(--vt-font-body);
  font-size:14px;font-weight:700;letter-spacing:0.02em;
  cursor:pointer;
  min-width:120px;
  transition:background .15s ease,border-color .15s ease,box-shadow .15s ease;
}
.btn.ghost{background:transparent;border-color:var(--vt-border-strong);color:var(--vt-text)}
.btn.ghost:hover{border-color:var(--vt-gold);color:var(--vt-gold-light)}
.btn.warn{background:var(--vt-gold);color:#121316;text-transform:uppercase}
.btn.warn:hover{background:var(--vt-yellow);box-shadow:0 0 18px -2px rgba(250,204,21,0.45)}
.btn[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none}

@media(min-width:820px){
  .teams{display:grid;grid-template-columns:1fr 1fr;gap:var(--vt-md)}
  .teams .team-card:nth-child(3){grid-column:1 / -1}
}
@media(max-width:820px){
  .teams{grid-template-columns:1fr}
}
/* La rejilla del marcador lleva 110px fijos de etiqueta en linea; a 375 px
   los tres sets no caben al lado, asi que la etiqueta encoge. */
@media(max-width:520px){
  .form-row{align-items:flex-start;flex-direction:column;gap:var(--vt-xs)}
  .label-inline{width:auto}
  .score-grid,.sets-head{grid-template-columns:64px repeat(3,1fr) !important}
  .score{font-size:18px;padding:10px 4px}
  .controls .btn{flex:1;min-width:0}
}
</style>
</head>

<body>

<div class="vt-page">

  <div style="text-align:center">
    <img src="/image.png" alt="Víboras Team" width="88" height="88" style="border-radius:var(--vt-r-lg);filter:drop-shadow(0 4px 16px rgba(245,158,11,0.25))">
    <h3 class="vt-gold" style="margin-top:var(--vt-sm)">Víboras Team</h3>
    <span class="vt-label">Enviar resultado</span>
  </div>

  <div class="vt-card vt-card--accent">
    <div class="form-row">
      <div class="label-inline">Fecha</div>
      <input id="date" class="input" type="date">
    </div>

    <div class="teams">

      <div class="team-card team-1">
        <div class="team-title">Equipo 1</div>
        <div class="players">
          <select id="p1a" class="input"></select>
          <select id="p1b" class="input"></select>
        </div>
      </div>

      <div class="team-card team-2">
        <div class="team-title">Equipo 2</div>
        <div class="players">
          <select id="p2a" class="input"></select>
          <select id="p2b" class="input"></select>
        </div>
      </div>

      <div class="team-card team-3" style="padding-bottom:16px">
        <div class="team-title">Marcador</div>
        <div class="sets-head vt-label" style="margin-bottom:10px;display:grid;grid-template-columns:110px repeat(3,1fr);gap:8px;align-items:center">
          <div></div>
          <div style="text-align:center">Set 1</div>
          <div style="text-align:center">Set 2</div>
          <div style="text-align:center">Set 3</div>
        </div>

        <div class="score-grid" style="display:grid;grid-template-columns:110px repeat(3,1fr);gap:8px;margin-bottom:8px;align-items:center">
          <div class="score-label">Equipo 1</div>
          <input id="s11" class="score" type="text" inputmode="numeric" pattern="\\d*" placeholder="" />
          <input id="s12" class="score" type="text" inputmode="numeric" pattern="\\d*" placeholder="" />
          <input id="s13" class="score" type="text" inputmode="numeric" pattern="\\d*" placeholder="" />
        </div>

        <div class="score-grid" style="display:grid;grid-template-columns:110px repeat(3,1fr);gap:8px;align-items:center">
          <div class="score-label">Equipo 2</div>
          <input id="s21" class="score" type="text" inputmode="numeric" pattern="\\d*" placeholder="" />
          <input id="s22" class="score" type="text" inputmode="numeric" pattern="\\d*" placeholder="" />
          <input id="s23" class="score" type="text" inputmode="numeric" pattern="\\d*" placeholder="" />
        </div>

        <div style="margin-top:var(--vt-md);padding-top:var(--vt-md);border-top:1px solid var(--vt-border);display:flex;align-items:center;gap:10px">
          <input id="stb" type="checkbox" style="margin:0">
          <label for="stb" style="font-weight:500;color:var(--vt-text);cursor:pointer">Set 3 es super tie-break</label>
        </div>
      </div>

    </div>

    <div class="controls">
      <button class="btn ghost" onclick="window.location='/'">Atrás</button>
      <button class="btn warn" onclick="submitResult()">Guardar resultado</button>
    </div>

  </div>
</div>

<script>
function formatToday(){
  const d=new Date();
  const day=String(d.getDate()).padStart(2,'0');
  const month=String(d.getMonth()+1).padStart(2,'0');
  const year=d.getFullYear();
  return `${day}/${month}/${year}`;
}
function isoToday(){
  const d=new Date();
  const day=String(d.getDate()).padStart(2,'0');
  const month=String(d.getMonth()+1).padStart(2,'0');
  const year=d.getFullYear();
  return `${year}-${month}-${day}`;
}
// set native date input to today (ISO format) so browsers show calendar picker
document.getElementById('date').value = isoToday();

// normalize value from date input (YYYY-MM-DD) to DD/MM/YYYY for validation/payload
function normalizeDateInput(val){
  if(/^\d{4}-\d{2}-\d{2}$/.test(val)){
    const [y,m,d] = val.split('-')
    return `${d}/${m}/${y}`
  }
  return val
}

function isNonNegativeIntegerString(s){ return /^\d+$/.test(String(s).trim()) }
function isValidDateDDMMYYYY(str){ if(!/^\d{2}\/\d{2}\/\d{4}$/.test(str)) return false; const parts=str.split('/'); const d=new Date(parseInt(parts[2],10), parseInt(parts[1],10)-1, parseInt(parts[0],10)); return d && d.getFullYear()==parseInt(parts[2],10) && d.getMonth()==parseInt(parts[1],10)-1 && d.getDate()==parseInt(parts[0],10) }

let submitInFlight = false

async function submitResult(){
  if (submitInFlight) return

  // basic required
  const required = ['p1a','p1b','p2a','p2b','s11','s21']
  for(const id of required){ const el=document.getElementById(id); if(!el || !el.value.trim()){ alert('Completa todos los campos obligatorios'); el && el.focus(); return } }

  const rawDate = document.getElementById('date').value.trim();
  const dateVal = normalizeDateInput(rawDate)
  if(!isValidDateDDMMYYYY(dateVal)){ alert('Formato de fecha inválido. Usa DD/MM/YYYY'); return }

  const setIds = ['s11','s12','s13','s21','s22','s23']
  for(const id of setIds){ const v=document.getElementById(id).value.trim(); if(v!=='' && !isNonNegativeIntegerString(v)){ alert('Los sets deben ser números enteros no negativos'); document.getElementById(id).focus(); return } }

  // ensure names unique across both teams
  const names = ['p1a','p1b','p2a','p2b'].map(id=>document.getElementById(id).value.trim())
  const set = new Set(); for(const n of names){ if(set.has(n)){ alert('Los nombres no pueden repetirse entre los equipos'); return } set.add(n) }

  const payload = {
    date: dateVal,
    p1a: names[0], p1b: names[1], p2a: names[2], p2b: names[3],
    s11: document.getElementById('s11').value.trim(), s12: document.getElementById('s12').value.trim(), s13: document.getElementById('s13').value.trim(),
    s21: document.getElementById('s21').value.trim(), s22: document.getElementById('s22').value.trim(), s23: document.getElementById('s23').value.trim()
  }

  // include format when set 3 is a super tie-break
  const stbEl = document.getElementById('stb')
  if(stbEl && stbEl.checked){ payload.format = 'bo3_stb' }

  const saveButton = document.querySelector('.btn.warn')
  if (saveButton) {
    saveButton.disabled = true
    saveButton.textContent = 'Guardando...'
  }

  submitInFlight = true

  try{
    const res = await fetch('/api/write?action=submitResult',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)})
    const json = await res.json().catch(() => ({}))
    if(!res.ok || !json.ok){ throw new Error('save_failed') }
    alert('Resultado guardado')
    window.location='/'
  }catch(e){ console.error(e); alert('Error al guardar resultado') } finally {
    submitInFlight = false
    if(saveButton){
      saveButton.disabled = false
      saveButton.textContent = 'Guardar resultado'
    }
  }
}

// load names into selects
async function loadNamesIntoSelects(){
  const isLocal = location.hostname==='localhost' || location.hostname==='127.0.0.1'
  try{
    const res = await fetch('/api/read?action=getNames')
    const db = await res.json()
    const names = (db && db.names) ? (db.names.slice().sort((a,b)=>a.toLowerCase().localeCompare(b.toLowerCase()))) : []
    const ids = ['p1a','p1b','p2a','p2b']
    for(const id of ids){ const sel=document.getElementById(id); if(!sel) continue; sel.innerHTML=''; const empty=document.createElement('option'); empty.value=''; empty.innerText='-- Nombre --'; sel.appendChild(empty); for(const n of names){ const opt=document.createElement('option'); opt.value=n; opt.innerText=n; sel.appendChild(opt) } }
  }catch(e){ console.error('Could not load names',e) }
}
loadNamesIntoSelects()

</script>

</body>
</html>
