<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Historial de resultados</title>
<link rel="icon" href="/image.png" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest" crossorigin="use-credentials">
<script src="/pwa.js" defer></script>
<meta name="apple-mobile-web-app-title" content="Viboras">
<meta name="theme-color" content="#121316">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/theme.css">
<style>
/* renderTable() reparte las clases .tag/.win/.lose/.tie, .desktop-only y
   .mobile-only, y los th alternan .th-full / .th-day segun el ancho. Todas
   se conservan: aqui solo cambian sus reglas. */

.controls{display:flex;gap:var(--vt-md);flex-wrap:wrap}
.controls label{
  font-size:12px;font-weight:600;letter-spacing:0.05em;text-transform:uppercase;
  color:var(--vt-muted);
  gap:var(--vt-xs);
}
.filter-box{
  background:var(--vt-surface-2);
  border:1px solid var(--vt-border);
  border-radius:var(--vt-r-lg);
  padding:var(--vt-md);
  margin-bottom:var(--vt-md);
}

.select{
  padding:9px 30px 9px 12px;
  background:var(--vt-surface-deep);
  border:1px solid var(--vt-border-strong);
  border-radius:var(--vt-r);
  color:var(--vt-text);
  font-family:var(--vt-font-body);
  font-size:14px;
}
select.select{
  appearance:none;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,var(--vt-muted) 50%),linear-gradient(135deg,var(--vt-muted) 50%,transparent 50%);
  background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat;
}
.select:focus{outline:none;border-color:var(--vt-gold)}
.select::placeholder{color:var(--vt-faint)}
.select option{background:var(--vt-surface-2)}

/* En modo administracion la tabla gana una cuarta columna, "Acciones", con
   Guardar y Cancelar, y deja de caber: a 390 px se salia 63 px de la tarjeta,
   que al llevar overflow:hidden la recortaba. Que scrollee dentro, como ya
   hacen torneos y ranking con sus tablas. */
#tableContainer{overflow-x:auto}
table{width:100%;border-collapse:collapse;margin-top:var(--vt-sm)}
th{
  padding:10px 12px;
  background:var(--vt-surface-3);
  color:var(--vt-muted);
  font-size:11px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;
  text-align:left;
  border-bottom:1px solid var(--vt-border-strong);
}
th:last-child{text-align:right}
td{padding:10px 12px;border-bottom:1px solid var(--vt-border);color:var(--vt-text)}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:var(--vt-surface-2)}
/* El marcador es el dato que se busca de un vistazo: oro y condensada. */
td:nth-child(3){
  text-align:right;
  font-family:var(--vt-font-head);
  font-size:19px;font-weight:700;letter-spacing:0.02em;
  color:var(--vt-gold);
  white-space:nowrap;
}

.muted{color:var(--vt-muted)}

.btn{
  padding:9px 16px;
  background:var(--vt-gold);
  border:1px solid transparent;
  border-radius:var(--vt-r);
  color:#121316;
  font-family:var(--vt-font-body);
  font-size:14px;font-weight:700;letter-spacing:0.02em;
  cursor:pointer;
  transition:background .15s ease,box-shadow .15s ease;
}
.btn:hover{background:var(--vt-yellow);box-shadow:0 0 18px -2px rgba(250,204,21,0.45)}
.back-btn{
  padding:9px 16px;
  background:transparent;
  border:1px solid var(--vt-border-strong);
  border-radius:var(--vt-r);
  color:var(--vt-text);
  font-family:var(--vt-font-body);
  font-size:14px;font-weight:700;
  cursor:pointer;
}
.back-btn:hover{border-color:var(--vt-gold);color:var(--vt-gold-light)}
/* Administracion escribe en la base sin pedir nada: se queda en rojo. */
.admin-bottom{
  padding:9px 16px;
  background:var(--vt-error-bg);
  border:1px solid rgba(255,180,171,0.35);
  border-radius:var(--vt-r);
  color:var(--vt-error);
  font-family:var(--vt-font-body);
  font-size:14px;font-weight:700;
  cursor:pointer;
}
.admin-bottom:hover{background:rgba(147,0,10,0.3)}
.admin-btn,.small-btn{
  padding:6px 10px;
  background:transparent;
  border:1px solid var(--vt-border-strong);
  border-radius:var(--vt-r-sm);
  color:var(--vt-text);
  font-size:13px;
  cursor:pointer;
}
.small-btn:hover,.admin-btn:hover{border-color:var(--vt-gold);color:var(--vt-gold-light)}

#adminPanel{background:var(--vt-surface-2) !important;border:1px dashed var(--vt-border-strong) !important}
.admin-match-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--vt-sm)}
.admin-match-grid > input{width:100%;min-width:0;box-sizing:border-box}
.admin-format-option{
  display:flex;align-items:center;gap:var(--vt-sm);
  margin-top:var(--vt-sm);padding:6px 10px;
  border-radius:var(--vt-r);
  background:var(--vt-surface-3);
  border:1px solid var(--vt-border);
  font-size:13px;color:var(--vt-text);
}
.admin-format-option input{margin:0}

/* Ganada, perdida, empatada: el color del nombre es el resultado. */
.tag{
  display:inline-block;
  padding:3px 10px;
  margin-right:6px;
  border-radius:var(--vt-r-full);
  background:var(--vt-surface-3);
  border:1px solid var(--vt-border-strong);
  color:var(--vt-text);
  font-size:13px;
  font-weight:600;
}
.tag.win{background:rgba(74,222,128,0.12);color:#4ade80;border-color:rgba(74,222,128,0.35)}
.tag.lose{background:rgba(248,113,113,0.10);color:#f87171;border-color:rgba(248,113,113,0.30)}
.tag.tie{background:var(--vt-surface-3);color:var(--vt-muted);border-color:var(--vt-border-strong)}

@media(max-width:720px){.admin-match-grid{grid-template-columns:1fr}.admin-format-option{font-size:12px}}
.set-list{display:flex;gap:6px;flex-wrap:wrap}
.set-item{display:inline-block}
.set-item:not(:last-child)::after{content:", "}
.date-day{display:none}
.date-full{display:inline}
.th-day{display:none}
.th-full{display:inline}
@media(max-width:720px){
  .set-list{display:block}
  .set-item{display:block;margin-bottom:6px}
  .set-item:not(:last-child)::after{content:""}
  .date-day{display:inline}
  .date-full{display:none}
  .th-day{display:inline}
  .th-full{display:none}
  /* Make player tags slightly smaller and not bold on mobile */
  .tag{font-weight:400;font-size:0.75rem}
  .team-break{display:none}
  /* Show short header for Marcador */
  .th-res{display:inline}
  .th-full-res{display:none}
}
  /* Desktop vs mobile visibility helpers */
  .desktop-only{display:inline}
  .mobile-only{display:none}
  @media(max-width:720px){
    .desktop-only{display:none}
    .mobile-only{display:inline-block;margin-right:8px}
  }

/* Con tres columnas en 375 px el marcador y el relleno se encogen. */
@media(max-width:720px){
  td:nth-child(3){font-size:16px}
  th,td{padding:8px 6px}
  .controls{gap:var(--vt-sm)}
  .controls label{flex:1;min-width:120px}
  .select{width:100%}
}

/* Mobile: score styling and inline sets */
@media(max-width:720px){
  .set-list{display:inline;font-size:calc(1rem - 3pt)}
  .set-item{display:inline;margin-right:8px}
  .team-break{display:block}
  .th-res{display:none}
  .th-full-res{display:inline}
}
@media(max-width:720px){
  .team-break{display:block}
}
</style>
</head>
<body>

<div class="vt-page">

  <div style="text-align:center">
    <img src="/image.png" alt="Víboras Team" width="88" height="88" style="border-radius:var(--vt-r-lg);filter:drop-shadow(0 4px 16px rgba(245,158,11,0.25))">
    <h1 class="vt-gold" style="margin-top:var(--vt-sm)">Historial de partidos</h1>
    <span class="vt-label">Registro oficial · Víboras Pádel</span>
  </div>

  <div class="vt-card vt-card--accent">
    <div class="filter-box">
      <div class="controls" role="toolbar" aria-label="Filtros">
      <label style="display:flex;flex-direction:column">
        Año
        <select id="year" class="select"></select>
      </label>

      <label style="display:flex;flex-direction:column">
        Mes
        <select id="month" class="select"></select>
      </label>

      <label style="display:flex;flex-direction:column;flex:1">
        Jugador
        <select id="player" class="select"></select>
      </label>
      </div>
    </div>

    <div id="summary" class="muted"></div>

    <div id="adminPanel" style="display:none;margin-top:12px;padding:10px;border-radius:8px;border:1px dashed rgba(15,23,42,0.06);background:#fff">
      <div style="font-weight:700;margin-bottom:8px">Administración</div>
      <div class="admin-match-grid">
        <input id="a_date" class="select" placeholder="DD/MM/YYYY" />
        <input id="a_p1a" class="select" placeholder="P1A" />
        <input id="a_p1b" class="select" placeholder="P1B" />
        <input id="a_p2a" class="select" placeholder="P2A" />
        <input id="a_p2b" class="select" placeholder="P2B" />
        <input id="a_s11" class="select" placeholder="s11" />
        <input id="a_s21" class="select" placeholder="s21" />
        <input id="a_s12" class="select" placeholder="s12" />
        <input id="a_s22" class="select" placeholder="s22" />
        <input id="a_s13" class="select" placeholder="s13" />
        <input id="a_s23" class="select" placeholder="s23" />
      </div>
      <label class="admin-format-option" for="a_stb">
        <input id="a_stb" type="checkbox" />
        <span>stb en 3er set</span>
      </label>
      <div style="margin-top:8px">
        <button class="btn" id="adminAddBtn">Agregar partido</button>
      </div>
    </div>

    <div id="tableContainer"></div>

    <div class="vt-acciones">
      <button class="admin-bottom" id="adminBtn"><span class="ms ms--sm" aria-hidden="true">admin_panel_settings</span>Administración</button>
      <button class="btn" id="downloadBtn"><span class="ms ms--sm" aria-hidden="true">download</span>Descargar resultados</button>
      <button class="back-btn" onclick="window.location='/'"><span class="ms ms--sm" aria-hidden="true">arrow_back</span>Atrás</button>
    </div>

  </div>
</div>

<script>
const monthsNames = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre']

let parsedMatches = []
let lastFiltered = []
const ADMIN_KEY = '4F7K9Q2Z'
let isAdmin = false

function parseMatches(raw){
  return (raw || []).map(m=>{
    const parts = (m.date||'').split('/')
    const d = new Date(parseInt(parts[2]||0,10), (parseInt(parts[1]||0,10)-1), parseInt(parts[0]||0,10))
    return Object.assign({}, m, {__date:d})
  }).filter(x=>x.__date && !isNaN(x.__date.getTime()))
}

async function loadData(){
  const isLocal = location.hostname==='localhost' || location.hostname==='127.0.0.1'
  let db = {matches:[]}
  try{
    const url = `/api/read?action=getResults&eventType=ranked,legacy&ts=${Date.now()}`
    const res = await fetch(url)
    db = await res.json()
  }catch(e){ console.error('Could not load results',e) }

  parsedMatches = parseMatches(db.matches || [])
  setupSelectors(parsedMatches)
  await loadPlayerNames()
  applyFilter()
}

function setupSelectors(matches){
  const years = [...new Set(matches.map(m=>m.__date.getFullYear()))].sort((a,b)=>b-a)
  const yearSel = document.getElementById('year')
  yearSel.innerHTML = ''
  if(years.length===0){ const y=new Date().getFullYear(); years.push(y) }
  years.forEach(y=>{ const opt=document.createElement('option'); opt.value=y; opt.innerText=y; yearSel.appendChild(opt) })

  const monthSel = document.getElementById('month')
  monthSel.innerHTML=''
  monthsNames.forEach((name,i)=>{ const opt=document.createElement('option'); opt.value=(i+1); opt.innerText=name; monthSel.appendChild(opt) })

  // default to current month/year
  const now = new Date()
  if(years.includes(now.getFullYear())) yearSel.value = now.getFullYear()
  monthSel.value = now.getMonth()+1
}

async function loadPlayerNames(){
  try{
    const res = await fetch('/api/read?action=getNames&ts=' + Date.now())
    const j = await res.json()
    const sel = document.getElementById('player')
    sel.innerHTML = ''
    const opt = document.createElement('option')
    opt.value = ''
    opt.innerText = 'Todos'
    sel.appendChild(opt)
    ;(j.names || []).forEach(n=>{ const o=document.createElement('option'); o.value = n; o.innerText = n; sel.appendChild(o) })
  }catch(e){ console.error('Could not load player names', e) }
}

function applyFilter(){
  const y = parseInt(document.getElementById('year').value,10)
  const m = parseInt(document.getElementById('month').value,10)
  const player = (document.getElementById('player').value || '').trim().toLowerCase()

  let filtered = parsedMatches.filter(x=> x.__date.getFullYear()===y && (x.__date.getMonth()+1)===m )

  if(player){
    filtered = filtered.filter(x=>{
      return [x.p1a,x.p1b,x.p2a,x.p2b].some(n=> (n||'').toLowerCase().includes(player))
    })
  }

  filtered = filtered.sort((a,b)=>a.__date-b.__date)

  const summary = document.getElementById('summary')
  summary.innerText = `Resultados: ${filtered.length}`

  lastFiltered = filtered

  renderTable(filtered)
}

function renderTable(matches){
  const container = document.getElementById('tableContainer')
  if(matches.length===0){ container.innerHTML = '<div class="muted">No hay resultados para los filtros introducidos</div>'; return }

  const table = document.createElement('table')
  const thead = document.createElement('thead')
  thead.innerHTML = '<tr><th><span class="th-full">Fecha</span><span class="th-day">Día</span></th><th>Jugadores</th><th><span class="th-full-res">Marcador</span></th>' + (isAdmin? '<th>Acciones</th>' : '') + '</tr>'
  table.appendChild(thead)

  const tbody = document.createElement('tbody')

  matches.forEach(m=>{
    const tr = document.createElement('tr')
    const tdDate = document.createElement('td')
    const spanFull = document.createElement('span')
    spanFull.className = 'date-full'
    spanFull.innerText = m.date
    const spanDay = document.createElement('span')
    spanDay.className = 'date-day'
    spanDay.innerText = (m.__date && !isNaN(m.__date.getTime())) ? String(m.__date.getDate()) : m.date
    tdDate.appendChild(spanFull)
    tdDate.appendChild(spanDay)

    const tdPlayers = document.createElement('td')

    // compute set wins
    let team1Sets = 0
    let team2Sets = 0
    for(let i=1;i<=3;i++){
      const aRaw = m['s1'+i]
      const bRaw = m['s2'+i]
      const a = (aRaw!==undefined && aRaw!=='') ? parseInt(aRaw,10) : NaN
      const b = (bRaw!==undefined && bRaw!=='') ? parseInt(bRaw,10) : NaN
      if(!isNaN(a) && !isNaN(b)){
        if(a>b) team1Sets++
        else if(b>a) team2Sets++
      }
    }

    let resultType = 'tie'
    if(team1Sets>=2 && team1Sets>team2Sets) resultType = 'team1'
    else if(team2Sets>=2 && team2Sets>team1Sets) resultType = 'team2'

    function makeTag(name, team){
      const span = document.createElement('span')
      span.className = 'tag'
      if(resultType==='tie') span.classList.add('tie')
      else if(resultType==='team1' && team===1) span.classList.add('win')
      else if(resultType==='team2' && team===2) span.classList.add('win')
      else span.classList.add('lose')
      span.innerText = name
      return span
    }

    // Desktop: individual tags and VS
    const p1aTag = makeTag(m.p1a || '',1); p1aTag.classList.add('desktop-only')
    const p1bTag = makeTag(m.p1b || '',1); p1bTag.classList.add('desktop-only')
    const vs = document.createElement('strong'); vs.className = 'desktop-only'; vs.style.margin = '0 8px'; vs.innerText = 'VS'
    const p2aTag = makeTag(m.p2a || '',2); p2aTag.classList.add('desktop-only')
    const p2bTag = makeTag(m.p2b || '',2); p2bTag.classList.add('desktop-only')
    tdPlayers.appendChild(p1aTag)
    tdPlayers.appendChild(p1bTag)
    tdPlayers.appendChild(vs)
    tdPlayers.appendChild(p2aTag)
    tdPlayers.appendChild(p2bTag)

    // Mobile: single tag per pair with slash, stacked
    const mobileTeam1 = document.createElement('span')
    mobileTeam1.className = 'tag mobile-only'
    mobileTeam1.innerText = `${(m.p1a||'').trim()} / ${(m.p1b||'').trim()}`
    const mobileTeam2 = document.createElement('span')
    mobileTeam2.className = 'tag mobile-only'
    mobileTeam2.innerText = `${(m.p2a||'').trim()} / ${(m.p2b||'').trim()}`
    // color mobile pair tags by result
    if(resultType==='team1'){
      mobileTeam1.classList.add('win')
      mobileTeam2.classList.add('lose')
    }else if(resultType==='team2'){
      mobileTeam1.classList.add('lose')
      mobileTeam2.classList.add('win')
    }else{
      mobileTeam1.classList.add('tie')
      mobileTeam2.classList.add('tie')
    }
    tdPlayers.appendChild(mobileTeam1)
    tdPlayers.appendChild(mobileTeam2)

    const sets = []
    for(let i=1;i<=3;i++){
      const a = m['s1'+i] || ''
      const b = m['s2'+i] || ''
      if(a === '' && b === '') continue
      const score = String(a) + '-' + String(b)
      const display = (String(m.format) === 'bo3_stb' && i === 3) ? `[${score}]` : score
      sets.push(display)
    }
    const tdScore = document.createElement('td')
    const list = document.createElement('div')
    list.className = 'set-list'
    sets.forEach(s=>{
      const it = document.createElement('span')
      it.className = 'set-item'
      it.innerText = String(s).replace(/-/g, '\u2011')
      list.appendChild(it)
    })
    tdScore.appendChild(list)

    tr.appendChild(tdDate)
    tr.appendChild(tdPlayers)
    tr.appendChild(tdScore)

    if(isAdmin){
      const tdAct = document.createElement('td')
      const editBtn = document.createElement('button')
      editBtn.className = 'small-btn'
      editBtn.innerText = 'Editar'
      editBtn.addEventListener('click',()=> startEditRow(tr,m))

      const delBtn = document.createElement('button')
      delBtn.className = 'small-btn'
      delBtn.style.marginLeft='6px'
      delBtn.innerText = 'Eliminar'
      delBtn.addEventListener('click',()=> deleteMatch(m))

      tdAct.appendChild(editBtn)
      tdAct.appendChild(delBtn)
      tr.appendChild(tdAct)
    }

    tbody.appendChild(tr)
  })

  table.appendChild(tbody)
  container.innerHTML = ''
  container.appendChild(table)
}

// also apply filter when selectors change or player selection changes
document.getElementById('year').addEventListener('change', applyFilter)
document.getElementById('month').addEventListener('change', applyFilter)
document.getElementById('player').addEventListener('change', applyFilter)

loadData()

function toggleAdmin(on){
  isAdmin = !!on
  const panel = document.getElementById('adminPanel')
  if(panel) panel.style.display = isAdmin ? 'block' : 'none'
  const btn = document.getElementById('adminBtn')
  if(btn) btn.innerText = isAdmin ? 'Salir admin' : 'Administración'
  renderTable(lastFiltered)
}

// Admin handling
document.getElementById('adminBtn').addEventListener('click', ()=>{
  if(isAdmin){
    toggleAdmin(false)
    return
  }
  const key = prompt('Clave de administrador:')
  if(key===ADMIN_KEY){
    toggleAdmin(true)
  }else{
    alert('Clave incorrecta')
  }
})

document.getElementById('adminAddBtn').addEventListener('click', async ()=>{
  const payload = {
    date: document.getElementById('a_date').value.trim(),
    p1a: document.getElementById('a_p1a').value.trim(),
    p1b: document.getElementById('a_p1b').value.trim(),
    p2a: document.getElementById('a_p2a').value.trim(),
    p2b: document.getElementById('a_p2b').value.trim(),
    s11: document.getElementById('a_s11').value.trim(),
    s21: document.getElementById('a_s21').value.trim(),
    s12: document.getElementById('a_s12').value.trim(),
    s22: document.getElementById('a_s22').value.trim(),
    s13: document.getElementById('a_s13').value.trim(),
    s23: document.getElementById('a_s23').value.trim()
  }

  if (document.getElementById('a_stb')?.checked) {
    payload.format = 'bo3_stb'
  }

  try {
    await fetch('/api/write?action=submitResult', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    })
    loadData()
  } catch (e) {
    console.error(e)
    alert('Error al agregar')
  }
})

async function deleteMatch(m){
  if(!confirm('¿Eliminar este partido?')) return
  try{
    await fetch('/api/write?action=deleteResult',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({date:m.date,p1a:m.p1a,p1b:m.p1b,p2a:m.p2a,p2b:m.p2b})})
    loadData()
  }catch(e){ console.error(e); alert('Error al eliminar') }
}

// Descargar CSV de resultados (botón central)
document.getElementById('downloadBtn').addEventListener('click', ()=>{
  downloadCSV()
})

async function downloadCSV(){
  const res = await fetch("/api/read?action=getResults")
  const db = await res.json()

  if(!db.matches || db.matches.length===0){
    alert("No hay resultados")
    return
  }

  function parseDateStr(s){
    if(!s) return new Date(0)
    if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return new Date(s)
    const parts = String(s).split('/')
    if(parts.length===3){
      const d = parseInt(parts[0],10)||1
      const m = (parseInt(parts[1],10)||1)-1
      const y = parseInt(parts[2],10)||0
      return new Date(y,m,d)
    }
    return new Date(s)
  }

  const matches = (db.matches || []).slice().sort((a,b)=> parseDateStr(a.date) - parseDateStr(b.date))

  const header = [
    "fecha",
    "equipo1_jugA","equipo1_jugB",
    "equipo2_jugA","equipo2_jugB",
    "equipo1_set1","equipo2_set1",
    "equipo1_set2","equipo2_set2",
    "equipo1_set3","equipo2_set3",
    "formato"
  ]

  const rows = matches.map(m=>[
    m.date,
    m.p1a,m.p1b,
    m.p2a,m.p2b,
    m.s11,m.s21,
    m.s12||"",m.s22||"",
    m.s13||"",m.s23||""
  ].map(r => r)
  )

  // append formato column value per match
  const rowsWithFormat = matches.map(m=>[
    m.date,
    m.p1a,m.p1b,
    m.p2a,m.p2b,
    m.s11,m.s21,
    m.s12||"",m.s22||"",
    m.s13||"",m.s23||"",
    m.format || ''
  ])

  const csvContent = [header,...rowsWithFormat].map(r=>r.join(";")).join("\n")

  const bom = '\uFEFF'
  const blob = new Blob([bom + csvContent], {type:"text/csv;charset=utf-8"})
  const url = URL.createObjectURL(blob)

  const a = document.createElement('a')
  a.href = url
  a.download = 'resultados.csv'
  a.click()
  URL.revokeObjectURL(url)
}


function startEditRow(tr,m){
  // replace row with editable inputs
  tr.innerHTML = ''

  const tdDate = document.createElement('td')
  const inDate = document.createElement('input')
  inDate.value = m.date || ''
  inDate.className = 'select'
  tdDate.appendChild(inDate)

  const tdPlayers = document.createElement('td')
  const inP1a = document.createElement('input'); inP1a.className='select'; inP1a.value=m.p1a||''
  const inP1b = document.createElement('input'); inP1b.className='select'; inP1b.value=m.p1b||''
  const inP2a = document.createElement('input'); inP2a.className='select'; inP2a.value=m.p2a||''
  const inP2b = document.createElement('input'); inP2b.className='select'; inP2b.value=m.p2b||''
  tdPlayers.appendChild(inP1a); tdPlayers.appendChild(inP1b); tdPlayers.appendChild(document.createElement('br'))
  tdPlayers.appendChild(inP2a); tdPlayers.appendChild(inP2b)

  const tdScore = document.createElement('td')
  const inS11=document.createElement('input'); inS11.className='select'; inS11.value = m.s11||''
  const inS21=document.createElement('input'); inS21.className='select'; inS21.value = m.s21||''
  const inS12=document.createElement('input'); inS12.className='select'; inS12.value = m.s12||''
  const inS22=document.createElement('input'); inS22.className='select'; inS22.value = m.s22||''
  const inS13=document.createElement('input'); inS13.className='select'; inS13.value = m.s13||''
  const inS23=document.createElement('input'); inS23.className='select'; inS23.value = m.s23||''
  const scoreWrap=document.createElement('div')
  scoreWrap.style.display='grid'
  scoreWrap.style.gridTemplateColumns='repeat(3,1fr)'
  scoreWrap.style.gap='6px'
  scoreWrap.appendChild(inS11); scoreWrap.appendChild(inS12); scoreWrap.appendChild(inS13)
  scoreWrap.appendChild(inS21); scoreWrap.appendChild(inS22); scoreWrap.appendChild(inS23)
  tdScore.appendChild(scoreWrap)

  const tdAct = document.createElement('td')
  const saveBtn = document.createElement('button'); saveBtn.className='btn'; saveBtn.innerText='Guardar'
  const cancelBtn = document.createElement('button'); cancelBtn.className='small-btn'; cancelBtn.innerText='Cancelar'

  saveBtn.addEventListener('click', async ()=>{
    const payload = {
      date: inDate.value.trim(),
      p1a: inP1a.value.trim(), p1b: inP1b.value.trim(), p2a: inP2a.value.trim(), p2b: inP2b.value.trim(),
      s11: inS11.value.trim(), s12: inS12.value.trim(), s13: inS13.value.trim(),
      s21: inS21.value.trim(), s22: inS22.value.trim(), s23: inS23.value.trim(),
      _original: { date: m.date, p1a: m.p1a, p1b: m.p1b, p2a: m.p2a, p2b: m.p2b }
    }
    try{
      await fetch('/api/write?action=submitResult',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)})
      loadData()
    }catch(e){ console.error(e); alert('Error al guardar') }
  })

  cancelBtn.addEventListener('click', ()=>{
    renderTable(lastFiltered)
  })

  tdAct.appendChild(saveBtn); tdAct.appendChild(cancelBtn)

  tr.appendChild(tdDate); tr.appendChild(tdPlayers); tr.appendChild(tdScore); tr.appendChild(tdAct)
}
</script>
