<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Tablón de avisos</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/front/comun/theme.css">
<link rel="icon" href="/image.png" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest" crossorigin="use-credentials">
<script src="/front/comun/splash.js"></script>
<script src="/front/comun/pwa.js" defer></script>
<script src="/front/comun/auth-client.js" defer></script>
<script src="/front/comun/vt-cargando.js"></script>
<meta name="apple-mobile-web-app-title" content="Viboras">
<meta name="theme-color" content="#121316">

<style>
.aviso-pie{font-size:13px;color:var(--vt-muted);margin:0 0 var(--vt-md)}

/* Panel de administracion: la cabecera con el boton, y debajo el formulario
   que se despliega. */
.panel-cabeza{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:var(--vt-sm)}
.panel-cabeza h4{margin:0}
.panel-form{margin-top:var(--vt-md);padding-top:var(--vt-md);border-top:1px solid var(--vt-border);display:flex;flex-direction:column;gap:var(--vt-md)}
.panel-form[hidden]{display:none}
.panel-botones{display:flex;flex-wrap:wrap;gap:var(--vt-sm)}
/* `.vt-btn` trae `display:inline-flex`, que gana al `display:none` que el
   navegador le da a `[hidden]`: sin esto, esconder un boton no lo esconde. */
.vt-btn[hidden]{display:none}

/* Foto: el recuadro de subir y la vista previa. */
.foto-caja{display:flex;flex-wrap:wrap;align-items:center;gap:var(--vt-sm)}
.foto-previa{max-width:100%;max-height:180px;border-radius:var(--vt-r);border:1px solid var(--vt-border);display:block}
.foto-previa[hidden]{display:none}

/* Filtros por categoria. */
.filtros{display:flex;flex-wrap:wrap;gap:var(--vt-sm)}
.filtro{
  padding:7px 14px;
  background:var(--vt-surface-3);color:var(--vt-text);
  border:1px solid var(--vt-border-strong);border-radius:var(--vt-r);
  font-family:var(--vt-font-body);font-size:13px;font-weight:600;cursor:pointer;
  text-transform:uppercase;letter-spacing:0.04em;
}
.filtro[aria-pressed="true"]{background:var(--vt-gold);border-color:var(--vt-gold);color:var(--vt-bg);font-weight:700}

/* Un aviso. La categoria «Importante» se marca en rojo por el borde, como en
   la maqueta: es el unico color distinto. */
.aviso{
  background:var(--vt-surface);
  border:1px solid var(--vt-border);
  border-radius:var(--vt-r-lg);
  padding:var(--vt-md);
  display:flex;flex-direction:column;gap:var(--vt-sm);
}
.aviso--importante{border-left:4px solid var(--vt-error)}
.aviso__cabeza{display:flex;flex-wrap:wrap;align-items:center;gap:var(--vt-xs) var(--vt-sm)}
.aviso__cuando{font-size:13px;color:var(--vt-muted)}
.aviso__herramientas{display:flex;gap:var(--vt-xs);margin-left:auto}
.aviso__titulo{
  margin:0;
  font-family:var(--vt-font-head);
  font-size:22px;line-height:26px;font-weight:700;letter-spacing:0.02em;
  text-transform:uppercase;color:var(--vt-text-strong);
}
.aviso__foto{width:100%;height:auto;max-height:70vh;object-fit:contain;border-radius:var(--vt-r);border:1px solid var(--vt-border);display:block;cursor:zoom-in}
/* El visor entra y sale con un fundido corto: un <dialog> modal aparece de
   golpe, y a pantalla completa el salto se nota. `display` y `overlay` solo
   se animan con `allow-discrete`, y `@starting-style` da el primer fotograma;
   donde no existan (Safari < 17.4) el visor abre igual, sin fundido. El
   cierre lo retira `abrirVisor()` cuando el fundido ha terminado. */
.visor{
  width:100vw;max-width:100vw;height:100dvh;max-height:100dvh;
  margin:0;padding:0;border:0;background:transparent;overflow:hidden;
  opacity:0;transform:scale(.97);
  transition:opacity .18s ease,transform .18s ease,overlay .18s ease allow-discrete,display .18s ease allow-discrete;
}
.visor[open]{opacity:1;transform:scale(1)}
@starting-style{.visor[open]{opacity:0;transform:scale(.97)}}
.visor::backdrop{
  background:rgba(0,0,0,0);
  transition:background .18s ease,overlay .18s ease allow-discrete,display .18s ease allow-discrete;
}
.visor[open]::backdrop{background:rgba(0,0,0,0.92)}
@starting-style{.visor[open]::backdrop{background:rgba(0,0,0,0)}}
/* `touch-action:none` porque el pellizco lo lleva `activarPellizco()`: el
   navegador no hace zoom dentro de un <dialog> de la top layer, y sin esto
   se queda a medias entre su gesto y el nuestro. */
.visor__foto{
  width:100%;height:100%;object-fit:contain;display:block;cursor:zoom-out;
  touch-action:none;user-select:none;-webkit-user-select:none;
}
@media(prefers-reduced-motion:reduce){
  .visor,.visor::backdrop{transition:none}
}
.aviso__texto{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--vt-text)}
.aviso__autor{
  margin:0;padding-top:var(--vt-sm);border-top:1px solid var(--vt-border);
  font-size:13px;color:var(--vt-muted);
  display:flex;flex-wrap:wrap;align-items:center;gap:var(--vt-xs)
}
.lista{display:flex;flex-direction:column;gap:var(--vt-md)}
.estado{font-size:14px;color:var(--vt-muted);min-height:20px}
</style>
</head>

<body>
<nav class="vt-nav" aria-label="Navegación principal">
<div class="vt-nav__lista">
<a class="vt-nav__item" href="/"><span class="vt-nav__icono"><span class="ms notranslate" translate="no" aria-hidden="true">home</span></span><span class="vt-nav__texto">Inicio</span></a>
<a class="vt-nav__item" href="/history"><span class="vt-nav__icono"><span class="ms notranslate" translate="no" aria-hidden="true">emoji_events</span></span><span class="vt-nav__texto">Partidos</span></a>
<a class="vt-nav__item" href="/tablon" aria-current="page"><span class="vt-nav__icono"><span class="ms notranslate" translate="no" aria-hidden="true">notifications</span></span><span class="vt-nav__texto">Avisos</span></a>
<a class="vt-nav__item" href="/comunidad"><span class="vt-nav__icono"><span class="ms notranslate" translate="no" aria-hidden="true">group</span></span><span class="vt-nav__texto">Comunidad</span></a>
<a class="vt-nav__item" href="/cuenta"><span class="vt-nav__icono"><span class="ms notranslate" translate="no" aria-hidden="true">person</span></span><span class="vt-nav__texto">Perfil</span></a>
</div>
</nav>

<div class="vt-page vt-page--narrow">

  <div style="text-align:center">
    <img src="/image.png" alt="Víboras Team" width="88" height="88" style="border-radius:var(--vt-r-lg);filter:drop-shadow(0 4px 16px rgba(245,158,11,0.25))">
    <h3 class="vt-gold" style="margin-top:var(--vt-sm)">Tablón de avisos</h3>
    <span class="vt-label">Comunicados oficiales de Víboras Team</span>
  </div>

  <div class="vt-card vt-card--accent" id="panel" hidden>
    <div class="panel-cabeza">
      <h4><span class="ms ms--sm notranslate" translate="no" aria-hidden="true">verified_user</span> Panel de administración</h4>
      <button class="vt-btn vt-btn--sm" type="button" id="btnNuevo">Nuevo aviso</button>
    </div>
    <div class="panel-form" id="formulario" hidden>
      <div class="vt-field">
        <label for="titulo">Título del aviso</label>
        <input class="vt-input" id="titulo" type="text" maxlength="120" placeholder="Cambio de horarios de pistas">
      </div>
      <div class="vt-field">
        <label for="categoria">Categoría</label>
        <select class="vt-select" id="categoria"></select>
      </div>
      <div class="vt-field">
        <label for="texto">Mensaje</label>
        <textarea class="vt-textarea" id="texto" maxlength="4000" rows="4" placeholder="Lo que verá todo el grupo"></textarea>
      </div>
      <div class="vt-field">
        <label for="foto">Foto (opcional)</label>
        <div class="foto-caja">
          <input id="foto" type="file" accept="image/jpeg,image/png,image/webp">
          <button class="vt-btn vt-btn--ghost vt-btn--sm" type="button" id="btnQuitarFoto" hidden>Quitar la foto</button>
        </div>
        <img class="foto-previa" id="previa" alt="Vista previa de la foto del aviso" hidden>
        <small class="estado" id="estadoFoto"></small>
      </div>
      <div class="panel-botones">
        <button class="vt-btn" type="button" id="btnPublicar">Publicar aviso</button>
        <button class="vt-btn vt-btn--ghost" type="button" id="btnCancelar">Cancelar</button>
      </div>
      <div class="estado" id="estadoForm" role="status"></div>
    </div>
  </div>

  <div class="vt-card">
    <div class="filtros" id="filtros" role="group" aria-label="Filtrar por categoría"></div>
    <div class="lista" id="lista" style="margin-top:var(--vt-md)"><p class="estado">Cargando…</p></div>
  </div>

  <div style="text-align:center">
    <a class="vt-btn vt-btn--ghost" href="/">Volver al inicio</a>
  </div>
</div>

<script src="/front/pantallas/tablon/tablon.js"></script>

</body>
</html>
