<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buzón de quejas y sugerencias</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/front/comun/theme.css">
<link rel="icon" href="/image.png" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest" crossorigin="use-credentials">
<script src="/front/comun/splash.js"></script>
<script src="/front/comun/pwa.js" defer></script>
<script src="/front/comun/auth-client.js" defer></script>
<script src="/front/comun/vt-cargando.js"></script>
<meta name="apple-mobile-web-app-title" content="Viboras">
<meta name="theme-color" content="#121316">

<style>
.tipos{display:flex;gap:var(--vt-xs);margin-bottom:var(--vt-md)}
.tipo{
  flex:1 1 0;min-width:0;padding:10px 8px;
  background:var(--vt-surface-3);color:var(--vt-text);
  border:1px solid var(--vt-border-strong);border-radius:var(--vt-r);
  font-family:var(--vt-font-body);font-size:15px;cursor:pointer;
}
.tipo[aria-pressed="true"]{background:var(--vt-gold);border-color:var(--vt-gold);color:var(--vt-bg);font-weight:700}
.vt-textarea{min-height:140px;resize:vertical}
.cuenta-letras{font-size:12px;color:var(--vt-faint);text-align:right;margin-top:4px}
.estado{margin-top:var(--vt-sm);font-size:14px;color:var(--vt-muted);min-height:20px}
.aviso{font-size:14px;color:var(--vt-muted);margin:0 0 var(--vt-md)}
.mensaje{padding:var(--vt-md) 0;border-bottom:1px solid var(--vt-border)}
.mensaje:last-child{border-bottom:0}
.mensaje__cabeza{display:flex;flex-wrap:wrap;align-items:center;gap:var(--vt-xs) var(--vt-sm);margin-bottom:var(--vt-xs)}
.mensaje__quien{font-weight:600;color:var(--vt-text-strong);overflow-wrap:anywhere}
.mensaje__cuando{font-size:13px;color:var(--vt-muted)}
.mensaje__texto{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.mensaje--nuevo .mensaje__quien::before{content:"● ";color:var(--vt-gold)}
.mensaje__pie{margin-top:var(--vt-sm);display:flex;flex-wrap:wrap;align-items:center;gap:var(--vt-xs) var(--vt-sm)}
.mensaje__procesado{font-size:13px;color:var(--vt-success);overflow-wrap:anywhere}
</style>
</head>

<body>
<nav class="vt-nav" aria-label="Navegación principal">
<div class="vt-nav__lista">
<a class="vt-nav__item" href="/"><span class="vt-nav__icono"><span class="ms notranslate" translate="no" aria-hidden="true">home</span></span><span class="vt-nav__texto">Inicio</span></a>
<a class="vt-nav__item" href="/history"><span class="vt-nav__icono"><span class="ms notranslate" translate="no" aria-hidden="true">emoji_events</span></span><span class="vt-nav__texto">Partidos</span></a>
<a class="vt-nav__item" href="/comunidad"><span class="vt-nav__icono"><span class="ms notranslate" translate="no" aria-hidden="true">group</span></span><span class="vt-nav__texto">Comunidad</span></a>
<a class="vt-nav__item" href="/rating"><span class="vt-nav__icono"><span class="ms notranslate" translate="no" aria-hidden="true">query_stats</span></span><span class="vt-nav__texto">Rendimiento</span></a>
<a class="vt-nav__item" href="/buzon" aria-current="page"><span class="vt-nav__icono"><span class="ms notranslate" translate="no" aria-hidden="true">feedback</span></span><span class="vt-nav__texto">Buzón</span></a>
</div>
</nav>

<div class="vt-page">

  <div style="text-align:center">
    <img src="/image.png" alt="Víboras Team" width="88" height="88" style="border-radius:var(--vt-r-lg);filter:drop-shadow(0 4px 16px rgba(245,158,11,0.25))">
    <h3 class="vt-gold" style="margin-top:var(--vt-sm)">Víboras Team</h3>
    <span class="vt-label">Buzón de quejas y sugerencias</span>
  </div>

  <div class="vt-card vt-card--accent">
    <p class="aviso">Lo que escribas aquí solo lo leen los administradores, y verán tu nombre.</p>
    <div class="tipos" role="group" aria-label="Tipo de mensaje">
      <button class="tipo" type="button" data-tipo="queja" aria-pressed="false">Queja</button>
      <button class="tipo" type="button" data-tipo="sugerencia" aria-pressed="false">Sugerencia</button>
    </div>
    <div class="vt-field">
      <label for="texto">Tu mensaje</label>
      <textarea id="texto" class="vt-textarea" maxlength="2000" placeholder="Cuéntanos qué pasa o qué mejorarías"></textarea>
      <div class="cuenta-letras" id="letras">0 / 2000</div>
    </div>
    <button class="vt-btn" type="button" id="enviar" style="margin-top:var(--vt-md)">Enviar</button>
    <div class="estado" id="estado" role="status"></div>
  </div>

  <div class="vt-card" id="recibidos" hidden>
    <h4 style="margin-top:0">Recibidos</h4>
    <div id="lista"><p class="estado">Cargando…</p></div>
  </div>

  <div style="text-align:center;margin-top:var(--vt-lg)">
    <a class="vt-btn vt-btn--ghost" id="volver" href="/">Volver al inicio</a>
  </div>
</div>

<script src="/front/pantallas/buzon/buzon.js"></script>

</body>
</html>
