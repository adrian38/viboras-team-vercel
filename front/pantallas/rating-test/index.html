<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rating Test</title>
<link rel="icon" href="/image.png" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest" crossorigin="use-credentials">
<script src="/front/comun/splash.js"></script>
<script src="/front/comun/pwa.js" defer></script>
<script src="/front/comun/vt-nav.js" defer></script>
<script src="/front/comun/auth-client.js" defer></script>
<script src="/front/comun/vt-cargando.js"></script>
<script src="/front/comun/vt-glicko.js"></script>
<meta name="apple-mobile-web-app-title" content="Viboras">
<meta name="theme-color" content="#121316">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/front/comun/theme.css">
<style>
/* Pagina de pruebas del motor, sin maqueta propia. Se deriva de rating.html:
   mismos tokens y la misma tabla, con el banco de pruebas en monoespaciada.
   Los controles de "Importar real" llevan su color en linea, de ahi los
   selectores por id mas abajo. */
:root {
  --muted: var(--vt-muted);
}

.block {
  background: var(--vt-surface);
  border: 1px solid var(--vt-border);
  border-radius: var(--vt-r-xl);
  padding: var(--vt-lg);
  box-shadow: var(--vt-shadow-card);
}

h1 { margin: 0 0 var(--vt-sm); }

.description {
  color: var(--vt-muted);
  margin: 0 0 var(--vt-md);
  line-height: 1.5;
}

textarea {
  width: 100%;
  min-height: 220px;
  resize: vertical;
  border: 1px solid var(--vt-border-strong);
  border-radius: var(--vt-r);
  padding: 14px 16px;
  font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
  font-size: 13px;
  line-height: 1.6;
  background: var(--vt-surface-deep);
  color: var(--vt-text);
}
textarea:focus { outline: none; border-color: var(--vt-gold); }

.controls {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  margin: var(--vt-md) 0 var(--vt-lg);
}

button {
  border: 1px solid transparent;
  border-radius: var(--vt-r);
  padding: 10px 18px;
  font: inherit;
  font-weight: 700;
  cursor: pointer;
  transition: background .15s ease, border-color .15s ease, color .15s ease;
}

.calculate-btn {
  background: var(--vt-gold);
  color: var(--vt-bg);
  letter-spacing: 0.02em;
}
.calculate-btn:hover { background: var(--vt-yellow); }

/* "Importar real" y su selector de fecha traen color en linea desde el
   marcado, asi que aqui hace falta !important para ganarles. */
#importRealBtn {
  background: var(--vt-surface-3) !important;
  border: 1px solid var(--vt-border-strong) !important;
  color: var(--vt-text) !important;
}
#importRealBtn:hover { border-color: var(--vt-gold) !important; color: var(--vt-gold-light) !important; }
#importDate {
  background: var(--vt-surface-deep) !important;
  border: 1px solid var(--vt-border-strong) !important;
  color: var(--vt-text) !important;
}
#importDate option { background: var(--vt-surface-2); }
.controls label { color: var(--vt-muted) !important; }

.result-box {
  margin-top: var(--vt-lg);
  border-radius: var(--vt-r-lg);
  border: 1px solid var(--vt-border);
  background: var(--vt-surface-2);
  padding: var(--vt-md);
}

table {
  width: 100%;
  border-collapse: collapse;
}

th {
  padding: 10px 8px;
  color: var(--vt-muted);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  text-align: left;
  border-bottom: 1px solid var(--vt-border-strong);
}

td {
  padding: 9px 8px;
  border-bottom: 1px solid var(--vt-border);
  color: var(--vt-text);
  text-align: left;
}
tbody tr:last-child td { border-bottom: none; }

td:nth-child(2), th:nth-child(2) { text-align: center; }
td:nth-child(3), th:nth-child(3) { text-align: right; }
/* Las columnas son Jugador, Rating y RD: el oro va en la segunda, que es el
   rating, igual que en rating.html. La tercera es la incertidumbre y se
   queda en gris. */
td:nth-child(2) {
  font-family: var(--vt-font-head);
  font-size: 18px;
  font-weight: 700;
  color: var(--vt-gold);
  font-variant-numeric: tabular-nums;
}
td:nth-child(3) { color: var(--vt-muted); font-variant-numeric: tabular-nums; }

.name-cell { font-weight: 500; }

.muted { color: var(--vt-muted); }

.empty-state {
  color: var(--vt-muted);
  margin: 0;
}

@media (max-width: 720px) {
  .block { padding: var(--vt-md); }
  .controls { flex-direction: column; align-items: stretch; gap: var(--vt-sm); }
}
</style>
</head>
<body>
<div class="vt-page">
  <div class="block vt-card--accent" style="overflow:hidden">
    <span class="vt-label vt-gold">Banco de pruebas del motor</span>
    <h1 style="margin-top:var(--vt-xs)">Rating test</h1>
    <p class="description">
      Cada línea es un partido, cada línea en blanco indica un nuevo día. El formato es:<br>
      pareja1_a, pareja1_b, pareja2_a, pareja2_b, w1, set1, set2, set3
    </p>

    <textarea id="resultsInput" spellcheck="false">A,B,C,D,0.6,8-5
E,F,A,B,1,3-6,6-4,7-5
A,C,E,G,1,6-2,1-6,[10-5]

B,D,F,H,1,6-3,7-6
H,I,J,A,0.3,3-5</textarea>

    <div class="controls" style="justify-content: space-between; gap: 12px;">
      <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
        <button id="importRealBtn" type="button" style="background:var(--vt-surface-3); color:var(--vt-text); border:1px solid var(--vt-border-strong); border-radius:8px; padding:10px 16px; font:inherit; font-weight:700; cursor:pointer;">Importar real</button>
        <label style="display:flex; align-items:center; gap:8px; color:var(--vt-muted); font-weight:600;">
          <span>Fecha:</span>
          <select id="importDate" style="padding:8px 10px; border-radius:8px; border:1px solid var(--vt-border-strong); background:var(--vt-surface-2); color:var(--vt-text); font:inherit;"></select>
        </label>
      </div>
      <button class="calculate-btn" id="calculateBtn" type="button">Calcular</button>
    </div>

    <div class="result-box" id="resultBox">
      <p class="empty-state">Pulsa “Calcular” para generar el rating.</p>
    </div>
  </div>
</div>

<script src="/front/pantallas/rating-test/rating-test.js"></script>
</body>
</html>
