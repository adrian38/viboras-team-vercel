<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Ranking</title>
<link rel="icon" href="/image.png" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest" crossorigin="use-credentials">
<script src="/front/comun/splash.js"></script>
<script src="/front/comun/pwa.js" defer></script>
<script src="/front/comun/auth-client.js" defer></script>
<script src="/front/comun/vt-cargando.js"></script>
<script src="/front/comun/vt-glicko.js"></script>
<meta name="apple-mobile-web-app-title" content="Viboras">
<meta name="theme-color" content="#121316">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/front/comun/theme.css">
<style>
.controls{
  display:flex;
  align-items:center;
  gap:var(--vt-md);
  margin-bottom:var(--vt-md);
  padding:var(--vt-sm) var(--vt-md);
  background:var(--vt-surface-2);
  border:1px solid var(--vt-border);
  border-radius:var(--vt-r-lg);
  font-size:13px;
  color:var(--vt-text);
}

.table-container{
  border-radius:var(--vt-r-lg);
  border:1px solid var(--vt-border);
  overflow-x:auto;
}
table{width:100%;border-collapse:collapse;margin:0}
th{
  padding:10px;
  background:var(--vt-surface-3);
  color:var(--vt-muted);
  font-size:11px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;
  text-align:left;white-space:nowrap;
  border-bottom:1px solid var(--vt-border-strong);
}
td{padding:9px 10px;border-bottom:1px solid var(--vt-border);color:var(--vt-text);vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr:hover td{background:var(--vt-surface-2)}

.rank-col{width:64px;text-align:center}
.name-col{font-weight:500;color:var(--vt-text)}
/* Los puntos son el dato de la pagina. */
td.points-col{
  width:96px;text-align:right;
  font-family:var(--vt-font-head);
  font-size:19px;font-weight:700;
  color:var(--vt-gold);
  font-variant-numeric:tabular-nums;
}
th.points-col{text-align:right}
.detail-col{width:90px;text-align:center;color:var(--vt-muted);font-variant-numeric:tabular-nums}

/* Medalla del podio, igual que en torneos y ligas. processRanking() pone
   pos-1, pos-2 o pos-3 segun el puesto, y pos-x para el resto: con empates
   hay dos segundos y ningun tercero, asi que no vale contar filas. */
.pos-badge{
  display:inline-flex;
  width:30px;height:30px;
  border-radius:var(--vt-r-full);
  align-items:center;justify-content:center;
  background:transparent;
  color:var(--vt-muted);
  font-family:var(--vt-font-head);
  font-size:16px;font-weight:700;
}
.pos-badge.pos-1{background:var(--vt-gold);color:var(--vt-bg);box-shadow:0 0 14px -2px rgba(245,158,11,0.5)}
.pos-badge.pos-2{background:var(--vt-silver);color:var(--vt-bg)}
.pos-badge.pos-3{background:var(--vt-bronze);color:var(--vt-bg)}

/* Lógica visual de las columnas de detalle */
.hide-detail .detail-col { display: none; }

.muted{color:var(--vt-muted)}

.info-btn{
  padding:9px 16px;
  background:transparent;
  border:1px solid var(--vt-border-gold);
  border-radius:var(--vt-r);
  color:var(--vt-gold-light);
  font-family:var(--vt-font-body);
  font-size:14px;font-weight:700;
  cursor:pointer;
  transition:background .15s ease,border-color .15s ease;
}
.info-btn:hover{background:rgba(245,158,11,0.12);border-color:var(--vt-gold)}

/* Las tres categorias. Una fila de pestanas que en el movil se desplaza de
   lado en vez de partirse en dos lineas. */
.cat-tabs{
  display:flex;
  gap:var(--vt-xs);
  margin-bottom:var(--vt-md);
  padding:4px;
  background:var(--vt-surface-2);
  border:1px solid var(--vt-border);
  border-radius:var(--vt-r-lg);
  overflow-x:auto;
}
.cat-tab{
  flex:1 1 auto;
  padding:8px 14px;
  background:transparent;
  border:0;
  border-radius:var(--vt-r);
  color:var(--vt-muted);
  font-family:var(--vt-font-body);
  font-size:13px;font-weight:700;
  white-space:nowrap;
  cursor:pointer;
  transition:background .15s ease,color .15s ease;
}
.cat-tab:hover{color:var(--vt-gold-light)}
.cat-tab.is-active{background:var(--vt-surface-4);color:var(--vt-gold)}

.periodo{
  display:inline-block;
  margin-bottom:var(--vt-md);
  padding:3px 12px;
  border-radius:var(--vt-r-full);
  background:rgba(245,158,11,0.10);
  border:1px solid var(--vt-border-gold);
  color:var(--vt-gold-light);
  font-size:11px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;
}

@media(max-width:720px){
  th,td{padding:8px 6px;font-size:13px}
  td.points-col{font-size:16px;width:70px}
  .rank-col{width:44px}
  .pos-badge{width:26px;height:26px;font-size:14px}
}
</style>
</head>
<body>
<nav class="vt-nav" aria-label="Navegación principal">
<div class="vt-nav__lista">
<a class="vt-nav__item" href="/"><span class="vt-nav__icono"><span class="ms notranslate" translate="no" aria-hidden="true">home</span></span><span class="vt-nav__texto">Inicio</span></a>
<a class="vt-nav__item" href="/history"><span class="vt-nav__icono"><span class="ms notranslate" translate="no" aria-hidden="true">emoji_events</span></span><span class="vt-nav__texto">Partidos</span></a>
<a class="vt-nav__item" href="/tablon"><span class="vt-nav__icono"><span class="ms notranslate" translate="no" aria-hidden="true">notifications</span><span class="vt-nav__num" hidden></span></span><span class="vt-nav__texto">Avisos</span></a>
<a class="vt-nav__item" href="/comunidad"><span class="vt-nav__icono"><span class="ms notranslate" translate="no" aria-hidden="true">group</span></span><span class="vt-nav__texto">Comunidad</span></a>
<a class="vt-nav__item" href="/cuenta"><span class="vt-nav__icono"><span class="ms notranslate" translate="no" aria-hidden="true">person</span></span><span class="vt-nav__texto">Perfil</span></a>
</div>
</nav>

<div class="vt-page">

  <div class="vt-cabecera">
    <button class="vt-volver" type="button" onclick="window.location='/'"><span class="ms ms--sm notranslate" translate="no" aria-hidden="true">arrow_back</span>Atrás</button>
    <img src="/image.png" alt="Víboras Team" width="88" height="88" style="border-radius:var(--vt-r-lg);filter:drop-shadow(0 4px 16px rgba(245,158,11,0.25))">
    <h1 class="vt-gold" style="margin-top:var(--vt-sm)">Ranking oficial de jugadores</h1>
    <span class="vt-label">Circuito oficial · Víboras Pádel</span>
  </div>

  <div class="vt-card vt-card--accent">

    <!-- Header con el Checkbox -->
    <div class="controls">
      <label style="cursor: pointer; display: flex; align-items: center; gap: 8px;">
        <input type="checkbox" id="toggleDetail" onchange="toggleColumns()">
        <span>Ver detalle</span>
      </label>
    </div>

    <!-- Periodo Actual. El texto lo pone ranking.js desde PERIODO, que es
         lo mismo que filtra los tres calculos. -->
    <div class="periodo" id="periodo"></div>

    <!-- Las tres categorias del reglamento. Cada una es una clasificacion
         aparte, con su propio podium. -->
    <div class="cat-tabs" role="tablist" aria-label="Categoría del ranking">
      <button class="cat-tab is-active" type="button" role="tab" aria-selected="true" data-cat="actividad" onclick="cambiarCategoria('actividad')">Actividad</button>
      <button class="cat-tab" type="button" role="tab" aria-selected="false" data-cat="fairplay" onclick="cambiarCategoria('fairplay')">Fair play</button>
      <button class="cat-tab" type="button" role="tab" aria-selected="false" data-cat="revelacion" onclick="cambiarCategoria('revelacion')">Revelación</button>
    </div>

    <!-- Contenedor del Ranking -->
    <div class="table-container">
      <table id="rankingTable" class="hide-detail" aria-label="Ranking">
        <thead id="rankingHead"></thead>
        <tbody id="rankingBody">
          <tr><td colspan="5" class="muted" style="text-align:center; padding: 24px;">Cargando ranking…</td></tr>
        </tbody>
      </table>
    </div>

    <!-- Footer -->
    <div class="vt-acciones">
      <button class="info-btn" onclick="window.location.href='/ranking-info'">
        <span class="ms ms--sm notranslate" translate="no" aria-hidden="true">lightbulb</span>¿Cómo funciona el ranking?
      </button>
    </div>

  </div>
</div>

<script src="/front/comun/nivel-votos.js"></script>
<script src="/front/comun/rating-inicial.js"></script>
<script src="/front/pantallas/ranking/ranking.js"></script>

</body>
</html>
