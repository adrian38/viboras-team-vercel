<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>El partido</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/front/comun/theme.css">
<link rel="icon" href="/image.png" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest" crossorigin="use-credentials">
<script src="/front/comun/splash.js"></script>
<script src="/front/comun/pwa.js" defer></script>
<script src="/front/comun/auth-client.js" defer></script>
<script src="/front/comun/vt-cargando.js"></script>
<meta name="apple-mobile-web-app-title" content="Viboras">
<meta name="theme-color" content="#121316">

<style>
/* Aqui el partido es lo unico que hay, asi que la fecha manda mas que en una
   tarjeta de la lista. */
#tarjeta .vt-partido__cuando{font-size:28px;line-height:32px}
.acciones{display:flex;flex-direction:column;gap:var(--vt-sm)}
.menores{display:flex;justify-content:center;gap:var(--vt-md);flex-wrap:wrap}
#incorporar[hidden]{display:none}
#incorporar .vt-field{margin-bottom:var(--vt-md)}
</style>
</head>

<body>
<nav class="vt-nav" aria-label="Navegación principal">
<div class="vt-nav__lista">
<a class="vt-nav__item" href="/"><span class="vt-nav__icono"><span class="ms notranslate" translate="no" aria-hidden="true">home</span></span><span class="vt-nav__texto">Inicio</span></a>
<a class="vt-nav__item" href="/tablon"><span class="vt-nav__icono"><span class="ms notranslate" translate="no" aria-hidden="true">notifications</span><span class="vt-nav__num" hidden></span></span><span class="vt-nav__texto">Avisos</span></a>
<a class="vt-nav__item vt-nav__item--destacado" href="/partidos" aria-current="page"><span class="vt-nav__icono"><span class="ms notranslate" translate="no" aria-hidden="true">sports_tennis</span><span class="vt-nav__num" hidden></span></span><span class="vt-nav__texto">Partidos</span></a>
<a class="vt-nav__item" href="/comunidad"><span class="vt-nav__icono"><span class="ms notranslate" translate="no" aria-hidden="true">group</span></span><span class="vt-nav__texto">Comunidad</span></a>
<a class="vt-nav__item" href="/cuenta"><span class="vt-nav__icono"><span class="ms notranslate" translate="no" aria-hidden="true">person</span></span><span class="vt-nav__texto">Perfil</span></a>
</div>
</nav>

<div class="vt-page vt-page--narrow">

  <button type="button" class="vt-btn vt-btn--quiet vt-btn--sm" id="atras" style="align-self:flex-start">
    <span class="ms ms--sm notranslate" translate="no" aria-hidden="true">arrow_back</span><span id="atrasTexto">Mis partidos</span>
  </button>

  <!-- Un partido y nada mas: aqui se aterriza desde un enlace de WhatsApp o
       desde un push, sin contexto ninguno. Lo rellena partido.js. -->
  <article class="vt-card vt-partido" id="tarjeta"></article>

  <p class="vt-nota-aviso" id="nota" hidden>
    <span class="ms notranslate" translate="no" aria-hidden="true">info</span>
    <span id="notaTexto"></span>
  </p>

  <!-- El panel de «apuntar a alguien», solo para el organizador. Lo rellena
       partido.js y nace vacio: sin lista no se pinta nada. -->
  <div class="vt-card" id="incorporar" hidden></div>

  <div class="acciones" id="acciones"></div>
  <div class="menores" id="menores"></div>

</div>

<script src="/front/comun/vt-partido-tarjeta.js"></script>
<script src="/front/comun/vt-partido-compartir.js"></script>
<script src="/front/pantallas/partido/partido.js"></script>
</body>
</html>
