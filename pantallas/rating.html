<link rel="apple-touch-icon" href="/apple-touch-icon.png">

<style>
/* Las cuatro categorias y sus clases .tier-<key> estan descritas en
   ai_context/categorias_de_rating.md: cada una necesita su pareja de reglas
   o sale gris sin dar error. Siguen siendo cuatro. */

.controls{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:var(--vt-md);
  flex-wrap:wrap;
  margin-bottom:var(--vt-md);
  padding:var(--vt-sm) var(--vt-md);
  background:var(--vt-surface-2);
  border:1px solid var(--vt-border);
  border-radius:var(--vt-r-lg);
  font-size:13px;
  color:var(--vt-text);
}
.controls select{
  padding:6px 28px 6px 10px;
  background:var(--vt-surface-deep);
  border:1px solid var(--vt-border-strong);
  border-radius:var(--vt-r);
  color:var(--vt-text);
  font-family:inherit;
  font-size:13px;
  outline:none;cursor:pointer;
  appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--vt-muted) 50%),linear-gradient(135deg,var(--vt-muted) 50%,transparent 50%);
  background-position:calc(100% - 15px) 50%,calc(100% - 10px) 50%;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat;
}
.controls select:focus{border-color:var(--vt-gold)}
.controls select option{background:var(--vt-surface-2)}

/* Banda de categoria: el degradado ambar del mockup, con el punto dorado
   a la izquierda y el rango a la derecha. */
.tier-section{
  margin-bottom:var(--vt-lg);
  border-radius:var(--vt-r-lg);
  border:1px solid var(--vt-border);
  background:var(--vt-surface-2);
  overflow:hidden;
}
.tier-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:var(--vt-sm);
  margin:0;
  padding:9px 14px;
  font-family:var(--vt-font-head);
  font-size:19px;
  font-weight:700;
  letter-spacing:0.06em;
  text-transform:uppercase;
}
.tier-title > span:first-child{display:flex;align-items:center;gap:var(--vt-sm)}
.tier-title > span:first-child::before{
  content:'';
  width:7px;height:7px;border-radius:var(--vt-r-full);
  background:currentColor;
}
.tier-subtitle{
  font-family:var(--vt-font-body);
  font-size:11px;
  font-weight:700;
  letter-spacing:0.05em;
  color:var(--vt-muted);
  text-transform:none;
}

/* Escalera de intensidad: mas oro cuanto mas alta la categoria. El nombre y
   el rango ya dicen cual es, asi que quien ordena es la opacidad del fondo
   (0.30 a 0.06). El texto es --vt-gold-soft en los cuatro: antes eran cuatro
   marrones a mano que no estaban en la paleta. */
.tier-entreno .tier-title{background:linear-gradient(90deg,rgba(245,158,11,0.30),transparent 70%);color:var(--vt-gold-soft)}
.tier-avanzado .tier-title{background:linear-gradient(90deg,rgba(245,158,11,0.22),transparent 70%);color:var(--vt-gold-soft)}
.tier-intermedio .tier-title{background:linear-gradient(90deg,rgba(245,158,11,0.14),transparent 70%);color:var(--vt-gold-soft)}
.tier-iniciacion .tier-title{background:linear-gradient(90deg,rgba(245,158,11,0.06),transparent 70%);color:var(--vt-gold-soft)}

table{width:100%;border-collapse:collapse;margin-top:0;table-layout:fixed}
th{
  padding:8px 10px;
  background:var(--vt-surface-3);
  color:var(--vt-muted);
  font-size:10px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;
  text-align:left;
  border-bottom:1px solid var(--vt-border-strong);
}
td{padding:9px 10px;border-bottom:1px solid var(--vt-border);color:var(--vt-text);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:var(--vt-surface-3)}

.rank-col{width:72px;text-align:center}
td.rank-col{color:var(--vt-muted);font-variant-numeric:tabular-nums}
.rating-col{width:96px;text-align:center}
/* El rating es el dato de la pagina: oro y condensada. */
td.rating-col{
  font-family:var(--vt-font-head);
  font-size:19px;font-weight:700;letter-spacing:0.02em;
  color:var(--vt-gold);
  font-variant-numeric:tabular-nums;
}
.fiabilidad-col{width:120px;text-align:center}
.name-col{font-weight:500;color:var(--vt-text);overflow-wrap:anywhere}
.name-col a{color:inherit;text-decoration:none}
.name-col a:hover{color:var(--vt-gold-light)}
.muted{color:var(--vt-muted)}

/* Cinco segmentos de fiabilidad. El color lo pone getFiabilidadConfig(), con
   el mismo rojo -> verde que explican las insignias de rating-info.html:
   --vt-loss, --vt-orange, --vt-yellow, --vt-lime y --vt-win. El segmento
   apagado y la cifra de RD tambien se escriben desde el script, en
   --vt-border-strong y --vt-muted. No se comenta ahi porque
   getFiabilidadConfig vive dentro de renderTable, que esta en el baseline de
   tools/code-size.mjs y solo puede encoger. */
.progress-segmented{
  display:inline-flex;
  align-items:center;
  gap:3px;
  padding:3px 4px;
  border:1px solid var(--vt-border-strong);
  border-radius:var(--vt-r-sm);
  background-color:var(--vt-surface-deep);
}
.progress-segment{
  width:7px;height:11px;
  border-radius:2px;
  transition:background-color .2s ease;
}

.info-btn{
  padding:9px 16px;
  background:transparent;
  border:1px solid var(--vt-border-gold);
  border-radius:var(--vt-r);
  color:var(--vt-gold-light);
  font-family:var(--vt-font-body);
  font-size:14px;font-weight:700;
  cursor:pointer;
  transition:background .15s ease,border-color .15s ease;
}
.info-btn:hover{background:rgba(245,158,11,0.12);border-color:var(--vt-gold)}
.info-btn[hidden]{display:none}

/* Movil: los anchos fijos de arriba no caben en 375px, se reducen aqui.
   Detalle en ai_context/tabla_de_rating_en_movil.md */
@media(max-width:560px){
  .tier-title{flex-direction:column;align-items:flex-start;gap:2px;font-size:17px;padding:8px 10px}
  th,td{padding:8px 4px;font-size:13px}
  th{font-size:9px}
  td.rating-col{font-size:16px}
  .rank-col{width:30px}
  .rating-col{width:66px}
  .fiabilidad-col{width:74px}
  .progress-segmented{gap:2px;padding:2px 3px}
  .progress-segment{width:5px;height:10px}
  .controls{font-size:12px;gap:var(--vt-sm);padding:var(--vt-sm)}
}
/* A 320 px el selector de fecha no cabe junto a su etiqueta y se salia 13 px
   de la tarjeta, que al llevar overflow:hidden lo cortaba en vez de
   desbordar. Que la etiqueta envuelva y el selector pueda encoger. */
.controls label{min-width:0;flex-wrap:wrap}
.controls select{max-width:100%;min-width:0}
</style>
</head>
<body>

<div class="vt-page">

  <div class="vt-cabecera">
    <button class="vt-volver" type="button" onclick="volverAtras()"><span class="ms ms--sm notranslate" translate="no" aria-hidden="true">arrow_back</span>Atrás</button>
    <img src="/image.png" alt="Víboras Team" width="88" height="88" style="border-radius:var(--vt-r-lg);filter:drop-shadow(0 4px 16px rgba(245,158,11,0.25))">
    <h1 class="vt-gold" style="margin-top:var(--vt-sm)">Rating</h1>
    <span class="vt-label">Víboras Ranking Circuit</span>
  </div>

  <div class="vt-card vt-card--accent">

    <div class="controls">
      <label style="display: flex; align-items: center; gap: 8px;">
        <span>Fecha:</span>
        <select id="ratingDate" onchange="handleFilterChange()">
          <option value="latest">Última disponible</option>
        </select>
      </label>

      <label style="cursor: pointer; display: flex; align-items: center; gap: 8px;">
        <input type="checkbox" id="toggleInactive" onchange="handleFilterChange()">
        <span>Incluir jugadores no activos</span>
      </label>

      <label style="display: flex; align-items: center; gap: 8px;">
        <span>Fiabilidad mínima:</span>
        <select id="minReliability" onchange="handleFilterChange()">
          <option value="any" selected>Cualquiera</option>
          <option value="very_low">Muy baja</option>
          <option value="low">Baja</option>
          <option value="medium">Media</option>
          <option value="high">Alta</option>
        </select>
      </label>

      <label style="display: flex; align-items: center; gap: 8px;">
        <input type="checkbox" id="toggleShowRD" onchange="handleFilterChange()">
        <span>Ver RD</span>
      </label>
    </div>

    <div id="ratingContainer">
      <div class="muted">Cargando ratings…</div>
    </div>

    <div class="vt-acciones">
      <button class="info-btn" onclick="window.location.href='/rating-info'">
        <span class="ms ms--sm notranslate" translate="no" aria-hidden="true">lightbulb</span>¿Cómo funciona el rating?
      </button>
      <!-- Sólo administradores; lo muestra rating-export.js. -->
      <button class="info-btn" id="exportPlayersBtn" type="button" hidden>
        <span class="ms ms--sm notranslate" translate="no" aria-hidden="true">download</span>Exportar jugadores
      </button>
    </div>

  </div>
</div>

<script src="/front/nivel-votos.js"></script>
<script src="/front/rating-inicial.js"></script>
<script>
// A donde lleva «Atrás»: lo dice quien trajo aqui, con ?volver= (lo pone
// /cuenta, que enlaza a esta pagina desde dos sitios). Solo rutas de este
// sitio —una que empiece por // o por http seria un redirect abierto—, la
// misma regla que `goBack()` en day.html. Sin ese parametro, a la portada,
// que es de donde se llega desde el menu.
function volverAtras(){
  const v = new URLSearchParams(location.search).get('volver') || '/'
  window.location = (v.startsWith('/') && !v.startsWith('//')) ? v : '/'
}

// ============================================================================
// GLICKO ENGINE
// ============================================================================

// El motor vive en /front/vt-glicko.js, uno solo para las tres paginas que lo
// usan. Se traen sus nombres a este ambito para que el resto del fichero
// siga leyendose igual que cuando el motor estaba pegado aqui.
const {
  Q,
  C_DAILY,
  INITIAL_RATING,
  INITIAL_RD,
  MIN_RD,
  MAX_RD,
  GlickoPlayer,
  g,
  expected,
  decayAllPlayersOneDay,
  getPlayerOrCreate,
  getTeamState,
  getEffectiveObservationR,
  getEffectiveObservationRd,
  clamp,
  getReliabilityWeight,
  updatePeriod
} = window.vtGlicko;

// El bucle de dias tambien vive en /front/vt-glicko.js: era el mismo en las dos
// paginas salvo tres lineas, que ahora son dos ganchos y un parametro.
const calculateEngineRatings = window.vtGlicko.calcularRatings;

// ============================================================================
// DATA FETCHING & UI RENDER
// ============================================================================

let cachedEntries = [];

// Leer los partidos del API tambien vive en /front/vt-glicko.js.
const fetchMatches = window.vtGlicko.leerPartidos;

function buildDateOptionsFromMatches(matches) {
  const isoToday = new Date().toISOString().split('T')[0];
  if (!matches || matches.length === 0) return [isoToday];

  const dates = Array.from(new Set(
    (matches || []).map(m => m && m.date).filter(Boolean)
  )).filter(date => date <= isoToday).sort();

  if (dates.length === 0) return [isoToday];

  const first = dates[0];
  let last = dates[dates.length - 1];
  if (last < isoToday) last = isoToday;

  const [y1,m1,d1] = first.split('-').map(Number);
  const [y2,m2,d2] = last.split('-').map(Number);
  let cur = Date.UTC(y1, m1 - 1, d1);
  const end = Date.UTC(y2, m2 - 1, d2);
  const ONE_DAY = 24 * 60 * 60 * 1000;
  const temp = [];
  while (cur <= end) {
    const dt = new Date(cur);
    const yyyy = dt.getUTCFullYear();
    const mm = String(dt.getUTCMonth() + 1).padStart(2, '0');
    const dd = String(dt.getUTCDate()).padStart(2, '0');
    temp.push(`${yyyy}-${mm}-${dd}`);
    cur += ONE_DAY;
  }
  return temp.reverse();
}

function populateDateDropdown(matches) {
  const sel = document.getElementById('ratingDate');
  if (!sel) return;
  const opts = buildDateOptionsFromMatches(matches);
  sel.innerHTML = '';
  const isoToday = new Date().toISOString().split('T')[0];
  const threshold = '2026-09-01';
  for (const v of opts) {
    const o = document.createElement('option');
    o.value = v;
    const parts = v.split('-');
    const display = `${parts[2]}/${parts[1]}/${parts[0]}`;
    let label = display;
    if (v === isoToday) label += ' (Actual)';
    if (v === threshold) label += ' (Nuevo comienzo)';
    o.textContent = label;
    sel.appendChild(o);
  }
  if (opts.includes(isoToday)) sel.value = isoToday;
  else if (opts.length > 0) sel.value = opts[0];
}

function filterMatchesForCutoff(allMatches, cutoffIso) {
  if (!allMatches) return [];
  let cutoff = cutoffIso;
  if (!cutoff) {
    const dates = allMatches.map(m => m.date).filter(Boolean).sort();
    cutoff = dates.length ? dates[dates.length - 1] : new Date().toISOString().split('T')[0];
  }

  const threshold = '2026-09-01';

  return allMatches.filter(m => {
    if (!m || !m.date) return false;
    if (m.date > cutoff) return false;

    const et = (m.event_type || '').toString().toLowerCase();
    const eid = (m.event_id !== undefined && m.event_id !== null) ? Number(m.event_id) : null;

    if (cutoff >= threshold) {
      if (!['ranked','grupo_liga','pozo','compas','doble_ko'].includes(et)) return false;
      if (eid === 23 || eid === 24) return false;
      return true;
    } else {
      if (et === 'legacy') return true;
      if (et === 'pozo') return (eid === 23 || eid === 24);
      if (['ranked','grupo_liga','compas','doble_ko'].includes(et)) return true;
      return false;
    }
  });
}

function loadNames(){
  const url = '/api/read?action=getNames';
  return fetch(url)
    .then(r => { if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
    .then(db => { return (db && db.names) ? db.names : []; })
    .catch(e => { return []; });
}

function computeRatings(entries, includeInactive = false, minReliability = 'any') {
  const registered = (!includeInactive && window._registeredNames && window._registeredNames.size > 0) ? window._registeredNames : null;

  let filtered = registered
    ? entries.filter(e => registered.has(e.name))
    : entries;

  if (minReliability !== 'any') {
    filtered = filtered.filter(e => {
      const rd = Number(e.rd);
      if (!Number.isFinite(rd)) return false;

      if (minReliability === 'very_low') return rd < 350;
      if (minReliability === 'low') return rd < 250;
      if (minReliability === 'medium') return rd < 190;
      if (minReliability === 'high') return rd < 140;
      return true;
    });
  }

  filtered.sort((a, b) => {
    if (b.rating !== a.rating) return b.rating - a.rating;
    return String(a.name || '').localeCompare(String(b.name || ''), 'es', { sensitivity: 'base', numeric: true });
  });

  const out = [];
  for (let i = 0; i < filtered.length; i++) {
    const e = filtered[i];
    let rank;
    if (i === 0) rank = 1;
    else if (filtered[i].rating === filtered[i - 1].rating) rank = out[i - 1].rank;
    else rank = i + 1;
    out.push({ rank, rating: e.rating, name: e.name, rd: e.rd });
  }
  return out;
}

// getFiabilidadConfig y TIER_DEFINITIONS viven en /front/vt-categorias.js, que
// los publica como globales: los usan esta tabla, rating-export.js y la
// tarjeta de /cuenta (ai_context/categorias_de_rating.md).

function renderTable(rows) {
  if (!rows || rows.length === 0) {
    document.getElementById('ratingContainer').innerHTML = '<div class="muted">No hay jugadores que coincidan con los filtros</div>';
    return;
  }

  function formatRating(num) {
    if (num === undefined || num === null || !Number.isFinite(num)) return '-';
    return num.toFixed(2).replace('.', ',');
  }

  const html = [];

  for (const tier of TIER_DEFINITIONS) {
    const tierRows = rows.filter(r => r.rating > tier.min && r.rating <= tier.max);
    if (tierRows.length === 0) continue;

    html.push(`
      <div class="tier-section tier-${tier.key}">
        <div class="tier-title">
          <span>${tier.title}</span>
          <span class="tier-subtitle">${tier.rangeText}</span>
        </div>
        <table aria-label="Rating ${tier.title}">
          <thead>
            <tr>
              <th class="rank-col">Pos</th>
              <th>Jugador</th>
              <th class="rating-col">Rating</th>
              <th class="fiabilidad-col">Fiabilidad</th>
            </tr>
          </thead>
          <tbody>
    `);

    for (const r of tierRows) {
      const { bars, color, label } = getFiabilidadConfig(r.rd);
      const ratingFormatted = formatRating(r.rating);

      let segmentsHtml = '';
      for (let i = 1; i <= 5; i++) {
        const activeBg = i <= bars ? color : 'var(--vt-border-strong)';
        segmentsHtml += `<span class="progress-segment" style="background-color: ${activeBg};"></span>`;
      }

      const progressHtml = `
        <div class="progress-segmented" title="${label}">
          ${segmentsHtml}
        </div>
      `;

      const showRD = (document.getElementById('toggleShowRD') && document.getElementById('toggleShowRD').checked) ? true : false;
      let reliabilityHtml;
      if (showRD) {
        const rdVal = (r.rd === undefined || r.rd === null || !Number.isFinite(Number(r.rd))) ? '-' : Number(Number(r.rd)).toFixed(2).replace('.', ',');
        reliabilityHtml = `<div style="color:var(--vt-muted);font-weight:400;font-variant-numeric:tabular-nums">${rdVal}</div>`;
      } else {
        reliabilityHtml = progressHtml;
      }

      const playerLink = `/players?player=${encodeURIComponent(r.name)}`;

      html.push(`<tr>
        <td class="rank-col">${r.rank}</td>
        <td class="name-col"><a href="${playerLink}" style="color:inherit; text-decoration:none; cursor:pointer;">${escapeHtml(r.name)}</a></td>
        <td class="rating-col">${ratingFormatted}</td>
        <td class="fiabilidad-col">${reliabilityHtml}</td>
      </tr>`);
    }

    html.push(`
          </tbody>
        </table>
      </div>
    `);
  }

  document.getElementById('ratingContainer').innerHTML = html.join('');
}

function handleFilterChange() {
  const showInactive = document.getElementById('toggleInactive').checked;
  const minReliability = document.getElementById('minReliability').value;
  const dateSel = document.getElementById('ratingDate');
  const selected = dateSel ? dateSel.value : 'latest';

  const names = window._allNames || [];
  const allMatches = window._allMatches || [];
  const matchesForDate = filterMatchesForCutoff(allMatches, selected);

  cachedEntries = calculateEngineRatings(names, matchesForDate, selected);

  const ranked = computeRatings(cachedEntries, showInactive, minReliability);
  renderTable(ranked);
}

function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, function(c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

async function init() {
  const [names, matches] = await Promise.all([
    loadNames(),
    fetchMatches(), window.vtNivel.listo, window.vtInicial.listo
  ]);

  window._registeredNames = new Set((names || []).map(n => String(n).trim()).filter(Boolean));
  window._allNames = names || [];
  window._allMatches = matches || [];

  populateDateDropdown(window._allMatches);

  handleFilterChange();
}

vtCargando.arranque(init, 'Calculando el rating');
</script>
<!-- defer: necesita window.vtMe, que pone auth-client.js, también diferido. -->
<script src="/front/excel-export.js" defer></script>
<script src="/front/rating-export.js" defer></script>
