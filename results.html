<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Votos del día</title>
<link rel="icon" href="/image.png" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<script src="/pwa.js" defer></script>
<meta name="apple-mobile-web-app-title" content="Viboras">
<meta name="theme-color" content="#121316">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/theme.css">

<style>
/* El panel de organizar lo genera toggleOrganizer() con HTML en linea y sin
   clases, asi que sus selects se estilan por selector de elemento dentro de
   #organizer: asi el script no se toca. */

/* Una hora votada, con sus nombres. */
.hour{
  display:flex;
  flex-wrap:wrap;
  align-items:baseline;
  gap:var(--vt-sm) var(--vt-md);
  margin-bottom:var(--vt-sm);
  padding:var(--vt-sm) var(--vt-md);
  background:var(--vt-surface-2);
  border:1px solid var(--vt-border);
  border-left:3px solid var(--vt-gold);
  border-radius:var(--vt-r);
  text-align:left;
}
.hour-title{
  flex:0 0 auto;
  min-width:86px;
  font-family:var(--vt-font-head);
  font-size:19px;
  font-weight:700;
  letter-spacing:0.03em;
  color:var(--vt-gold);
}
.names{display:flex;flex-wrap:wrap;gap:var(--vt-xs)}
.name{
  display:inline-block;
  padding:3px 10px;
  background:var(--vt-surface-3);
  border:1px solid var(--vt-border-strong);
  border-radius:var(--vt-r-full);
  color:var(--vt-text);
  font-size:13px;
  font-weight:500;
}

#organizer{text-align:left;max-width:420px;margin-left:auto;margin-right:auto}
#organizer label{
  display:block;
  margin-bottom:var(--vt-xs);
  font-size:12px;font-weight:600;letter-spacing:0.05em;text-transform:uppercase;
  color:var(--vt-muted);
}
#organizer select,#players select{
  width:100%;
  padding:10px 34px 10px 12px;
  margin:0 0 var(--vt-sm);
  background:var(--vt-surface-deep);
  border:1px solid var(--vt-border-strong);
  border-radius:var(--vt-r);
  color:var(--vt-text);
  font-family:var(--vt-font-body);
  font-size:15px;
  appearance:none;
  cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,var(--vt-muted) 50%),linear-gradient(135deg,var(--vt-muted) 50%,transparent 50%);
  background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;
  background-size:5px 5px,5px 5px;
  background-repeat:no-repeat;
}
#organizer select:focus,#players select:focus{outline:none;border-color:var(--vt-gold)}
#organizer option{background:var(--vt-surface-2)}
/* El script mete un <br> detras de cada select de jugador. */
#players br{display:none}

/* Compartir abre WhatsApp: se conserva su verde, que aqui es informacion
   sobre a donde lleva el boton y no decoracion. */
.share-btn{
  display:block;
  width:100%;
  margin-top:var(--vt-md);
  padding:12px 20px;
  background:#25D366;
  border:none;
  border-radius:var(--vt-r);
  color:#07301a;
  font-family:var(--vt-font-body);
  font-size:14px;font-weight:700;letter-spacing:0.02em;
  cursor:pointer;
  transition:background .15s ease;
}
.share-btn:hover{background:#1ebe5d}

.acciones{display:flex;flex-wrap:wrap;gap:var(--vt-sm);justify-content:center;margin-top:var(--vt-lg)}

@media(max-width:600px){
  .hour-title{min-width:0;width:100%}
  .acciones .vt-btn{flex:1;min-width:120px}
}
</style>
</head>
<body>

<div class="vt-page vt-page--narrow">

  <div style="text-align:center">
    <img src="/image.png" alt="Víboras Team" width="88" height="88" style="border-radius:var(--vt-r-lg);filter:drop-shadow(0 4px 16px rgba(245,158,11,0.25))">
    <div class="vt-label vt-gold" style="margin-top:var(--vt-sm)">Víboras Pádel Club</div>
  </div>

  <div class="vt-card vt-card--accent" style="text-align:center">

    <h1 id="title"></h1>

    <div id="results" style="margin-top:var(--vt-lg)"></div>

    <div class="acciones">
      <button class="vt-btn organize-btn" onclick="toggleOrganizer()">Organizar partido</button>
      <button class="vt-btn vt-btn--ghost" onclick="goBack()">Atrás</button>
    </div>

    <div id="organizer" style="display:none;margin-top:20px"></div>

  </div>
</div>

<script>

const params = new URLSearchParams(window.location.search)
const date = params.get("date")
const readonly = params.get("readonly")==="1"

const parts = date.split("-")
const formatted = `${parts[2]}/${parts[1]}/${parts[0]}`

document.getElementById("title").innerText = `Disponibilidad ${formatted}`

const container = document.getElementById("results")

let slotsData = {}

async function load(){

  const res = await fetch(`/api/read?action=getSlots&date=${date}`)
  const data = await res.json()

  slotsData = data

  for(let h=9; h<=21; h++){

    const time = `${h}:00`
    const names = data[time] || []

    if(names.length===0) continue

    const div = document.createElement("div")
    div.className = "hour"

    const title = document.createElement("div")
    title.className = "hour-title"
    title.innerText = `${time} (${names.length})`

    div.appendChild(title)

    const list = document.createElement("div")
    list.className = "names"

    names.forEach(n=>{
      const span = document.createElement("span")
      span.className = "name"
      span.innerText = n
      list.appendChild(span)
    })

    div.appendChild(list)

    container.appendChild(div)
  }
}

function goBack(){

  if(readonly){
    window.location="/"
  }else{
    window.location=`/day?date=${date}`
  }
}

function toggleOrganizer(){

  const div = document.getElementById("organizer")

  if(div.style.display==="none"){

    div.style.display="block"

    div.innerHTML = `
      <div style="margin-bottom:10px">
        <label>Polideportivo</label><br>
        <select id="venue">
          <option>Polideportivo San Ignacio</option>
          <option>Polideportivo Zorroza</option>
          <option>Polideportivo Artxanda</option>
        </select>
      </div>

      <div style="margin-bottom:10px">
        <label>Hora inicio</label><br>
        <select id="start" onchange="updatePlayers()"></select>
      </div>

      <div style="margin-bottom:10px">
        <label>Hora fin</label><br>
        <select id="end" onchange="updatePlayers()"></select>
      </div>

      <div id="players" style="margin-top:15px"></div>

      <button class="share-btn" onclick="shareMatch()">Compartir partido</button>
    `

    fillHours()

  }else{

    div.style.display="none"

  }
}

function fillHours(){

  const start = document.getElementById("start")
  const end = document.getElementById("end")

  for(let h=9; h<=21; h++){

    const label = String(h).padStart(2,"0")+":00"

    start.innerHTML += `<option value="${h}">${label}</option>`
    end.innerHTML += `<option value="${h}">${label}</option>`

  }

}

function playersAvailable(start,end){

  let common=null

  for(let h=start; h<end; h++){

    const key=`${h}:00`

    const names = slotsData[key] || []

    if(common===null){
      common=[...names]
    }else{
      common=common.filter(n=>names.includes(n))
    }

  }

  return common || []

}

function updatePlayers(){

  const start=parseInt(document.getElementById("start").value)
  const end=parseInt(document.getElementById("end").value)

  if(end<=start) return

  const players=playersAvailable(start,end)

  const container=document.getElementById("players")

  container.innerHTML=""

  if(players.length<4){

    container.innerHTML = `
      <div style="margin-bottom:10px; color:#c0392b;">
        Atención: no hay suficientes jugadores en esta franja horaria para generar un partido completo
      </div>
    `

  }

  for(let i=1;i<=4;i++){

    const select=document.createElement("select")

    select.id="j"+i

    select.innerHTML=`<option value="">Jugador ${i}</option>`

    players.forEach(p=>{
      select.innerHTML+=`<option value="${p}">${p}</option>`
    })

    select.addEventListener("change",updateDropdowns)

    container.appendChild(select)

    container.appendChild(document.createElement("br"))

  }

}

function updateDropdowns(){

  const selected=[]

  for(let i=1;i<=4;i++){

    const val=document.getElementById("j"+i).value

    if(val) selected.push(val)

  }

  for(let i=1;i<=4;i++){

    const select=document.getElementById("j"+i)

    const current=select.value

    const options=[...select.options]

    options.forEach(o=>{

      if(o.value==="" || o.value===current){

        o.hidden=false

      }else if(selected.includes(o.value)){

        o.hidden=true

      }else{

        o.hidden=false

      }

    })

  }

}

function shareMatch(){

  const start=parseInt(document.getElementById("start").value)
  const end=parseInt(document.getElementById("end").value)

  if(end<=start){
    alert("La hora fin debe ser mayor")
    return
  }

  const players=[j1.value,j2.value,j3.value,j4.value]

  const filled = players.filter(p => p !== "")
  const unique = new Set(filled)

  if(unique.size !== filled.length){
    alert("Los jugadores deben ser distintos")
    return
  }

  const venue=document.getElementById("venue").value

  const d=new Date(date)

  const weekday=d.toLocaleDateString("es-ES",{weekday:"long"})
  const day=d.getDate()
  const month=d.toLocaleDateString("es-ES",{month:"long"})

  const startStr=String(start).padStart(2,"0")+":00"
  const endStr=String(end).padStart(2,"0")+":00"

  const msg=
`🗓️${weekday} ${day} de ${month}
🕋${venue}
⏰Hora ${startStr} a ${endStr}
🎾${players[0] || ""}
🎾${players[1] || ""}
🎾${players[2] || ""}
🎾${players[3] || ""}`

  const url="https://wa.me/?text="+encodeURIComponent(msg)

  window.open(url,"_blank")

}

load()

</script>

</body>
</html>
